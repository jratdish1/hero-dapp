# http-context map for herobase.io SEO redirects.
# Install as /etc/nginx/conf.d/herobase-seo-map.conf
map $uri $hero_seo_redirect {
    default "";
    /farm /bootcamp;
    /farm/ /bootcamp;
    /dapp-farm /bootcamp;
    /dapp-farm/ /bootcamp;
    /stake-base /stake/base;
    /stake-base/ /stake/base;
    /stake-dai /stake/dai;
    /stake-dai/ /stake/dai;
    /nfts /nft;
    /nfts/ /nft;
    /ai-assistant /ai;
    /ai-assistant/ /ai;
    /able-bots /bots;
    /able-bots/ /bots;
    /liberty-swap /swap;
    /liberty-swap/ /swap;
    /buy-and-burn /burn;
    /buy-and-burn/ /burn;
    /pools /dex-analytics;
    /pools/ /dex-analytics;
    /stake/hero /stake/dai;
    /stake/hero/ /stake/dai;
    /whitepaper https://docs.vicfoundation.com;
    /whitepaper/ https://docs.vicfoundation.com;
}
