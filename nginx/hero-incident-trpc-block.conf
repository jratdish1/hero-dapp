# HERO incident write block, restored 2026-11-16 (owner GO t81u).
# Original map from 2026-10-07 EXACT GO (b), extended 8:18/8:20 PM PT.
# 1 = non-GET/HEAD request to a tRPC write procedure (alone or in a comma-joined batch)
# under /trpc/ or /api/trpc/. Response is 403 JSON (owner GO 2026-11-16; Oct 7 used 503).
map "$request_method:$uri" $hero_incident_trpc_block {
    default 0;
    "~^(?!(?:GET|HEAD):)[A-Z]+:/(?:api/)?trpc/(?:[^/]*,)?(?:dao\.[^,/]+|raffle\.enter|spin\.[^,/]+|dca\.[^,/]+|limitOrder\.[^,/]+|swap\.record)(?:,|/?$)" 1;
}
