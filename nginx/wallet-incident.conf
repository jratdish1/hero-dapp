# HERO incident protections for wallet.herobase.io, restored 2026-11-16.
if ($hero_incident_trpc_block) { rewrite ^ /__hero_incident_trpc_403 last; }
location = /__hero_incident_trpc_403 {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 403 '{"error":"Paused for maintenance (HERO incident)"}';
}
location ~* ^/(?:swap|nft)(?:/.*)?$ {
    add_header Cache-Control "no-store" always;
    try_files /maintenance-swap-nft.html =503;
}
