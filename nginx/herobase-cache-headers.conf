# ============================================================
# HERO Dapp — Cache-Busting + Security Header Configuration
# Include this in the herobase.io server block.
# ============================================================

# IMPORTANT: Nginx stops inheriting parent add_header directives whenever a
# child location defines any add_header of its own. Every location below that
# adds cache/CORS headers therefore repeats the complete security-header set.

# ─── Global Security Headers ───────────────────────────────────
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-XSS-Protection "1; mode=block" always;
# CSP: strict external scripts/styles; transitional inline style attributes only.
# Remove style-src-attr 'unsafe-inline' after the tracked application/third-party style inventory reaches zero.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https: https://*.manus.computer https://*.manus.space; connect-src 'self' https://rpc.pulsechain.com https://mainnet.base.org https://api.dexscreener.com wss://relay.walletconnect.com wss://relay.walletconnect.org https://*.walletconnect.com https://*.walletconnect.org https://*.reown.com https://*.manus.computer https://*.manus.space https://api.manus.im https://switch.win https://*.switch.win; frame-src 'self' https://*.walletconnect.com https://*.walletconnect.org https://app.safe.global https://app.squirrelswap.pro https://*.squirrelswap.pro https://transferto.xyz https://*.transferto.xyz https://www.youtube.com https://youtube.com https://libertyswap.finance https://switch.win https://*.switch.win; media-src 'self' https: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://app.safe.global; upgrade-insecure-requests;" always;

# ─── Gzip Compression ─────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    application/javascript
    application/json
    application/xml
    text/css
    text/plain
    text/xml
    image/svg+xml
    font/woff2
    font/woff
    application/font-ttf;

# ─── Hashed Assets: Cache Forever ─────────────────────────────
# Vite emits assets under dist/public/assets with content-hashed names.
location ^~ /assets/ {
    alias /var/www/hero-dapp/dist/public/assets/;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https: https://*.manus.computer https://*.manus.space; connect-src 'self' https://rpc.pulsechain.com https://mainnet.base.org https://api.dexscreener.com wss://relay.walletconnect.com wss://relay.walletconnect.org https://*.walletconnect.com https://*.walletconnect.org https://*.reown.com https://*.manus.computer https://*.manus.space https://api.manus.im https://switch.win https://*.switch.win; frame-src 'self' https://*.walletconnect.com https://*.walletconnect.org https://app.safe.global https://app.squirrelswap.pro https://*.squirrelswap.pro https://transferto.xyz https://*.transferto.xyz https://www.youtube.com https://youtube.com https://libertyswap.finance https://switch.win https://*.switch.win; media-src 'self' https: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://app.safe.global; upgrade-insecure-requests;" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;

    etag off;
    if_modified_since off;
    add_header Last-Modified "" always;

    types {
        application/javascript js mjs;
        text/css css;
        image/svg+xml svg;
        font/woff2 woff2;
        font/woff woff;
        application/font-ttf ttf;
    }
}

# ─── index.html: Never Cache ──────────────────────────────────
location = / {
    proxy_pass http://localhost:3000;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https: https://*.manus.computer https://*.manus.space; connect-src 'self' https://rpc.pulsechain.com https://mainnet.base.org https://api.dexscreener.com wss://relay.walletconnect.com wss://relay.walletconnect.org https://*.walletconnect.com https://*.walletconnect.org https://*.reown.com https://*.manus.computer https://*.manus.space https://api.manus.im https://switch.win https://*.switch.win; frame-src 'self' https://*.walletconnect.com https://*.walletconnect.org https://app.safe.global https://app.squirrelswap.pro https://*.squirrelswap.pro https://transferto.xyz https://*.transferto.xyz https://www.youtube.com https://youtube.com https://libertyswap.finance https://switch.win https://*.switch.win; media-src 'self' https: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://app.safe.global; upgrade-insecure-requests;" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}

# ─── SPA Fallback ─────────────────────────────────────────────
location / {
    try_files $uri @app;
}

location @app {
    proxy_pass http://localhost:3000;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https: https://*.manus.computer https://*.manus.space; connect-src 'self' https://rpc.pulsechain.com https://mainnet.base.org https://api.dexscreener.com wss://relay.walletconnect.com wss://relay.walletconnect.org https://*.walletconnect.com https://*.walletconnect.org https://*.reown.com https://*.manus.computer https://*.manus.space https://api.manus.im https://switch.win https://*.switch.win; frame-src 'self' https://*.walletconnect.com https://*.walletconnect.org https://app.safe.global https://app.squirrelswap.pro https://*.squirrelswap.pro https://transferto.xyz https://*.transferto.xyz https://www.youtube.com https://youtube.com https://libertyswap.finance https://switch.win https://*.switch.win; media-src 'self' https: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://app.safe.global; upgrade-insecure-requests;" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

# ─── Service Worker: Strict No-Cache ──────────────────────────
location = /sw.js {
    proxy_pass http://localhost:3000;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https: https://*.manus.computer https://*.manus.space; connect-src 'self' https://rpc.pulsechain.com https://mainnet.base.org https://api.dexscreener.com wss://relay.walletconnect.com wss://relay.walletconnect.org https://*.walletconnect.com https://*.walletconnect.org https://*.reown.com https://*.manus.computer https://*.manus.space https://api.manus.im https://switch.win https://*.switch.win; frame-src 'self' https://*.walletconnect.com https://*.walletconnect.org https://app.safe.global https://app.squirrelswap.pro https://*.squirrelswap.pro https://transferto.xyz https://*.transferto.xyz https://www.youtube.com https://youtube.com https://libertyswap.finance https://switch.win https://*.switch.win; media-src 'self' https: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://app.safe.global; upgrade-insecure-requests;" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}
