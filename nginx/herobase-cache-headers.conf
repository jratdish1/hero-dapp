# ============================================================
# HERO Dapp — Cache-Busting + Security Header Configuration
# Include this in the herobase.io server block
# ============================================================
# AUDIT FIX 4.1: Security headers (apply globally in server block)
# AUDIT FIX 4.2: HTTPS enforcement (handled by Cloudflare + server block)
# AUDIT FIX 4.4: Expanded gzip types

# ─── Global Security Headers ───────────────────────────────────
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-XSS-Protection "1; mode=block" always;
# CSP: Allow self + WalletConnect + Cloudflare + inline styles (Tailwind)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.walletconnect.com https://*.walletconnect.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' https://*.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.com wss://*.walletconnect.org https://rpc.pulsechain.com https://mainnet.base.org https://*.cloudflare.com; font-src 'self' data:; frame-src 'self' https://*.walletconnect.com;" always;

# ─── Gzip Compression (expanded types) ────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    application/javascript
    application/json
    application/xml
    text/css
    text/plain
    text/xml
    image/svg+xml
    font/woff2
    font/woff
    application/font-ttf;

# ─── Hashed Assets: Cache Forever (immutable) ─────────────────
# Vite generates content-hashed filenames (e.g., index-DVvp3Pbm.js)
# so we can safely cache forever — new deploys get new filenames.
location /assets/ {
    alias /var/www/hero-dapp/public/assets/;
    
    # 1 year cache with immutable flag
    add_header Cache-Control "public, max-age=31536000, immutable";
    
    # Remove ETag/Last-Modified (hash IS the version)
    etag off;
    if_modified_since off;
    add_header Last-Modified "";
    
    # Ensure correct MIME types
    types {
        application/javascript js mjs;
        text/css css;
        image/svg+xml svg;
        font/woff2 woff2;
        font/woff woff;
        application/font-ttf ttf;
    }
}

# Font files with CORS (separate from /assets/ to avoid nested location)
location ~* ^/assets/.*\.(woff2?|ttf|eot)$ {
    alias /var/www/hero-dapp/public/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
}

# ─── index.html: Never Cache ──────────────────────────────────
location = / {
    proxy_pass http://localhost:3000;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
}

# ─── SPA Fallback: Never Cache HTML ───────────────────────────
location / {
    try_files $uri @app;
}

location @app {
    proxy_pass http://localhost:3000;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

# ─── Service Worker: Strict No-Cache ──────────────────────────
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    proxy_pass http://localhost:3000;
}
