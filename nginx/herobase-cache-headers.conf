# ============================================================
# HERO Dapp — Cache-Busting Header Configuration
# Include this in the herobase.io server block
# ============================================================
# Vite generates content-hashed filenames (e.g., index-DVvp3Pbm.js)
# so we can safely cache forever — new deploys get new filenames.

# Hashed assets: cache forever (immutable)
location /assets/ {
    alias /var/www/hero-dapp/public/assets/;
    
    # 1 year cache with immutable flag
    add_header Cache-Control "public, max-age=31536000, immutable";
    
    # Remove ETag/Last-Modified (hash IS the version)
    etag off;
    if_modified_since off;
    add_header Last-Modified "";
    
    # Ensure correct MIME types
    types {
        application/javascript js mjs;
        text/css css;
        image/svg+xml svg;
        font/woff2 woff2;
        font/woff woff;
        application/font-ttf ttf;
    }
    
    # Gzip for text assets
    gzip on;
    gzip_types application/javascript text/css image/svg+xml;
    gzip_min_length 256;
}

# Font files with CORS (separate from /assets/ to avoid nested location)
location ~* ^/assets/.*\.(woff2?|ttf|eot)$ {
    alias /var/www/hero-dapp/public/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
}

# index.html: never cache (always get latest asset references)
location = / {
    proxy_pass http://localhost:3000;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
}

# SPA fallback: never cache HTML responses
location / {
    try_files $uri @app;
}

location @app {
    proxy_pass http://localhost:3000;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

# Service worker: strict no-cache to allow updates
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    proxy_pass http://localhost:3000;
}
