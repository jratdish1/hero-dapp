# HERO incident protections, restored 2026-11-16 on the current herobase.conf layout.
# Include in both :80 and :443 herobase.io server blocks, before or with the SEO allowlist.

# (a) tRPC write block: original procedure list, 403 JSON (owner GO t81u).
if ($hero_incident_trpc_block) { rewrite ^ /__hero_incident_trpc_403 last; }
location = /__hero_incident_trpc_403 {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 403 '{"error":"Paused for maintenance (HERO incident)"}';
}

# (b) /swap and /nft hard-load maintenance page. Query strings and subpaths included.
# frame-src is the Oct 7 interim list without SquirrelSwap (edge CSP may still allow it).
add_header Content-Security-Policy "frame-src 'self' https://*.walletconnect.com https://*.walletconnect.org https://app.safe.global https://transferto.xyz https://*.transferto.xyz https://switch.win https://*.switch.win https://www.youtube.com https://youtube.com" always;
location ~* ^/(?:swap|nft)(?:/.*)?$ {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "frame-src 'self' https://*.walletconnect.com https://*.walletconnect.org https://app.safe.global https://transferto.xyz https://*.transferto.xyz https://switch.win https://*.switch.win https://www.youtube.com https://youtube.com" always;
    try_files /maintenance-swap-nft.html =503;
}

# Restore /api and /trpc proxy to hero-dapp-server :3000 (missing since the Oct 18 rebuild).
# GET queries are proxied; write procedures are 403'd above before this location.
location = /api {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /trpc {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /trpc/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
