# HERO V3 contracts. Owner: VETS (jratdish1).
# Local compile/test only. No RPC keys, no private keys, no broadcast config here.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["vendor"]
optimizer = true
optimizer_runs = 200
# Conservative EVM target valid on both Base and PulseChain (the old HERO/B&B used paris).
evm_version = "paris"
auto_detect_solc = true
bytecode_hash = "ipfs"
# The local fork dry-run script reads compiled artifacts (read-only).
fs_permissions = [{ access = "read", path = "./out-dryrun" }]
remappings = [
  # HeroABLE (Base) was verified against OpenZeppelin 5.0.0; everything else used 4.9.0.
  "src/base/HeroABLE.sol:@openzeppelin/contracts/=vendor/oz-5.0.0/contracts/",
  "test/HeroABLE.Base.t.sol:@openzeppelin/contracts/=vendor/oz-5.0.0/contracts/",
  # HeroSingleSidedStaking (ported from hero-dapp #119) uses OpenZeppelin 5.6.1 (hero-dapp pnpm-lock pin).
  "src/staking/:@openzeppelin/contracts/=vendor/oz-5.6.1/contracts/",
  "test/staking/:@openzeppelin/contracts/=vendor/oz-5.6.1/contracts/",
  "@openzeppelin/contracts/=vendor/oz-4.9.0/contracts/",
  "@uniswap/=vendor/uniswap-v2/",
]

# OZ 5.6.1 (staking) uses the Cancun MCOPY opcode (utils/Bytes.sol), so the staking port and its
# tests compile for cancun. Base supports Cancun; PulseChain does NOT (eth_call probe: "invalid opcode:
# MCOPY" / "TSTORE"), so this staking build is Base-only. See contracts/v3/STAKING.md, PulseChain section.
additional_compiler_profiles = [{ name = "staking-cancun", evm_version = "cancun" }]
compilation_restrictions = [
  { paths = "src/staking/**", evm_version = "cancun" },
  { paths = "test/staking/**", evm_version = "cancun" },
  { paths = "vendor/oz-5.6.1/**", evm_version = "cancun" },
]
# The default test EVM is paris, which cannot execute cancun bytecode, so staking tests run under
# their own profile:  FOUNDRY_PROFILE=staking forge test -vv
no_match_path = "test/staking/*"

[profile.staking]
evm_version = "cancun"
match_path = "test/staking/*"
no_match_path = "__none__"

[fmt]
ignore = ["vendor/**", "src/**"]

[lint]
lint_on_build = false
