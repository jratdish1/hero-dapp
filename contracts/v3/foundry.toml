# HERO V3 contracts. Owner: VETS (jratdish1).
# Local compile/test only. No RPC keys, no private keys, no broadcast config here.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["vendor"]
optimizer = true
optimizer_runs = 200
# Conservative EVM target valid on both Base and PulseChain (the old HERO/B&B used paris).
evm_version = "paris"
auto_detect_solc = true
bytecode_hash = "ipfs"
remappings = [
  # HeroABLE (Base) was verified against OpenZeppelin 5.0.0; everything else used 4.9.0.
  "src/base/HeroABLE.sol:@openzeppelin/contracts/=vendor/oz-5.0.0/contracts/",
  "test/HeroABLE.Base.t.sol:@openzeppelin/contracts/=vendor/oz-5.0.0/contracts/",
  "@openzeppelin/contracts/=vendor/oz-4.9.0/contracts/",
  "@uniswap/=vendor/uniswap-v2/",
]

[fmt]
ignore = ["vendor/**", "src/**"]

[lint]
lint_on_build = false
