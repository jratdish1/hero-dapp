name: Temporary HeroBase production credential preparation v2

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  prepare:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.event.pull_request.number == 59 &&
      github.event.pull_request.head.ref == 'ops/herobase-deploy-monitor-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: temporary-herobase-production-credential-prep-v2
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VDS_HOST: ${{ secrets.VDS_HOST }}
      VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
      VPS1_HOST: ${{ secrets.VPS1_HOST }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      TRACKER_ISSUE: '43'

    steps:
      - name: Resolve audited current-main release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          api_get() {
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' "$1"
          }
          deadline=$((SECONDS + 2100))
          while [ "$SECONDS" -lt "$deadline" ]; do
            main_sha="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -r '.object.sha')"
            [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
            closed="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls?state=closed&head=jratdish1:fix/dao-ownership-production-20260726&base=main&per_page=100")"
            merged_sha="$(jq -r '[.[] | select(.merged_at != null)] | sort_by(.number) | last.merge_commit_sha // empty' <<<"$closed")"
            if [ -n "$merged_sha" ] && [ "$main_sha" = "$merged_sha" ]; then
              ci_id="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml" | jq -r '.id')"
              sec_id="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/security-and-quality.yml" | jq -r '.id')"
              ci="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$ci_id/runs?branch=main&event=push&head_sha=$main_sha&per_page=100" | jq -c --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha==$sha and .event=="push" and .run_attempt==1)] | sort_by(.id) | last // empty')"
              sec="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$sec_id/runs?branch=main&event=push&head_sha=$main_sha&per_page=100" | jq -c --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha==$sha and .event=="push" and .run_attempt==1)] | sort_by(.id) | last // empty')"
              if [ -n "$ci" ] && [ -n "$sec" ] && \
                 [ "$(jq -r '.status' <<<"$ci")" = completed ] && [ "$(jq -r '.conclusion' <<<"$ci")" = success ] && \
                 [ "$(jq -r '.status' <<<"$sec")" = completed ] && [ "$(jq -r '.conclusion' <<<"$sec")" = success ]; then
                echo "release_sha=$main_sha" >> "$GITHUB_OUTPUT"
                echo "ci_run_id=$(jq -r '.id' <<<"$ci")" >> "$GITHUB_OUTPUT"
                echo "security_run_id=$(jq -r '.id' <<<"$sec")" >> "$GITHUB_OUTPUT"
                printf 'RELEASE_READY=%s\n' "$main_sha"
                exit 0
              fi
            fi
            sleep 20
          done
          echo 'Release gate did not become ready' >&2
          exit 75

      - name: Establish pinned VDS-M route
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "$VDS_HOST" ] || missing+=(VDS_HOST)
          [ -n "$VDS_SSH_KEY" ] || missing+=(VDS_SSH_KEY)
          [ -n "$VPS1_HOST" ] || missing+=(VPS1_HOST)
          [ -n "$CF_ZONE_ID" ] || missing+=(CF_ZONE_ID)
          if [ "${#missing[@]}" -ne 0 ]; then printf 'Missing: %s\n' "${missing[@]}" >&2; exit 78; fi
          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VDS_SSH_KEY" > "$HOME/.ssh/vds_key"
          ssh-keygen -y -f "$HOME/.ssh/vds_key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$VDS_HOST" > "$HOME/.ssh/vds_known_hosts" 2>/dev/null
          [ -s "$HOME/.ssh/vds_known_hosts" ]
          test "$(ssh-keygen -lf "$HOME/.ssh/vds_known_hosts" | awk '{print $2}')" = \
            'SHA256:EdmFXzo/0Tw9jlbH+tNfBGcRGDf1TQu8m0LWiobRXFY'
          chmod 600 "$HOME/.ssh/vds_key" "$HOME/.ssh/vds_known_hosts"

      - name: Provision restricted identity, scoped Cloudflare token, and six protected secrets
        id: provision
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          AUTH_CI_RUN_ID: ${{ steps.release.outputs.ci_run_id }}
          AUTH_SECURITY_RUN_ID: ${{ steps.release.outputs.security_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/vds_key" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/vds_known_hosts" \
            "root@$VDS_HOST" \
            bash -s -- "$GITHUB_REPOSITORY" "$VPS1_HOST" "$CF_ZONE_ID" "$RELEASE_SHA" "$AUTH_CI_RUN_ID" "$AUTH_SECURITY_RUN_ID" <<'VDS' \
            | tee credential-prep-v2-receipt.txt
          set -Eeuo pipefail
          REPO="$1"; VPS1_HOST="$2"; CF_ZONE_ID="$3"; RELEASE_SHA="$4"; CI_RUN="$5"; SECURITY_RUN="$6"
          DEPLOY_USER='hero-deploy'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"; unset cf_token global_email global_key candidate' EXIT
          umask 077

          test "$(gh api user --jq .login)" = jratdish1
          test "$(gh api "repos/$REPO" --jq .full_name)" = "$REPO"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh-keygen -F "$(ssh -G vps1 | awk '$1=="hostname"{print $2;exit}')" -f /root/.ssh/known_hosts >/dev/null
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes vps1 'test "$(id -u)" = 0' >/dev/null

          python3 - "$tmp/cloudflare.json" <<'PY'
          from pathlib import Path
          import json,re,sys
          token_names={'CF_API_TOKEN','CLOUDFLARE_API_TOKEN','CF_TOKEN','CLOUDFLARE_TOKEN'}
          email_names={'CF_EMAIL','CLOUDFLARE_EMAIL','CF_API_EMAIL'}
          key_names={'CF_KEY','CLOUDFLARE_KEY','CF_GLOBAL_API_KEY','CLOUDFLARE_GLOBAL_API_KEY','CLOUDFLARE_API_KEY','CF_API_KEY','GLOBAL_API_KEY'}
          result={'tokens':[]}
          for path in [Path('/root/.vets/herobase_cf_cache_token'),Path('/opt/apex-agent/.cf_token_cache'),Path('/opt/apex-agent/.cf_token')]:
              try:value=path.read_text().strip()
              except OSError:continue
              if value and value not in result['tokens']:result['tokens'].append(value)
          for path in [Path('/root/.cloudflare_creds'),Path('/root/.env_architecture'),Path('/opt/apex-agent/.env')]:
              try:text=path.read_text(errors='ignore')
              except OSError:continue
              try:
                  obj=json.loads(text)
                  if isinstance(obj,dict):
                      for name,value in obj.items():
                          value=str(value).strip()
                          if name in token_names and value and value not in result['tokens']:result['tokens'].append(value)
                          if name in email_names and value and 'email' not in result:result['email']=value
                          if name in key_names and value and 'key' not in result:result['key']=value
              except Exception:pass
              for line in text.splitlines():
                  m=re.match(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*?)\s*$',line)
                  if not m:continue
                  name,value=m.group(1),m.group(2).strip()
                  if len(value)>=2 and value[0]==value[-1] and value[0] in "'\"":value=value[1:-1]
                  if name in token_names and value and value not in result['tokens']:result['tokens'].append(value)
                  if name in email_names and value and 'email' not in result:result['email']=value
                  if name in key_names and value and 'key' not in result:result['key']=value
          Path(sys.argv[1]).write_text(json.dumps(result));Path(sys.argv[1]).chmod(0o600)
          PY

          cf_token=''
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            verify="$(curl -4 --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $candidate" -H 'Content-Type: application/json' \
              https://api.cloudflare.com/client/v4/user/tokens/verify 2>/dev/null || true)"
            zone="$(curl -4 --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $candidate" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID" 2>/dev/null || true)"
            if jq -e '.success==true and .result.status=="active" and ((.errors//[])|length==0)' <<<"$verify" >/dev/null 2>&1 && \
               jq -e '.success==true and .result.name=="herobase.io" and .result.status=="active" and ((.errors//[])|length==0)' <<<"$zone" >/dev/null 2>&1; then
              cf_token="$candidate"; break
            fi
          done < <(jq -r '.tokens[]?' "$tmp/cloudflare.json")
          unset candidate verify zone

          if [ -z "$cf_token" ]; then
            global_email="$(jq -r '.email//empty' "$tmp/cloudflare.json")"
            global_key="$(jq -r '.key//empty' "$tmp/cloudflare.json")"
            [ -n "$global_email" ] && [ -n "$global_key" ] || { echo 'BLOCKED_CLOUDFLARE_AUTH_MISSING' >&2; exit 78; }
            auth=(-H "X-Auth-Email: $global_email" -H "X-Auth-Key: $global_key" -H 'Content-Type: application/json')
            zone="$(curl -4 --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
              "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID")"
            jq -e '.success==true and .result.name=="herobase.io" and .result.status=="active" and ((.errors//[])|length==0)' <<<"$zone" >/dev/null
            groups="$(curl -4 --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
              "${auth[@]}" https://api.cloudflare.com/client/v4/user/tokens/permission_groups)"
            group_id="$(jq -r '[.result[]|select((.name|ascii_downcase)=="cache purge")]|first.id//empty' <<<"$groups")"
            [ -n "$group_id" ] || { echo 'BLOCKED_CACHE_PURGE_PERMISSION_GROUP' >&2; exit 78; }
            payload="$(jq -nc --arg name "HeroBase deploy cache purge $(date -u +%Y%m%dT%H%M%SZ)" --arg zone "$CF_ZONE_ID" --arg group "$group_id" \
              '{name:$name,policies:[{effect:"allow",resources:{("com.cloudflare.api.account.zone."+$zone):"*"},permission_groups:[{id:$group}]}]}')"
            created="$(curl -4 --fail-with-body --silent --show-error --connect-timeout 10 --max-time 60 \
              -X POST "${auth[@]}" https://api.cloudflare.com/client/v4/user/tokens --data "$payload")"
            jq -e '.success==true and ((.errors//[])|length==0) and (.result.value|length>20)' <<<"$created" >/dev/null
            cf_token="$(jq -r '.result.value' <<<"$created")"
            install -d -m 700 /root/.vets
            printf '%s' "$cf_token" > /root/.vets/herobase_cf_cache_token
            chmod 600 /root/.vets/herobase_cf_cache_token
            printf 'CF_TOKEN_SOURCE=CREATED_SCOPED\n'
          else
            printf 'CF_TOKEN_SOURCE=REUSED_VALID_SCOPED\n'
          fi

          verify="$(curl -4 --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $cf_token" -H 'Content-Type: application/json' \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          jq -e '.success==true and .result.status=="active" and ((.errors//[])|length==0)' <<<"$verify" >/dev/null

          ssh-keygen -q -t ed25519 -N '' -C github-actions-hero-deploy -f "$tmp/deploy_key"
          public_key="$(cat "$tmp/deploy_key.pub")"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            vps1 bash -s -- "$DEPLOY_USER" "$public_key" <<'VPS1'
          set -Eeuo pipefail
          user="$1"; public_key="$2"
          id "$user" >/dev/null 2>&1 || useradd --create-home --shell /bin/bash "$user"
          test "$(id -u "$user")" -ge 1000
          install -d -m 700 -o "$user" -g "$user" "/home/$user/.ssh"
          auth="/home/$user/.ssh/authorized_keys"; touch "$auth"; chown "$user:$user" "$auth"; chmod 600 "$auth"
          temp="$(mktemp)"; awk '!/github-actions-hero-deploy$/' "$auth" > "$temp"; printf '%s\n' "$public_key" >> "$temp"
          install -m 600 -o "$user" -g "$user" "$temp" "$auth"; rm -f "$temp"
          VPS1

          known="$tmp/known_hosts"
          ssh-keygen -F "$VPS1_HOST" -f /root/.ssh/known_hosts 2>/dev/null | awk '!/^#/' > "$known"
          [ -s "$known" ]
          chmod 600 "$known"
          ssh -i "$tmp/deploy_key" -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            "$DEPLOY_USER@$VPS1_HOST" 'test "$(id -un)" = hero-deploy' >/dev/null

          printf '%s' "$VPS1_HOST" | gh secret set VPS1_HOST --env production --repo "$REPO"
          printf '%s' "$DEPLOY_USER" | gh secret set VPS1_USER --env production --repo "$REPO"
          gh secret set VPS1_SSH_KEY --env production --repo "$REPO" < "$tmp/deploy_key"
          gh secret set VPS1_KNOWN_HOSTS --env production --repo "$REPO" < "$known"
          printf '%s' "$cf_token" | gh secret set CF_API_TOKEN --env production --repo "$REPO"
          printf '%s' "$CF_ZONE_ID" | gh secret set CF_ZONE_ID --env production --repo "$REPO"
          unset cf_token
          required='CF_API_TOKEN CF_ZONE_ID VPS1_HOST VPS1_KNOWN_HOSTS VPS1_SSH_KEY VPS1_USER'
          actual="$(gh secret list --env production --repo "$REPO" --json name --jq 'map(.name)|sort|join(" ")')"
          test "$actual" = "$required"
          printf 'PRODUCTION_SECRET_NAMES=%s\n' "$actual"
          printf 'RELEASE_SHA=%s\nCI_RUN=%s\nSECURITY_RUN=%s\n' "$RELEASE_SHA" "$CI_RUN" "$SECURITY_RUN"
          printf 'VETS_SECRET_PREFLIGHT_READY_V2\n'
          VDS
          grep -q '^VETS_SECRET_PREFLIGHT_READY_V2$' credential-prep-v2-receipt.txt
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Post names-only credential receipt v2
        if: steps.provision.outputs.ready == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          CI_RUN: ${{ steps.release.outputs.ci_run_id }}
          SECURITY_RUN: ${{ steps.release.outputs.security_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          ## VETS production credential preparation v2 — COMPLETE

          - Release SHA: \`$RELEASE_SHA\`
          - Exact-main CI run: \`$CI_RUN\`
          - Exact-main Security run: \`$SECURITY_RUN\`
          - Restricted direct VPS1 identity: **hero-deploy / PASS**
          - Scoped Cloudflare token: **VALID / SECRET NOT EXPOSED**
          - Required production environment secret names: **6/6 present**
          - Application mutation: **NO**
          - Cloudflare purge: **NO**
          EOF
          )"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE/comments" \
            --data "$(jq -nc --arg body "$body" '{body:$body}')" >/dev/null

      - name: Upload immutable credential receipt v2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: herobase-credential-prep-v2-${{ github.event.pull_request.head.sha }}
          path: credential-prep-v2-receipt.txt
          retention-days: 14
          if-no-files-found: error

      - name: Remove ephemeral VDS key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/vds_key" "$HOME/.ssh/vds_known_hosts"
