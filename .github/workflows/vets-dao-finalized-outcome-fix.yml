name: One-shot DAO finalized outcome fix

on:
  push:
    branches:
      - closeout/dao-rebuild-20260803
    paths:
      - .github/workflows/vets-dao-finalized-outcome-fix.yml

permissions:
  contents: write

concurrency:
  group: vets-dao-finalized-outcome-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'jratdish1/hero-dapp' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: closeout/dao-rebuild-20260803

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2f94c98389409ad20bc4865342a0a0e341f7e967"

      - name: Apply finalized outcome boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          from textwrap import dedent

          migration = Path('server/dao-advisory-migration.ts')
          text = migration.read_text()
          pattern = re.compile(
              r'(export function isAdvisoryPolicyStatusAllowed\(value: unknown\): boolean \{\n'
              r'  return \["pending", "active", "passed", "defeated", "cancelled"\]\.includes\(String\(value\)\);\n'
              r'\}\n)'
          )
          helper = dedent('''

          export interface FinalizedAdvisoryOutcome {
            status: "passed" | "defeated";
            endTime: Date;
            votesFor: number;
            votesAgainst: number;
            votesAbstain: number;
            quorum: number;
          }

          export function isFinalizedAdvisoryOutcomeValid(
            proposal: FinalizedAdvisoryOutcome,
            now = new Date(),
          ): boolean {
            if (now < proposal.endTime) return false;
            const counts = [proposal.votesFor, proposal.votesAgainst, proposal.votesAbstain, proposal.quorum];
            if (!counts.every(value => Number.isSafeInteger(value) && value >= 0) || proposal.quorum < 1) return false;
            const totalVotes = proposal.votesFor + proposal.votesAgainst + proposal.votesAbstain;
            if (!Number.isSafeInteger(totalVotes)) return false;
            const expected = totalVotes >= proposal.quorum && proposal.votesFor > proposal.votesAgainst
              ? "passed"
              : "defeated";
            return proposal.status === expected;
          }
          ''')
          text, count = pattern.subn(lambda match: match.group(1) + helper, text, count=1)
          if count != 1:
              raise SystemExit(f'migration helper replacement count={count}')

          old = dedent('''
                         OR proposal.quorum <> ?
                         OR proposal.status IN ('queued', 'executed')
                       ))
          ''').strip('\n')
          new = dedent('''
                         OR proposal.quorum <> ?
                         OR proposal.status IN ('queued', 'executed')
                         OR (
                           proposal.status IN ('passed', 'defeated')
                           AND (
                             proposal.endTime > CURRENT_TIMESTAMP(3)
                             OR (
                               proposal.status = 'passed'
                               AND NOT (
                                 proposal.votesFor + proposal.votesAgainst + proposal.votesAbstain >= proposal.quorum
                                 AND proposal.votesFor > proposal.votesAgainst
                               )
                             )
                             OR (
                               proposal.status = 'defeated'
                               AND proposal.votesFor + proposal.votesAgainst + proposal.votesAbstain >= proposal.quorum
                               AND proposal.votesFor > proposal.votesAgainst
                             )
                           )
                         )
                       ))
          ''').strip('\n')
          if old not in text:
              raise SystemExit('migration history marker missing')
          migration.write_text(text.replace(old, new, 1))

          guard = Path('scripts/check-dao-rollback-compatibility.mjs')
          text = guard.read_text()
          old = dedent('''
                           OR proposal.quorum <> 1
                           OR proposal.status IN ('queued', 'executed')
                         ))
          ''').strip('\n')
          new = dedent('''
                           OR proposal.quorum <> 1
                           OR proposal.status IN ('queued', 'executed')
                           OR (
                             proposal.status IN ('passed', 'defeated')
                             AND (
                               proposal.endTime > CURRENT_TIMESTAMP(3)
                               OR (
                                 proposal.status = 'passed'
                                 AND NOT (
                                   proposal.votesFor + proposal.votesAgainst + proposal.votesAbstain >= proposal.quorum
                                   AND proposal.votesFor > proposal.votesAgainst
                                 )
                               )
                               OR (
                                 proposal.status = 'defeated'
                                 AND proposal.votesFor + proposal.votesAgainst + proposal.votesAbstain >= proposal.quorum
                                 AND proposal.votesFor > proposal.votesAgainst
                               )
                             )
                           )
                         ))
          ''').strip('\n')
          if old not in text:
              raise SystemExit('rollback history marker missing')
          guard.write_text(text.replace(old, new, 1))

          test = Path('server/dao-advisory-migration.test.ts')
          text = test.read_text()
          import_marker = '  isConstraintEnforced,\n'
          if import_marker not in text:
              raise SystemExit('test import marker missing')
          text = text.replace(import_marker, import_marker + '  isFinalizedAdvisoryOutcomeValid,\n', 1)
          marker = '  it("requires the exact one-column unique wallet index", () => {'
          cases = dedent('''
            it("validates finalized advisory outcomes against deadline, quorum, and tallies", () => {
              const ended = new Date("2026-08-03T00:00:00.000Z");
              const now = new Date("2026-08-03T00:00:01.000Z");
              expect(isFinalizedAdvisoryOutcomeValid({
                status: "passed", endTime: ended, votesFor: 2, votesAgainst: 1, votesAbstain: 0, quorum: 1,
              }, now)).toBe(true);
              expect(isFinalizedAdvisoryOutcomeValid({
                status: "passed", endTime: new Date("2026-08-04T00:00:00.000Z"), votesFor: 2, votesAgainst: 1, votesAbstain: 0, quorum: 1,
              }, now)).toBe(false);
              expect(isFinalizedAdvisoryOutcomeValid({
                status: "passed", endTime: ended, votesFor: 0, votesAgainst: 0, votesAbstain: 0, quorum: 1,
              }, now)).toBe(false);
              expect(isFinalizedAdvisoryOutcomeValid({
                status: "defeated", endTime: ended, votesFor: 0, votesAgainst: 0, votesAbstain: 0, quorum: 1,
              }, now)).toBe(true);
              expect(isFinalizedAdvisoryOutcomeValid({
                status: "defeated", endTime: ended, votesFor: 2, votesAgainst: 1, votesAbstain: 0, quorum: 1,
              }, now)).toBe(false);
            });

          ''')
          if marker not in text:
              raise SystemExit('test insertion marker missing')
          test.write_text(text.replace(marker, cases + marker, 1))
          PY

      - name: Commit fix and remove controller
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/vets-dao-finalized-outcome-fix.yml
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(server/dao-advisory-migration.ts|server/dao-advisory-migration.test.ts|scripts/check-dao-rollback-compatibility.mjs|.github/workflows/vets-dao-finalized-outcome-fix.yml)$' || true)"
          test -z "$unexpected"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/dao-advisory-migration.ts server/dao-advisory-migration.test.ts scripts/check-dao-rollback-compatibility.mjs
          git commit -m 'fix(dao): validate finalized advisory outcomes at startup'
          git push origin HEAD:closeout/dao-rebuild-20260803
