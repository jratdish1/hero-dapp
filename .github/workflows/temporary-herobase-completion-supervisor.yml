name: HeroBase production completion supervisor

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: vets-herobase-production-completion-supervisor
  cancel-in-progress: false

jobs:
  complete:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.event.pull_request.number == 59 &&
      github.event.pull_request.head.ref == 'ops/herobase-deploy-monitor-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      VDS_HOST: ${{ secrets.VDS_HOST }}
      VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
      VPS1_HOST: ${{ secrets.VPS1_HOST }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      PATCH_BRANCH: fix/dao-ownership-production-final-v4-20260726
      TRACKER_ISSUE: '43'
      EXPECTED_VDS_ED25519: SHA256:EdmFXzo/0Tw9jlbH+tNfBGcRGDf1TQu8m0LWiobRXFY

    steps:
      - name: Checkout immutable temporary executor lane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ops/herobase-deploy-monitor-20260725
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Assemble hardened host and verification executors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supervisor-evidence
          python3 ops/patch-host-finalizer-v5b.py \
            ops/herobase-production-host-finalizer-v2.sh \
            "$RUNNER_TEMP/host-consumption-aware.sh"
          python3 ops/patch-host-finalizer-v6.py \
            "$RUNNER_TEMP/host-consumption-aware.sh" \
            "$RUNNER_TEMP/host-finalizer.sh"
          python3 ops/patch-final-verifier-v8.py \
            ops/herobase-production-final-verification-v2.sh \
            "$RUNNER_TEMP/verifier-long.sh"
          # Bound each observation cycle to 30 minutes; the supervisor retries safely.
          python3 - "$RUNNER_TEMP/verifier-long.sh" "$RUNNER_TEMP/verifier.sh" <<'PY'
          from pathlib import Path
          import sys
          text=Path(sys.argv[1]).read_text()
          old='for attempt in $(seq 1 360); do'
          if text.count(old) != 1:
              raise SystemExit(f'production wait-loop count was {text.count(old)}, expected 1')
          text=text.replace(old,'for attempt in $(seq 1 90); do',1)
          Path(sys.argv[2]).write_text(text)
          PY
          chmod 700 "$RUNNER_TEMP/host-finalizer.sh" "$RUNNER_TEMP/verifier.sh"
          bash -n "$RUNNER_TEMP/host-finalizer.sh"
          bash -n "$RUNNER_TEMP/verifier.sh"
          sha256sum \
            ops/cloudflare-token-recovery-v5.sh \
            "$RUNNER_TEMP/host-finalizer.sh" \
            "$RUNNER_TEMP/verifier.sh" \
            > supervisor-evidence/executor-sha256.txt

      - name: Establish pinned VDS route
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VDS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS1_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$CF_ZONE_ID" =~ ^[0-9a-fA-F]{32}$ ]]
          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VDS_SSH_KEY" > "$HOME/.ssh/vds_key"
          timeout --signal=TERM --kill-after=5s 15s \
            ssh-keygen -y -f "$HOME/.ssh/vds_key" >/dev/null
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3; do
            ssh-keyscan -T 10 -t ed25519 -H "$VDS_HOST" \
              >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
            [ -s "$HOME/.ssh/known_hosts" ] && break
            sleep $((attempt * 2))
          done
          [ -s "$HOME/.ssh/known_hosts" ]
          actual="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" | awk 'NR==1 {print $2}')"
          test "$actual" = "$EXPECTED_VDS_ED25519"
          chmod 600 "$HOME/.ssh/vds_key" "$HOME/.ssh/known_hosts"
          printf 'VDS_HOST_IDENTITY=PASS:%s\n' "$actual" \
            | tee supervisor-evidence/vds-host-identity.txt

      - name: Recover scoped Cloudflare token without exposing values
        shell: bash
        run: |
          set -euo pipefail
          remote_helper="/tmp/vets-cloudflare-token-recovery-supervisor-$GITHUB_RUN_ID.sh"
          scp \
            -i "$HOME/.ssh/vds_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            ops/cloudflare-token-recovery-v5.sh \
            "root@$VDS_HOST:$remote_helper"
          ssh \
            -i "$HOME/.ssh/vds_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "root@$VDS_HOST" \
            bash -s -- "$remote_helper" "$CF_ZONE_ID" <<'REMOTE'
          set -euo pipefail
          helper="$1"
          zone_id="$2"
          chmod 700 "$helper"
          CF_ZONE_ID="$zone_id" "$helper"
          rm -f "$helper"
          REMOTE

      - name: Execute bounded host, protected deploy, and verification cycles
        id: cycles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supervisor-evidence/cycles
          completed=false
          for cycle in 1 2 3; do
            printf '=== VETS COMPLETION CYCLE %s ===\n' "$cycle"
            rm -rf evidence final-evidence
            mkdir -p evidence

            set +e
            "$RUNNER_TEMP/host-finalizer.sh" \
              > >(tee "supervisor-evidence/cycles/host-$cycle.log") \
              2> >(tee "supervisor-evidence/cycles/host-$cycle.err" >&2)
            host_status=$?
            set -e
            printf '%s\n' "$host_status" > "supervisor-evidence/cycles/host-$cycle.exit"
            if [ "$host_status" -ne 0 ]; then
              if [ "$cycle" -lt 3 ]; then sleep $((cycle * 30)); continue; fi
              exit "$host_status"
            fi
            cp -a evidence "supervisor-evidence/cycles/host-$cycle-evidence"

            set +e
            "$RUNNER_TEMP/verifier.sh" \
              > >(tee "supervisor-evidence/cycles/verify-$cycle.log") \
              2> >(tee "supervisor-evidence/cycles/verify-$cycle.err" >&2)
            verify_status=$?
            set -e
            printf '%s\n' "$verify_status" > "supervisor-evidence/cycles/verify-$cycle.exit"
            if [ "$verify_status" -eq 0 ]; then
              completed=true
              cp -a final-evidence supervisor-evidence/final-evidence
              break
            fi
            if [ "$cycle" -lt 3 ]; then
              sleep $((cycle * 30))
            fi
          done
          test "$completed" = true
          echo 'completed=true' >> "$GITHUB_OUTPUT"

      - name: Record supervisor completion receipt
        if: steps.cycles.outputs.completed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          result='supervisor-evidence/final-evidence/FINAL_PRODUCTION_GRADE_A.json'
          jq -e '.grade == "A" and .decision == "PRODUCTION VERIFIED" and .critical == 0 and .high == 0 and .medium == 0 and .low == 0' "$result" >/dev/null
          jq -n \
            --arg supervisor_run_id "$GITHUB_RUN_ID" \
            --slurpfile result "$result" \
            '{supervisor_run_id:$supervisor_run_id,completed:true,final_result:$result[0]}' \
            > supervisor-evidence/SUPERVISOR_FINAL_RECEIPT.json

      - name: Upload complete supervisor evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: herobase-completion-supervisor-${{ github.event.pull_request.head.sha }}
          path: supervisor-evidence
          retention-days: 90
          if-no-files-found: error

      - name: Close mission lanes after verified production Grade A
        if: steps.cycles.outputs.completed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          repo_api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          write(){ curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -X "$1" -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -H 'X-GitHub-Api-Version: 2022-11-28' "$2" --data "$3" >/dev/null; }
          write PATCH "$repo_api/issues/61" "$(jq -nc --arg body 'CLOSED — superseded by the merged one-file DAO ownership correction. Single-sided staking and binding/snapshot DAO governance remain approved deferred work. This broad draft was not merged.' '{state:"closed",body:$body}')"
          write PATCH "$repo_api/issues/43" '{"state":"closed","state_reason":"completed"}'
          write PATCH "$repo_api/issues/59" "$(jq -nc --arg body 'CLOSED — temporary executor lane completed. HeroBase production Grade A evidence is preserved on Issue #43 and in the immutable completion-supervisor artifact. DO NOT MERGE.' '{state:"closed",body:$body}')"

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/vds_key" "$HOME/.ssh/known_hosts"
