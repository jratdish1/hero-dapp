name: Apply PR56 finalization

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-pr56-final-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.event.pull_request.number == 56 &&
      github.event.pull_request.head.ref == 'fix/production-controller-final-evidence-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      APPLY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/production-controller-final-evidence-20260725
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Apply exact bounded finalization
        id: finalizer
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            set -euo pipefail
            test "$GITHUB_HEAD_REF" = "fix/production-controller-final-evidence-20260725"
            test "$(git rev-parse HEAD)" = "$APPLY_HEAD_SHA"
            test "$(git log -1 --pretty=%s)" = "chore: execute PR56 finalization"
            python3 ops/pr56-finalize-v2.py
          } > pr56-finalize.log 2>&1
          status=$?
          cat pr56-finalize.log
          printf 'exit_status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload validated patched files and diagnostics
        if: always() && hashFiles('pr56-finalize.log') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr56-validated-patch-${{ github.event.pull_request.head.sha }}
          path: |
            pr56-finalize.log
            .github/workflows/deploy.yml
            DEPLOY_INSTRUCTIONS.md
          retention-days: 7
          if-no-files-found: error

      - name: Upload finalization evidence
        if: always() && hashFiles('pr56-finalization-evidence.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr56-finalization-evidence-${{ github.event.pull_request.head.sha }}
          path: pr56-finalization-evidence.json
          retention-days: 14
          if-no-files-found: error

      - name: Enforce finalization gate
        if: always()
        shell: bash
        run: |
          test "${{ steps.finalizer.outcome }}" = "success"
          test "${{ steps.finalizer.outputs.exit_status }}" = "0"
