name: One-shot generic focus readiness patch

on:
  push:
    branches:
      - closeout/csp-rebuild-20260802

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'fix(test): wait for mounted generic error heading'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Apply bounded readiness correction
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/vets-generic-focus-patch.py
          python3 -m py_compile scripts/vets-generic-focus-patch.py
          node --check scripts/check-generic-error-focus.mjs
          git diff --check

      - name: Commit exact correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VETS GitHub automation'
          git config user.email 'jratdish1@users.noreply.github.com'
          git add scripts/check-generic-error-focus.mjs
          git diff --cached --quiet && {
            echo 'Expected readiness correction produced no change' >&2
            exit 1
          }
          git commit -m 'fix(test): wait for mounted generic error heading'
          git push origin HEAD:closeout/csp-rebuild-20260802
