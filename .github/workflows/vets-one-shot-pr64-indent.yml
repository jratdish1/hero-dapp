name: vets-one-shot-pr64-indent

on:
  push:
    branches:
      - fix/production-ci-advisory-final-20260726
    paths:
      - .github/workflows/vets-one-shot-pr64-indent.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor == 'jratdish1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/production-ci-advisory-final-20260726
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize exact block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-generic-error-focus.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''    if (cleanupErrors.length > 0) {
              const existingCleanupErrors = Array.isArray(primary.cleanupErrors)
                ? primary.cleanupErrors.map(value => String(value))
                : [];
              primary.cleanupErrors = [...existingCleanupErrors, ...cleanupErrors];
            }
          '''
          # The prior workflow's heredoc indentation is stripped by YAML execution,
          # so also accept the exact current block.
          current = '''    if (cleanupErrors.length > 0) {
              const existingCleanupErrors = Array.isArray(primary.cleanupErrors)
                ? primary.cleanupErrors.map(value => String(value))
                : [];
              primary.cleanupErrors = [...existingCleanupErrors, ...cleanupErrors];
            }
          '''
          rendered = '''    if (cleanupErrors.length > 0) {
              const existingCleanupErrors = Array.isArray(primary.cleanupErrors)
                ? primary.cleanupErrors.map(value => String(value))
                : [];
              primary.cleanupErrors = [...existingCleanupErrors, ...cleanupErrors];
            }
          '''
          actual = '''    if (cleanupErrors.length > 0) {
          const existingCleanupErrors = Array.isArray(primary.cleanupErrors)
            ? primary.cleanupErrors.map(value => String(value))
            : [];
          primary.cleanupErrors = [...existingCleanupErrors, ...cleanupErrors];
        }
          '''
          desired = '''    if (cleanupErrors.length > 0) {
              const existingCleanupErrors = Array.isArray(primary.cleanupErrors)
                ? primary.cleanupErrors.map(value => String(value))
                : [];
              primary.cleanupErrors = [...existingCleanupErrors, ...cleanupErrors];
            }
          '''
          if actual not in text:
              raise SystemExit('FAIL-CLOSED: exact malformed block not found')
          path.write_text(text.replace(actual, desired, 1), encoding='utf-8')
          PY
          node --check scripts/check-generic-error-focus.mjs
          git diff --check

      - name: Commit and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/vets-one-shot-pr64-indent.yml
          git config user.name 'VETS GitHub automation'
          git config user.email 'jratdish1@users.noreply.github.com'
          git add scripts/check-generic-error-focus.mjs .github/workflows/vets-one-shot-pr64-indent.yml
          git diff --cached --check
          git commit -m 'style: normalize cleanup evidence merge block'
          git push origin HEAD:fix/production-ci-advisory-final-20260726
