name: Security and Quality

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Hidden Unicode scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          forbidden = {
              "\u200b": "ZERO WIDTH SPACE",
              "\u200c": "ZERO WIDTH NON-JOINER",
              "\u200d": "ZERO WIDTH JOINER",
              "\u2060": "WORD JOINER",
              "\ufeff": "BYTE ORDER MARK",
              "\u202a": "LEFT-TO-RIGHT EMBEDDING",
              "\u202b": "RIGHT-TO-LEFT EMBEDDING",
              "\u202c": "POP DIRECTIONAL FORMATTING",
              "\u202d": "LEFT-TO-RIGHT OVERRIDE",
              "\u202e": "RIGHT-TO-LEFT OVERRIDE",
          }

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          found = False

          for raw_path in tracked:
              if not raw_path:
                  continue
              path = Path(raw_path.decode("utf-8", "surrogateescape"))
              try:
                  data = path.read_bytes()
              except OSError as error:
                  print(f"FAIL-CLOSED: cannot read {path}: {error}", file=sys.stderr)
                  sys.exit(2)

              if b"\0" in data:
                  continue

              for character, label in forbidden.items():
                  needle = character.encode("utf-8")
                  if needle not in data:
                      continue
                  found = True
                  for line_number, line in enumerate(data.splitlines(), 1):
                      if needle in line:
                          print(f"{path}:{line_number}: forbidden {label}", file=sys.stderr)

          if found:
              sys.exit(1)
          PY

      - name: Secret pattern scan
        shell: bash
        run: |
          set +e
          grep -aRInP --exclude-dir=.git '(-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{30,}|(?<![A-Za-z0-9])sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16})' -- .
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Potential secret found'
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "Secret scanner failed with status $status"
            exit "$status"
          fi
