name: Security and Quality

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare exact-index scanner
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/scan_index.py" <<'PY'
          import re
          import subprocess
          import sys

          scan_kind = sys.argv[1]
          scope = sys.argv[2] if len(sys.argv) > 2 else "all"
          broad_prefixes = (".github/", "client/", "docs/", "tests/")
          client_prefixes = ("client/src/", "client/public/assets/")
          asset_prefix = "client/public/assets/"
          asset_scopes = {
              "asset-cytoscape": asset_prefix + "cytoscape.esm-DtBltrT8.js",
              "asset-html": asset_prefix + "html-GMplVEZG.js",
              "asset-index": asset_prefix + "index-C_ediWZk.js",
              "asset-less": asset_prefix + "less-B1dDrJ26.js",
              "asset-mermaid": asset_prefix + "mermaid.core-Bxgwn2-U.js",
              "asset-treemap": asset_prefix + "treemap-KMMF4GRG-qornxmMx.js",
          }
          suspect_assets = set(asset_scopes.values())

          def in_scope(path):
              if scope == "all":
                  return True
              if scope == "github":
                  return path.startswith(".github/")
              if scope in {"docs", "tests"}:
                  return path.startswith(scope + "/")
              if scope == "client-source":
                  return path.startswith("client/src/")
              if scope == "client-other":
                  return path.startswith("client/") and not path.startswith(client_prefixes)
              if scope in asset_scopes:
                  return path == asset_scopes[scope]
              if scope == "assets-other":
                  return path.startswith(asset_prefix) and path not in suspect_assets
              if scope == "other":
                  return not path.startswith(broad_prefixes)
              raise SystemExit(f"FAIL-CLOSED: unsupported path scope {scope}")

          hidden_patterns = {
              "\u200b".encode(): "U+200B ZERO WIDTH SPACE",
              "\u200c".encode(): "U+200C ZERO WIDTH NON-JOINER",
              "\u200d".encode(): "U+200D ZERO WIDTH JOINER",
              "\u2060".encode(): "U+2060 WORD JOINER",
              "\ufeff".encode(): "U+FEFF BYTE ORDER MARK",
              "\u202a".encode(): "U+202A LEFT-TO-RIGHT EMBEDDING",
              "\u202b".encode(): "U+202B RIGHT-TO-LEFT EMBEDDING",
              "\u202c".encode(): "U+202C POP DIRECTIONAL FORMATTING",
              "\u202d".encode(): "U+202D LEFT-TO-RIGHT OVERRIDE",
              "\u202e".encode(): "U+202E RIGHT-TO-LEFT OVERRIDE",
          }
          regex_patterns = {
              "private-key": re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----"),
              "github-token": re.compile(rb"gh[pousr]_[A-Za-z0-9_]{30,}"),
              "openai-token": re.compile(rb"(?<![A-Za-z0-9])sk-[A-Za-z0-9_-]{20,}"),
              "aws-key": re.compile(rb"AKIA[0-9A-Z]{16}"),
          }

          try:
              raw_entries = subprocess.check_output(
                  ["git", "ls-files", "-z", "--stage"], stderr=subprocess.STDOUT
              )
          except subprocess.CalledProcessError as error:
              sys.stderr.buffer.write(error.output)
              raise SystemExit("FAIL-CLOSED: unable to enumerate Git index")

          findings = []
          scanned_blobs = 0

          for entry in raw_entries.split(b"\0"):
              if not entry:
                  continue
              try:
                  metadata, raw_path = entry.split(b"\t", 1)
                  mode, object_id, stage = metadata.split(b" ")
              except ValueError:
                  raise SystemExit(f"FAIL-CLOSED: malformed index entry: {entry!r}")

              path = raw_path.decode("utf-8", "surrogateescape")
              if stage != b"0":
                  raise SystemExit(f"FAIL-CLOSED: unmerged index entry at {path}")
              if mode == b"160000":
                  continue
              if mode not in {b"100644", b"100755", b"120000"}:
                  raise SystemExit(f"FAIL-CLOSED: unsupported Git mode {mode.decode()} at {path}")
              if not in_scope(path):
                  continue

              try:
                  data = subprocess.check_output(
                      ["git", "cat-file", "blob", object_id.decode("ascii")],
                      stderr=subprocess.STDOUT,
                  )
              except subprocess.CalledProcessError as error:
                  sys.stderr.buffer.write(error.output)
                  raise SystemExit(f"FAIL-CLOSED: cannot read indexed blob for {path}")

              scanned_blobs += 1
              if b"\0" in data:
                  continue

              if scan_kind == "hidden-unicode":
                  for needle, label in hidden_patterns.items():
                      for line_number, line in enumerate(data.splitlines(), 1):
                          if needle in line:
                              findings.append(f"{path}:{line_number}: forbidden {label}")
              elif scan_kind in regex_patterns:
                  for match in regex_patterns[scan_kind].finditer(data):
                      line_number = data.count(b"\n", 0, match.start()) + 1
                      findings.append(f"{path}:{line_number}: {scan_kind} pattern")
              elif scan_kind != "structure":
                  raise SystemExit(f"FAIL-CLOSED: unsupported scan kind {scan_kind}")

          if scanned_blobs == 0:
              raise SystemExit(f"FAIL-CLOSED: no indexed blobs were scanned for scope {scope}")
          if findings:
              print("\n".join(findings), file=sys.stderr)
              raise SystemExit(1)
          print(f"{scan_kind}/{scope} passed across {scanned_blobs} indexed blobs")
          PY

      - name: Git index structure
        run: python3 "$RUNNER_TEMP/scan_index.py" structure

      - name: Hidden Unicode
        run: python3 "$RUNNER_TEMP/scan_index.py" hidden-unicode

      - name: Private-key headers
        run: python3 "$RUNNER_TEMP/scan_index.py" private-key

      - name: GitHub token patterns
        run: python3 "$RUNNER_TEMP/scan_index.py" github-token

      - name: OpenAI-style tokens — workflows
        run: python3 "$RUNNER_TEMP/scan_index.py" openai-token github

      - name: OpenAI-style tokens — client source
        run: python3 "$RUNNER_TEMP/scan_index.py" openai-token client-source

      - name: OpenAI-style tokens — cytoscape asset
        run: python3 "$RUNNER_TEMP/scan_index.py" openai-token asset-cytoscape

      - name: OpenAI-style tokens — html asset
        run: python3 "$RUNNER_TEMP/scan_index.py" openai-token asset-html

      - name: OpenAI-style tokens — index asset
        run: python3 "$RUNNER_TEMP/scan_index.py" openai-token asset-index

      - name: OpenAI-style tokens — less asset
        run: python3 "$RUNNER_TEMP/scan_index.py" openai-token asset-less

      - name: OpenAI-style tokens — mermaid asset
        run: python3 "$RUNNER_TEMP/scan_index.py" openai-token asset-mermaid

      - name: OpenAI-style tokens — treemap asset
        run: python3 "$RUNNER_TEMP/scan_index.py" openai-token asset-treemap

      - name: OpenAI-style tokens — other generated assets
        run: python3 "$RUNNER_TEMP/scan_index.py" openai-token assets-other

      - name: OpenAI-style tokens — other client files
        run: python3 "$RUNNER_TEMP/scan_index.py" openai-token client-other

      - name: OpenAI-style tokens — docs
        run: python3 "$RUNNER_TEMP/scan_index.py" openai-token docs

      - name: OpenAI-style tokens — tests
        run: python3 "$RUNNER_TEMP/scan_index.py" openai-token tests

      - name: OpenAI-style tokens — other
        run: python3 "$RUNNER_TEMP/scan_index.py" openai-token other

      - name: AWS access-key patterns
        run: python3 "$RUNNER_TEMP/scan_index.py" aws-key
