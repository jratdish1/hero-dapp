name: PR77 narrow PostCSS lockfile repair

on:
  push:
    branches:
      - dependabot/npm_and_yarn/postcss-8.5.23
    paths:
      - .github/workflows/pr77-narrow-postcss-lock.yml

permissions:
  contents: write

concurrency:
  group: pr77-narrow-postcss-lock
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'jratdish1/hero-dapp' && github.actor == 'jratdish1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact bounded controller commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: true
          submodules: false

      - name: Verify lineage and reconstruct narrow lockfile
        shell: bash
        env:
          EXPECTED_BRANCH: dependabot/npm_and_yarn/postcss-8.5.23
          EXPECTED_PARENT: 6fff21afd0522f3465447ead58f48b746fb9b934
          EXPECTED_SCRIPT_COMMIT: 796baf15efe27c6f33af815c3366e8e99c046094
          EXPECTED_ORIGINAL_HEAD: 3ebc750d90000734dd8f6d95200eb219574e34cf
          BASE_SHA: cf145377cd3b002c1ed500c7f262dad2c3cf5e30
          BASE_LOCK_BLOB: 0d0aa2b44cc8df909013746061b53e4dca8b1cfa
          PACKAGE_JSON_BLOB: 8dd4f8f3d0708427bf281128e69c4aab6f95c9ec
          PATCH_BLOB: 41987af5c852b3ec8c3e2c7a5ce3cd4096379427
        run: |
          set -euxo pipefail
          umask 077
          echo "branch=${GITHUB_REF_NAME}"
          echo "head=$(git rev-parse HEAD)"
          echo "parent=$(git rev-parse HEAD^)"
          echo "script_commit=$(git rev-parse HEAD^^)"
          echo "original_head=$(git rev-parse HEAD^^^)"
          echo "package_blob=$(git hash-object package.json)"
          echo "patch_blob=$(git hash-object .github/pr77_narrow_lock.py)"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test "$(git rev-parse HEAD^^)" = "${EXPECTED_SCRIPT_COMMIT}"
          test "$(git rev-parse HEAD^^^)" = "${EXPECTED_ORIGINAL_HEAD}"
          test "$(git hash-object package.json)" = "${PACKAGE_JSON_BLOB}"
          test "$(git hash-object .github/pr77_narrow_lock.py)" = "${PATCH_BLOB}"
          python3 -m py_compile .github/pr77_narrow_lock.py

          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          git show "${BASE_SHA}:pnpm-lock.yaml" > /tmp/pnpm-lock.base.yaml
          echo "base_lock_blob=$(git hash-object /tmp/pnpm-lock.base.yaml)"
          test "$(git hash-object /tmp/pnpm-lock.base.yaml)" = "${BASE_LOCK_BLOB}"

          before_names="$(git diff --name-only "${BASE_SHA}" "${EXPECTED_ORIGINAL_HEAD}" | LC_ALL=C sort)"
          expected_before="$(printf '%s\n' package.json pnpm-lock.yaml | LC_ALL=C sort)"
          printf 'before_names=%s\n' "${before_names}"
          test "${before_names}" = "${expected_before}"

          python3 .github/pr77_narrow_lock.py
          git diff --check

          diff_text="$(git diff --unified=0 "${BASE_SHA}" -- pnpm-lock.yaml)"
          for forbidden in \
            '@nomicfoundation/hardhat-errors@3.0.18' \
            '@nomicfoundation/hardhat-utils@4.1.7' \
            'ethers@6.17.0' \
            'brace-expansion@1.1.18' \
            'env-paths@4.0.0' \
            'undici@6.28.0' \
            'ws@8.21.2'; do
            if grep -Fq "${forbidden}" <<<"${diff_text}"; then
              echo "unrelated lockfile drift remains: ${forbidden}" >&2
              exit 1
            fi
          done
          grep -Fq 'postcss@8.5.23' <<<"${diff_text}"
          grep -Fq 'nanoid@3.3.17' <<<"${diff_text}"
          grep -Fq 'nanoid@3.3.12' pnpm-lock.yaml

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run check
          pnpm test
          pnpm run build
          git diff --check

      - name: Commit narrow lockfile and remove controller artifacts
        shell: bash
        env:
          EXPECTED_BRANCH: dependabot/npm_and_yarn/postcss-8.5.23
          BASE_SHA: cf145377cd3b002c1ed500c7f262dad2c3cf5e30
        run: |
          set -euo pipefail
          rm -f .github/pr77_narrow_lock.py
          rm -f .github/workflows/pr77-narrow-postcss-lock.yml
          git config user.name "VETS Dependency Remediator"
          git config user.email "92892706+jratdish1@users.noreply.github.com"
          git add pnpm-lock.yaml
          git add -u .github/pr77_narrow_lock.py .github/workflows/pr77-narrow-postcss-lock.yml
          git diff --cached --check
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/pr77_narrow_lock.py' \
            '.github/workflows/pr77-narrow-postcss-lock.yml' \
            'pnpm-lock.yaml' | LC_ALL=C sort)"
          test "${actual}" = "${expected}"

          final_names="$(git diff --name-only "${BASE_SHA}" -- package.json pnpm-lock.yaml | LC_ALL=C sort)"
          expected_final="$(printf '%s\n' package.json pnpm-lock.yaml | LC_ALL=C sort)"
          test "${final_names}" = "${expected_final}"

          git commit -m "fix(deps): keep PostCSS lockfile bump narrowly scoped"
          git push origin "HEAD:${EXPECTED_BRANCH}"
