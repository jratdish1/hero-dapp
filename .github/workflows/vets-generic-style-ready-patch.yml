name: One-shot computed focus readiness patch

on:
  push:
    branches:
      - closeout/csp-rebuild-20260802
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'closeout/csp-rebuild-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: closeout/csp-rebuild-20260802
          fetch-depth: 0

      - name: Stop after the one-shot result commit
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" = 'fix(test): wait for computed generic focus indicator' ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply bounded computed-style readiness correction
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/vets-generic-style-ready-patch.py
          python3 -m py_compile scripts/vets-generic-style-ready-patch.py
          node --check scripts/check-generic-error-focus.mjs
          git diff --check

      - name: Commit exact correction
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VETS GitHub automation'
          git config user.email 'jratdish1@users.noreply.github.com'
          git add scripts/check-generic-error-focus.mjs
          git diff --cached --quiet && {
            echo 'Expected computed-style readiness correction produced no change' >&2
            exit 1
          }
          git commit -m 'fix(test): wait for computed generic focus indicator'
          git push origin HEAD:closeout/csp-rebuild-20260802
