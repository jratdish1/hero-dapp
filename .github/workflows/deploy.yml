name: Deploy HeroBase through canonical VDS-M to VDS-S path
run-name: VETS ${{ inputs.operation }} ${{ inputs.commit_sha }} / ${{ inputs.correlation_id }}

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      correlation_id:
        required: true
        type: string
      operation:
        required: true
        type: string
      confirmation:
        required: true
        type: string
      command_comment_id:
        required: true
        type: string
      command_run_id:
        required: true
        type: string
    outputs:
      verified:
        value: ${{ jobs.canonical.outputs.verified }}
      result_artifact:
        value: ${{ jobs.canonical.outputs.result_artifact }}
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact lowercase 40-character verified ancestor SHA
        required: true
        type: string
      correlation_id:
        description: rollback-<ticket-or-UTC-identifier>
        required: true
        type: string
      operation:
        description: Protected manual operation
        required: true
        default: rollback
        type: choice
        options:
          - rollback
      confirmation:
        description: Type ROLLBACK
        required: true
        type: string
      command_comment_id:
        description: Leave as 0 for manual rollback
        required: false
        default: '0'
        type: string
      command_run_id:
        description: Leave as 0 for manual rollback
        required: false
        default: '0'
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  issues: write

jobs:
  canonical:
    name: Canonical protected deployment controller
    uses: ./.github/workflows/deploy-vdss.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      correlation_id: ${{ inputs.correlation_id }}
      operation: ${{ inputs.operation }}
      confirmation: ${{ inputs.confirmation }}
      command_comment_id: ${{ inputs.command_comment_id }}
      command_run_id: ${{ inputs.command_run_id }}
    secrets: inherit
