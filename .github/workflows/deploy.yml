name: Deploy to VPS1
run-name: VETS deploy ${{ inputs.commit_sha }} / ${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact lowercase 40-character commit SHA that is current main
        required: true
        type: string
      correlation_id:
        description: Unique owner-approved deployment correlation identifier
        required: true
        type: string
      confirmation:
        description: Type DEPLOY to authorize this protected production run
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: production-vps1
  cancel-in-progress: false

jobs:
  deploy:
    name: Protected production deployment
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      DEPLOY_SHA: ${{ inputs.commit_sha }}
      DEPLOY_CORRELATION_ID: ${{ inputs.correlation_id }}
      DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Validate release authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "jratdish1/hero-dapp"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$DEPLOY_CONFIRMATION" = "DEPLOY"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_CORRELATION_ID" =~ ^[A-Za-z0-9._-]{1,80}$ ]]
          test "$GITHUB_SHA" = "$DEPLOY_SHA"

      - name: Require successful exact-main push workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          require_workflow_run() {
            local workflow_file="$1"
            local required_job="$2"
            local workflow_id
            local runs
            local trusted_run
            local run_id
            local jobs

            workflow_id="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file" \
              | jq -r '.id')"
            [[ "$workflow_id" =~ ^[0-9]+$ ]]

            runs="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?branch=main&event=push&per_page=100")"

            trusted_run="$(jq -c --arg sha "$DEPLOY_SHA" '
              [.workflow_runs[] | select(
                .head_sha == $sha and
                .head_branch == "main" and
                .event == "push"
              )]
              | sort_by(.id)
              | last // empty
            ' <<<"$runs")"
            test -n "$trusted_run"
            jq -e '.status == "completed" and .conclusion == "success"' <<<"$trusted_run" >/dev/null
            run_id="$(jq -r '.id' <<<"$trusted_run")"
            [[ "$run_id" =~ ^[0-9]+$ ]]

            jobs="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"

            jq -e --arg name "$required_job" '
              [.jobs[] | select(.name == $name)]
              | if length == 0 then false
                else (max_by(.id) | .status == "completed" and .conclusion == "success")
                end
            ' <<<"$jobs" >/dev/null

            echo "Trusted $workflow_file push-to-main run $run_id passed for $DEPLOY_SHA"
          }

          require_workflow_run ci.yml test-build-scan
          require_workflow_run security-and-quality.yml repository-safety

      - name: Configure strict SSH trust
        env:
          VPS1_SSH_KEY: ${{ secrets.VPS1_SSH_KEY }}
          VPS1_KNOWN_HOSTS: ${{ secrets.VPS1_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS1_SSH_KEY"
          test -n "$VPS1_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VPS1_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS1_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy exact merged commit with frozen pnpm dependencies
        id: deploy_app
        env:
          VPS1_HOST: ${{ secrets.VPS1_HOST }}
          VPS1_USER: ${{ secrets.VPS1_USER }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS1_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS1_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          test "$VPS1_USER" != "root"

          deploy_log="$RUNNER_TEMP/vps1-deploy.log"
          set +e
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS1_USER@$VPS1_HOST" \
            bash -s -- "$DEPLOY_SHA" <<'REMOTE' 2>&1 | tee "$deploy_log"
          set -Eeuo pipefail
          DEPLOY_SHA="$1"
          APP_DIR="/var/www/hero-dapp"
          HEALTH_URL='https://herobase.io/api/trpc/system.health?input=%7B%22json%22%3A%7B%22timestamp%22%3A0%7D%7D'

          for required_command in git node corepack pm2 curl; do
            command -v "$required_command" >/dev/null || {
              echo "Missing required command: $required_command" >&2
              exit 1
            }
          done
          test -d "$APP_DIR"
          test ! -L "$APP_DIR"
          test "$(stat -c '%U' "$APP_DIR")" = "$(id -un)"
          cd "$APP_DIR"
          test -d .git

          ORIGIN_URL="$(git remote get-url origin)"
          case "$ORIGIN_URL" in
            https://github.com/jratdish1/hero-dapp.git|git@github.com:jratdish1/hero-dapp.git)
              ;;
            *)
              echo "Unexpected origin URL" >&2
              exit 1
              ;;
          esac

          PREVIOUS_SHA="$(git rev-parse HEAD)"
          [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${PREVIOUS_SHA}^{commit}"
          test -z "$(git status --porcelain)"
          MUTATION_STARTED=false

          wait_for_health() {
            local expected_sha="$1"
            local healthy=false
            local response=""
            local attempt
            for attempt in $(seq 1 10); do
              response="$(curl --fail --silent --show-error --max-time 10 "$HEALTH_URL" || true)"
              if printf '%s' "$response" | grep -q '"ok":true' && \
                 printf '%s' "$response" | grep -q "\"releaseSha\":\"$expected_sha\""; then
                healthy=true
                break
              fi
              sleep 3
            done
            test "$healthy" = true
          }

          verify_pm2_release_sha() {
            local expected_sha="$1"
            pm2 jlist | EXPECTED_SHA="$expected_sha" node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => { input += chunk; });
              process.stdin.on("end", () => {
                const processes = JSON.parse(input);
                const app = processes.find(item => item.name === "hero-dapp");
                const actual = app?.pm2_env?.env?.HERO_RELEASE_SHA ?? app?.pm2_env?.HERO_RELEASE_SHA;
                if (actual !== process.env.EXPECTED_SHA) {
                  console.error(`PM2 release SHA mismatch: expected ${process.env.EXPECTED_SHA}, got ${actual ?? "missing"}`);
                  process.exit(1);
                }
              });
            '
          }

          build_without_lifecycle_hooks() {
            pnpm exec vite build &&
            pnpm exec esbuild server/_core/index.ts \
              --platform=node \
              --packages=external \
              --bundle \
              --format=esm \
              --outdir=dist
          }

          rollback() {
            original_status="$?"
            trap - ERR
            if [ "$MUTATION_STARTED" = true ]; then
              printf 'VETS_INLINE_ROLLBACK_ATTEMPTED=true\n'
              echo "Deployment failed; restoring previous SHA $PREVIOUS_SHA" >&2
              if git reset --hard "$PREVIOUS_SHA" &&
                 corepack enable &&
                 corepack prepare pnpm@10.34.4 --activate &&
                 test "$(pnpm --version)" = "10.34.4" &&
                 pnpm install --frozen-lockfile &&
                 rm -rf dist &&
                 build_without_lifecycle_hooks &&
                 HERO_RELEASE_SHA="$PREVIOUS_SHA" pm2 reload hero-dapp --update-env &&
                 test "$(git rev-parse HEAD)" = "$PREVIOUS_SHA" &&
                 verify_pm2_release_sha "$PREVIOUS_SHA" &&
                 wait_for_health "$PREVIOUS_SHA"; then
                printf 'VETS_INLINE_ROLLBACK_SUCCEEDED=true\n'
              else
                printf 'VETS_INLINE_ROLLBACK_SUCCEEDED=false\n'
                exit 70
              fi
            fi
            exit "$original_status"
          }
          trap rollback ERR

          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$DEPLOY_SHA"
          git cat-file -e "${DEPLOY_SHA}^{commit}"
          MUTATION_STARTED=true
          git reset --hard "$DEPLOY_SHA"

          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          test "$(pnpm --version)" = "10.34.4"
          test ! -e package-lock.json
          pnpm install --frozen-lockfile
          rm -rf dist
          pnpm build
          HERO_RELEASE_SHA="$DEPLOY_SHA" pm2 reload hero-dapp --update-env
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          verify_pm2_release_sha "$DEPLOY_SHA"
          wait_for_health "$DEPLOY_SHA"

          MUTATION_STARTED=false
          trap - ERR
          printf 'VETS_PREVIOUS_SHA=%s\n' "$PREVIOUS_SHA"
          REMOTE
          ssh_status="${PIPESTATUS[0]}"
          set -e

          previous_sha="$(sed -n 's/^VETS_PREVIOUS_SHA=//p' "$deploy_log" | tail -n 1)"
          inline_attempted=false
          inline_succeeded=false
          inline_failed=false
          if grep -q '^VETS_INLINE_ROLLBACK_ATTEMPTED=true$' "$deploy_log"; then
            inline_attempted=true
          fi
          if grep -q '^VETS_INLINE_ROLLBACK_SUCCEEDED=true$' "$deploy_log"; then
            inline_succeeded=true
          fi
          if grep -q '^VETS_INLINE_ROLLBACK_SUCCEEDED=false$' "$deploy_log"; then
            inline_failed=true
          fi

          printf 'inline_rollback_attempted=%s\n' "$inline_attempted" >> "$GITHUB_OUTPUT"
          printf 'inline_rollback_succeeded=%s\n' "$inline_succeeded" >> "$GITHUB_OUTPUT"
          printf 'inline_rollback_failed=%s\n' "$inline_failed" >> "$GITHUB_OUTPUT"
          printf 'deploy_exit_code=%s\n' "$ssh_status" >> "$GITHUB_OUTPUT"

          if [[ "$previous_sha" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'previous_sha=%s\n' "$previous_sha" >> "$GITHUB_OUTPUT"
          fi
          exit "$ssh_status"

      - name: Record inline rollback attempted
        if: always() && steps.deploy_app.outputs.inline_rollback_attempted == 'true'
        run: echo "Inline deployment rollback was attempted"

      - name: Record inline rollback succeeded
        if: always() && steps.deploy_app.outputs.inline_rollback_succeeded == 'true'
        run: echo "Inline deployment rollback restored the previous exact SHA"

      - name: Record inline rollback attempted but failed
        if: always() && steps.deploy_app.outputs.inline_rollback_failed == 'true'
        run: echo "Inline deployment rollback was attempted but did not verify successfully"

      - name: Purge Cloudflare cache
        id: cloudflare_purge
        if: success()
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ZONE_ID"
          purge_response="$(curl --fail-with-body --silent --show-error \
            -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')"
          jq -e '.success == true and ((.errors // []) | length == 0)' <<<"$purge_response" >/dev/null
          echo "Cloudflare purge verified successful"

      - name: Verify public deployment after purge
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          health_response="$(curl --fail --silent --show-error --max-time 15 \
            'https://herobase.io/api/trpc/system.health?input=%7B%22json%22%3A%7B%22timestamp%22%3A0%7D%7D')"
          printf '%s' "$health_response" | grep -q '"ok":true'
          printf '%s' "$health_response" | grep -q "\"releaseSha\":\"$DEPLOY_SHA\""
          curl --fail --silent --show-error --max-time 15 \
            --output /dev/null https://herobase.io/

      - name: Roll back application after post-deploy failure
        id: rollback_app
        if: failure() && steps.deploy_app.outcome == 'success'
        env:
          VPS1_HOST: ${{ secrets.VPS1_HOST }}
          VPS1_USER: ${{ secrets.VPS1_USER }}
          ROLLBACK_SHA: ${{ steps.deploy_app.outputs.previous_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS1_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS1_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$VPS1_USER" != "root"

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS1_USER@$VPS1_HOST" \
            bash -s -- "$ROLLBACK_SHA" <<'REMOTE'
          set -Eeuo pipefail
          ROLLBACK_SHA="$1"
          APP_DIR="/var/www/hero-dapp"
          HEALTH_URL='https://herobase.io/api/trpc/system.health?input=%7B%22json%22%3A%7B%22timestamp%22%3A0%7D%7D'

          cd "$APP_DIR"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git cat-file -e "${ROLLBACK_SHA}^{commit}"
          git reset --hard "$ROLLBACK_SHA"
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          test "$(pnpm --version)" = "10.34.4"
          pnpm install --frozen-lockfile
          rm -rf dist
          pnpm exec vite build
          pnpm exec esbuild server/_core/index.ts \
            --platform=node \
            --packages=external \
            --bundle \
            --format=esm \
            --outdir=dist
          HERO_RELEASE_SHA="$ROLLBACK_SHA" pm2 reload hero-dapp --update-env
          test "$(git rev-parse HEAD)" = "$ROLLBACK_SHA"
          pm2 jlist | EXPECTED_SHA="$ROLLBACK_SHA" node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => { input += chunk; });
            process.stdin.on("end", () => {
              const processes = JSON.parse(input);
              const app = processes.find(item => item.name === "hero-dapp");
              const actual = app?.pm2_env?.env?.HERO_RELEASE_SHA ?? app?.pm2_env?.HERO_RELEASE_SHA;
              if (actual !== process.env.EXPECTED_SHA) process.exit(1);
            });
          '

          healthy=false
          for attempt in $(seq 1 10); do
            response="$(curl --fail --silent --show-error --max-time 10 "$HEALTH_URL" || true)"
            if printf '%s' "$response" | grep -q '"ok":true' && \
               printf '%s' "$response" | grep -q "\"releaseSha\":\"$ROLLBACK_SHA\""; then
              healthy=true
              break
            fi
            sleep 3
          done
          test "$healthy" = true
          REMOTE

      - name: Purge Cloudflare after rollback
        if: failure() && steps.rollback_app.outcome == 'success'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ZONE_ID"
          rollback_purge_response="$(curl --fail-with-body --silent --show-error \
            -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')"
          jq -e '.success == true and ((.errors // []) | length == 0)' <<<"$rollback_purge_response" >/dev/null
          echo "Cloudflare purge after rollback verified successful"

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
