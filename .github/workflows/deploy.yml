name: Deploy herobase.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to VPS1 via VDS-M jump host
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VDS_HOST }}
          username: root
          key: ${{ secrets.VDS_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            echo "=== Deploying herobase.io via VDS-M jump host ==="
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 vps1 << 'DEPLOY'
              set -e
              echo "[1/5] Pulling latest from GitHub..."
              cd /var/www/hero-dapp
              git pull origin main

              echo "[2/5] Installing dependencies..."
              pnpm install --frozen-lockfile || pnpm install

              echo "[3/5] Building application..."
              pnpm run build

              echo "[4/5] Reloading PM2..."
              pm2 reload hero-dapp || pm2 restart hero-dapp

              echo "[5/5] Verifying health..."
              sleep 3
              curl -sf http://localhost:5000/ > /dev/null && echo "Health check PASSED" || echo "Health check FAILED"
            DEPLOY

      - name: Purge Cloudflare Cache
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VDS_HOST }}
          username: root
          key: ${{ secrets.VDS_SSH_KEY }}
          port: 22
          command_timeout: 1m
          script: |
            source /root/.env_architecture
            curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              -H "X-Auth-Email: ${CLOUDFLARE_EMAIL}" \
              -H "X-Auth-Key: ${CLOUDFLARE_API_KEY}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}' \
              && echo "Cloudflare cache purged successfully" \
              || echo "WARNING: Cloudflare purge failed"

      - name: Verify Live Site
        run: |
          sleep 10
          for route in / /wallet /swap /portfolio /stake /community-hub /dao; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://herobase.io${route}")
            echo "herobase.io${route} → HTTP ${status}"
            if [ "$status" != "200" ]; then
              echo "ERROR: Route ${route} returned ${status}"
              exit 1
            fi
          done
          echo "All routes verified HTTP 200"
