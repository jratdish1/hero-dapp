name: Deploy to VPS1
run-name: VETS ${{ inputs.operation }} ${{ inputs.commit_sha }} / ${{ inputs.correlation_id }}

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      correlation_id:
        required: true
        type: string
      operation:
        required: true
        type: string
      confirmation:
        required: true
        type: string
      command_comment_id:
        required: true
        type: string
      command_run_id:
        required: true
        type: string
    outputs:
      verified:
        description: Whether the exact requested production state was verified
        value: ${{ jobs.deploy.outputs.verified }}
      result_artifact:
        description: Immutable production result artifact name
        value: ${{ jobs.deploy.outputs.result_artifact }}
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact lowercase 40-character verified ancestor SHA
        required: true
        type: string
      correlation_id:
        description: rollback-<ticket-or-UTC-identifier>
        required: true
        type: string
      operation:
        description: Protected manual operation
        required: true
        default: rollback
        type: choice
        options:
          - rollback
      confirmation:
        description: Type ROLLBACK
        required: true
        type: string
      command_comment_id:
        description: Leave as 0 for manual rollback
        required: false
        default: '0'
        type: string
      command_run_id:
        description: Leave as 0 for manual rollback
        required: false
        default: '0'
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  issues: write

jobs:
  authorize:
    name: Verify immutable authorization outside production
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production-authorization-${{ inputs.correlation_id }}
      cancel-in-progress: false
    outputs:
      consumption_comment_id: ${{ steps.authorization.outputs.consumption_comment_id }}
      authorization_mode: ${{ steps.authorization.outputs.authorization_mode }}
      ci_run_id: ${{ steps.authorization.outputs.ci_run_id }}
      security_run_id: ${{ steps.authorization.outputs.security_run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOY_SHA: ${{ inputs.commit_sha }}
      DEPLOY_CORRELATION_ID: ${{ inputs.correlation_id }}
      DEPLOY_OPERATION: ${{ inputs.operation }}
      DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
      COMMAND_COMMENT_ID: ${{ inputs.command_comment_id }}
      COMMAND_RUN_ID: ${{ inputs.command_run_id }}
      TRACKER_ISSUE: '43'

    steps:
      - name: Checkout current main for ancestry verification
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify authorization and consume correlation
        id: authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "jratdish1/hero-dapp"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_CORRELATION_ID" =~ ^[A-Za-z0-9._-]{1,100}$ ]]

          api_get() {
            local url="$1" response=""
            for attempt in $(seq 1 5); do
              if response="$(curl --fail-with-body --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$url")"; then
                printf '%s' "$response"
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          api_post_once() {
            local url="$1" payload="$2"
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" --data "$payload"
          }

          collect_issue_comments() {
            local page=1 response count
            : > "$RUNNER_TEMP/issue-comments.jsonl"
            while :; do
              [ "$page" -le 10000 ] || {
                echo "Issue comment pagination exceeded fail-closed bound" >&2
                return 74
              }
              response="$(api_get \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE/comments?per_page=100&page=$page")"
              jq -c '.' <<<"$response" >> "$RUNNER_TEMP/issue-comments.jsonl"
              count="$(jq -r 'length' <<<"$response")"
              [ "$count" -lt 100 ] && break
              page=$((page + 1))
            done
            jq -s 'add' "$RUNNER_TEMP/issue-comments.jsonl"
          }

          require_workflow_run() {
            local workflow_file="$1" required_job="$2"
            local workflow_id runs trusted_run run_id jobs
            workflow_id="$(api_get \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file" \
              | jq -r '.id')"
            [[ "$workflow_id" =~ ^[0-9]+$ ]]
            runs="$(api_get \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?branch=main&event=push&head_sha=$DEPLOY_SHA&per_page=100")"
            trusted_run="$(jq -c --arg sha "$DEPLOY_SHA" '
              [.workflow_runs[] | select(
                .head_sha == $sha and .head_branch == "main" and .event == "push" and .run_attempt == 1
              )] | sort_by(.id) | last // empty
            ' <<<"$runs")"
            test -n "$trusted_run"
            jq -e '.status == "completed" and .conclusion == "success"' \
              <<<"$trusted_run" >/dev/null
            run_id="$(jq -r '.id' <<<"$trusted_run")"
            [[ "$run_id" =~ ^[0-9]+$ ]]
            jobs="$(api_get \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
            jq -e --arg name "$required_job" '
              [.jobs[] | select(.name == $name)]
              | if length == 0 then false
                else (max_by(.id) | .status == "completed" and .conclusion == "success")
                end
            ' <<<"$jobs" >/dev/null
            printf '%s' "$run_id"
          }

          all_comments="$(collect_issue_comments)"

          case "$DEPLOY_OPERATION" in
            deploy)
              test "$GITHUB_EVENT_NAME" = "issue_comment"
              test "$DEPLOY_CONFIRMATION" = "DEPLOY"
              test "$GITHUB_SHA" = "$DEPLOY_SHA"
              test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
              test "$GITHUB_TRIGGERING_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
              [[ "$COMMAND_COMMENT_ID" =~ ^[0-9]+$ ]]
              [[ "$COMMAND_RUN_ID" =~ ^[0-9]+$ ]]
              test "$GITHUB_RUN_ID" = "$COMMAND_RUN_ID"
              test "$DEPLOY_CORRELATION_ID" = "issue-43-comment-$COMMAND_COMMENT_ID"
              test "${{ github.event.comment.id }}" = "$COMMAND_COMMENT_ID"

              issue="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE")"
              test "$(jq -r '.state' <<<"$issue")" = "open"

              owner_comment="$(api_get \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/comments/$COMMAND_COMMENT_ID")"
              test "$(jq -r '.issue_url' <<<"$owner_comment")" = \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE"
              test "$(jq -r '.user.login' <<<"$owner_comment")" = "$GITHUB_REPOSITORY_OWNER"
              test "$(jq -r '.author_association' <<<"$owner_comment")" = "OWNER"
              test "$(jq -r '.body' <<<"$owner_comment")" = "VETS DEPLOY $DEPLOY_SHA"

              consumed_count="$(jq -r --arg correlation "$DEPLOY_CORRELATION_ID" '
                [.[] | select(
                  .user.login == "github-actions[bot]" and
                  (.body | startswith("VETS_DEPLOY_CONSUMED v1\n")) and
                  (.body | contains("correlation_id: " + $correlation + "\n"))
                )] | length
              ' <<<"$all_comments")"
              test "$consumed_count" = "0"

              printf -v consumption_body '%s\n' \
                'VETS_DEPLOY_CONSUMED v1' \
                "correlation_id: $DEPLOY_CORRELATION_ID" \
                "command_comment_id: $COMMAND_COMMENT_ID" \
                "command_run_id: $COMMAND_RUN_ID" \
                "target_sha: $DEPLOY_SHA" \
                'state: consumed'
              consumption_marker="VETS_DEPLOY_CONSUMED v1"
              authorization_mode="owner-issue-comment-reusable-workflow"
              ;;
            rollback)
              test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
              test "$DEPLOY_CONFIRMATION" = "ROLLBACK"
              test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
              test "$GITHUB_TRIGGERING_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
              test "$GITHUB_SHA" != "$DEPLOY_SHA"
              [[ "$DEPLOY_CORRELATION_ID" =~ ^rollback-[A-Za-z0-9._-]{1,80}$ ]]
              git fetch --no-tags origin main
              git cat-file -e "${DEPLOY_SHA}^{commit}"
              git merge-base --is-ancestor "$DEPLOY_SHA" origin/main

              rollback_count="$(jq -r --arg correlation "$DEPLOY_CORRELATION_ID" '
                [.[] | select(
                  .user.login == "github-actions[bot]" and
                  (.body | startswith("VETS_ROLLBACK_AUTHORIZATION v1\n")) and
                  (.body | contains("correlation_id: " + $correlation + "\n"))
                )] | length
              ' <<<"$all_comments")"
              test "$rollback_count" = "0"

              printf -v consumption_body '%s\n' \
                'VETS_ROLLBACK_AUTHORIZATION v1' \
                "correlation_id: $DEPLOY_CORRELATION_ID" \
                "deployment_run_id: $GITHUB_RUN_ID" \
                "target_sha: $DEPLOY_SHA" \
                "authorized_by: $GITHUB_ACTOR" \
                'state: consumed'
              consumption_marker="VETS_ROLLBACK_AUTHORIZATION v1"
              authorization_mode="owner-intentional-rollback"
              ;;
            *)
              exit 64
              ;;
          esac

          ci_run_id="$(require_workflow_run ci.yml test-build-scan)"
          security_run_id="$(require_workflow_run security-and-quality.yml repository-safety)"
          [[ "$ci_run_id" =~ ^[0-9]+$ ]]
          [[ "$security_run_id" =~ ^[0-9]+$ ]]
          printf -v consumption_body '%s\n%s\n%s' \
            "$consumption_body" \
            "ci_run_id: $ci_run_id" \
            "security_run_id: $security_run_id"

          comments_url="https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE/comments"
          payload="$(jq -nc --arg body "$consumption_body" '{body:$body}')"
          response=""
          consumption_comment_id=""
          if response="$(api_post_once "$comments_url" "$payload")"; then
            consumption_comment_id="$(jq -r '.id' <<<"$response")"
          else
            for observe_attempt in $(seq 1 5); do
              observed_comments="$(collect_issue_comments)"
              matches="$(jq -c \
                --arg marker "$consumption_marker" \
                --arg correlation "$DEPLOY_CORRELATION_ID" \
                --arg target "$DEPLOY_SHA" \
                --arg ci "$ci_run_id" \
                --arg security "$security_run_id" '
                  [.[] | select(
                    .user.login == "github-actions[bot]" and
                    (.body | startswith($marker + "\n")) and
                    (.body | contains("correlation_id: " + $correlation + "\n")) and
                    (.body | contains("target_sha: " + $target + "\n")) and
                    (.body | contains("ci_run_id: " + $ci + "\n")) and
                    (.body | contains("security_run_id: " + $security))
                  )]
                ' <<<"$observed_comments")"
              match_count="$(jq -r 'length' <<<"$matches")"
              [ "$match_count" -le 1 ] || {
                echo "Duplicate correlation consumption records detected" >&2
                exit 71
              }
              if [ "$match_count" = "1" ]; then
                consumption_comment_id="$(jq -r '.[0].id' <<<"$matches")"
                break
              fi
              sleep $((observe_attempt * 2))
            done
          fi
          [[ "$consumption_comment_id" =~ ^[0-9]+$ ]]
          echo "consumption_comment_id=$consumption_comment_id" >> "$GITHUB_OUTPUT"
          echo "authorization_mode=$authorization_mode" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"
          echo "security_run_id=$security_run_id" >> "$GITHUB_OUTPUT"

  deploy:
    name: Protected production mutation
    needs: authorize
    if: needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    concurrency:
      group: production-vps1
      cancel-in-progress: false
    outputs:
      verified: ${{ steps.result.outputs.verified }}
      result_artifact: production-result-${{ inputs.correlation_id }}
    env:
      DEPLOY_SHA: ${{ inputs.commit_sha }}
      DEPLOY_CORRELATION_ID: ${{ inputs.correlation_id }}
      DEPLOY_OPERATION: ${{ inputs.operation }}
      AUTHORIZATION_MODE: ${{ needs.authorize.outputs.authorization_mode }}
      CONSUMPTION_COMMENT_ID: ${{ needs.authorize.outputs.consumption_comment_id }}
      AUTH_CI_RUN_ID: ${{ needs.authorize.outputs.ci_run_id }}
      AUTH_SECURITY_RUN_ID: ${{ needs.authorize.outputs.security_run_id }}
      TRACKER_ISSUE: '43'

    steps:
      - name: Validate protected mutation inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_CORRELATION_ID" =~ ^[A-Za-z0-9._-]{1,100}$ ]]
          [[ "$CONSUMPTION_COMMENT_ID" =~ ^[0-9]+$ ]]
          [[ "$AUTH_CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$AUTH_SECURITY_RUN_ID" =~ ^[0-9]+$ ]]
          case "$AUTHORIZATION_MODE" in
            owner-issue-comment-reusable-workflow|owner-intentional-rollback) ;;
            *) exit 64 ;;
          esac

      - name: Validate protected production secrets and SSH trust
        env:
          VPS1_HOST: ${{ secrets.VPS1_HOST }}
          VPS1_USER: ${{ secrets.VPS1_USER }}
          VPS1_SSH_KEY: ${{ secrets.VPS1_SSH_KEY }}
          VPS1_KNOWN_HOSTS: ${{ secrets.VPS1_KNOWN_HOSTS }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "$VPS1_HOST" ] || missing+=(VPS1_HOST)
          [ -n "$VPS1_USER" ] || missing+=(VPS1_USER)
          [ -n "$VPS1_SSH_KEY" ] || missing+=(VPS1_SSH_KEY)
          [ -n "$VPS1_KNOWN_HOSTS" ] || missing+=(VPS1_KNOWN_HOSTS)
          [ -n "$CF_API_TOKEN" ] || missing+=(CF_API_TOKEN)
          [ -n "$CF_ZONE_ID" ] || missing+=(CF_ZONE_ID)
          if [ "${#missing[@]}" -ne 0 ]; then
            for name in "${missing[@]}"; do
              echo "Missing required production secret: $name" >&2
            done
            exit 78
          fi

          [[ "$VPS1_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS1_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          test "$VPS1_USER" != "root"
          [[ "$CF_ZONE_ID" =~ ^[0-9a-fA-F]{32}$ ]]

          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VPS1_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS1_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          timeout --signal=TERM --kill-after=5s 15s \
            ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          ssh-keygen -F "$VPS1_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Deploy exact authorized commit with host writer lock
        id: deploy_app
        env:
          VPS1_HOST: ${{ secrets.VPS1_HOST }}
          VPS1_USER: ${{ secrets.VPS1_USER }}
        shell: bash
        run: |
          set -euo pipefail
          deploy_log="$RUNNER_TEMP/vps1-deploy.log"
          set +e
          timeout --signal=TERM --kill-after=30s 2700 ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS1_USER@$VPS1_HOST" \
            bash -s -- "$DEPLOY_SHA" "$DEPLOY_OPERATION" <<'REMOTE' 2>&1 | tee "$deploy_log"
          set -Eeuo pipefail
          DEPLOY_SHA="$1"
          DEPLOY_OPERATION="$2"
          APP_DIR="/var/www/hero-dapp"
          HEALTH_URL='https://herobase.io/api/trpc/system.health?input=%7B%22json%22%3A%7B%22timestamp%22%3A0%7D%7D'

          for required_command in git node corepack pm2 curl flock; do
            command -v "$required_command" >/dev/null || exit 1
          done
          test -d "$APP_DIR"
          test ! -L "$APP_DIR"
          test "$(stat -c '%U' "$APP_DIR")" = "$(id -un)"
          cd "$APP_DIR"
          test -d .git
          exec 9>"$APP_DIR/.git/vets-production.lock"
          flock -w 1800 9 || exit 75

          ORIGIN_URL="$(git remote get-url origin)"
          case "$ORIGIN_URL" in
            https://github.com/jratdish1/hero-dapp.git|git@github.com:jratdish1/hero-dapp.git) ;;
            *) exit 1 ;;
          esac

          PREVIOUS_SHA="$(git rev-parse HEAD)"
          [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'VETS_PREVIOUS_SHA=%s\n' "$PREVIOUS_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          MUTATION_STARTED=false

          wait_for_health() {
            local expected_sha="$1" response=""
            for attempt in $(seq 1 10); do
              response="$(curl --fail --silent --show-error \
                --connect-timeout 5 --max-time 10 "$HEALTH_URL" || true)"
              if printf '%s' "$response" | grep -q '"ok":true' && \
                 printf '%s' "$response" | grep -q "\"releaseSha\":\"$expected_sha\""; then
                return 0
              fi
              sleep 3
            done
            return 1
          }

          verify_pm2_release_sha() {
            local expected_sha="$1"
            pm2 jlist | EXPECTED_SHA="$expected_sha" node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => { input += chunk; });
              process.stdin.on("end", () => {
                const processes = JSON.parse(input);
                const app = processes.find(item => item.name === "hero-dapp");
                const actual = app?.pm2_env?.env?.HERO_RELEASE_SHA ?? app?.pm2_env?.HERO_RELEASE_SHA;
                if (actual !== process.env.EXPECTED_SHA) process.exit(1);
              });
            '
          }

          build_without_lifecycle_hooks() {
            pnpm exec vite build &&
            pnpm exec esbuild server/_core/index.ts \
              --platform=node --packages=external --bundle --format=esm --outdir=dist
          }

          assert_dao_rollback_compatible() {
            local target_sha="$1"
            local guard_path="$APP_DIR/.git/vets-dao-rollback-guard.mjs"
            local guard_status=0
            git show "origin/main:scripts/check-dao-rollback-compatibility.mjs" > "$guard_path"
            node "$guard_path" "$target_sha" || guard_status="$?"
            rm -f "$guard_path"
            return "$guard_status"
          }

          rollback() {
            original_status="$?"
            trap - ERR
            if [ "$MUTATION_STARTED" = true ]; then
              printf 'VETS_INLINE_ROLLBACK_ATTEMPTED=true\n'
              if assert_dao_rollback_compatible "$PREVIOUS_SHA" &&
                 git reset --hard "$PREVIOUS_SHA" &&
                 corepack enable &&
                 corepack prepare pnpm@10.34.4 --activate &&
                 test "$(pnpm --version)" = "10.34.4" &&
                 pnpm install --frozen-lockfile &&
                 rm -rf dist &&
                 build_without_lifecycle_hooks &&
                 HERO_RELEASE_SHA="$PREVIOUS_SHA" pm2 reload hero-dapp --update-env &&
                 test "$(git rev-parse HEAD)" = "$PREVIOUS_SHA" &&
                 verify_pm2_release_sha "$PREVIOUS_SHA" &&
                 wait_for_health "$PREVIOUS_SHA"; then
                printf 'VETS_INLINE_ROLLBACK_SUCCEEDED=true\n'
                printf 'VETS_FINAL_SHA=%s\n' "$PREVIOUS_SHA"
              else
                printf 'VETS_INLINE_ROLLBACK_SUCCEEDED=false\n'
                exit 70
              fi
            fi
            exit "$original_status"
          }
          trap rollback ERR

          git fetch --no-tags origin main:refs/remotes/origin/main
          git cat-file -e "${DEPLOY_SHA}^{commit}"
          case "$DEPLOY_OPERATION" in
            deploy) test "$(git rev-parse origin/main)" = "$DEPLOY_SHA" ;;
            rollback)
              test "$(git rev-parse origin/main)" != "$DEPLOY_SHA"
              git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
              assert_dao_rollback_compatible "$DEPLOY_SHA"
              ;;
            *) exit 64 ;;
          esac

          printf 'VETS_MUTATION_STARTED=true\n'
          MUTATION_STARTED=true
          git reset --hard "$DEPLOY_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          test "$(pnpm --version)" = "10.34.4"
          test ! -e package-lock.json
          pnpm install --frozen-lockfile
          rm -rf dist
          pnpm build
          HERO_RELEASE_SHA="$DEPLOY_SHA" pm2 reload hero-dapp --update-env
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          verify_pm2_release_sha "$DEPLOY_SHA"
          wait_for_health "$DEPLOY_SHA"

          MUTATION_STARTED=false
          trap - ERR
          printf 'VETS_FINAL_SHA=%s\n' "$DEPLOY_SHA"
          REMOTE
          ssh_status="${PIPESTATUS[0]}"
          set -e

          previous_sha="$(sed -n 's/^VETS_PREVIOUS_SHA=//p' "$deploy_log" | head -n 1)"
          remote_final_sha="$(sed -n 's/^VETS_FINAL_SHA=//p' "$deploy_log" | tail -n 1)"
          mutation_started=false
          inline_attempted=false
          inline_succeeded=false
          inline_failed=false
          grep -q '^VETS_MUTATION_STARTED=true$' "$deploy_log" && mutation_started=true
          grep -q '^VETS_INLINE_ROLLBACK_ATTEMPTED=true$' "$deploy_log" && inline_attempted=true
          grep -q '^VETS_INLINE_ROLLBACK_SUCCEEDED=true$' "$deploy_log" && inline_succeeded=true
          grep -q '^VETS_INLINE_ROLLBACK_SUCCEEDED=false$' "$deploy_log" && inline_failed=true
          [[ "$previous_sha" =~ ^[0-9a-f]{40}$ ]] && echo "previous_sha=$previous_sha" >> "$GITHUB_OUTPUT"
          [[ "$remote_final_sha" =~ ^[0-9a-f]{40}$ ]] && echo "remote_final_sha=$remote_final_sha" >> "$GITHUB_OUTPUT"
          echo "mutation_started=$mutation_started" >> "$GITHUB_OUTPUT"
          echo "inline_rollback_attempted=$inline_attempted" >> "$GITHUB_OUTPUT"
          echo "inline_rollback_succeeded=$inline_succeeded" >> "$GITHUB_OUTPUT"
          echo "inline_rollback_failed=$inline_failed" >> "$GITHUB_OUTPUT"
          echo "deploy_exit_code=$ssh_status" >> "$GITHUB_OUTPUT"
          exit "$ssh_status"

      - name: Purge Cloudflare cache
        id: cloudflare_purge
        if: steps.deploy_app.outcome == 'success'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 3); do
            if response="$(curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}')" &&
               jq -e '.success == true and ((.errors // []) | length == 0)' \
                 <<<"$response" >/dev/null; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Verify public deployment after purge
        id: public_verify
        if: steps.deploy_app.outcome == 'success' && steps.cloudflare_purge.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          health_url='https://herobase.io/api/trpc/system.health?input=%7B%22json%22%3A%7B%22timestamp%22%3A0%7D%7D'
          for attempt in $(seq 1 10); do
            response="$(curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 15 "$health_url" || true)"
            if printf '%s' "$response" | grep -q '"ok":true' &&
               printf '%s' "$response" | grep -q "\"releaseSha\":\"$DEPLOY_SHA\"" &&
               curl --fail --silent --show-error \
                 --connect-timeout 5 --max-time 15 --output /dev/null https://herobase.io/; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Roll back after interrupted or post-deploy failure
        id: rollback_app
        if: >-
          always() &&
          (
            (
              steps.deploy_app.outcome != 'success' &&
              steps.deploy_app.outputs.mutation_started == 'true' &&
              steps.deploy_app.outputs.inline_rollback_succeeded != 'true'
            ) ||
            (
              steps.deploy_app.outcome == 'success' &&
              (
                steps.cloudflare_purge.outcome != 'success' ||
                steps.public_verify.outcome != 'success'
              )
            )
          )
        env:
          VPS1_HOST: ${{ secrets.VPS1_HOST }}
          VPS1_USER: ${{ secrets.VPS1_USER }}
          ROLLBACK_SHA: ${{ steps.deploy_app.outputs.previous_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          timeout --signal=TERM --kill-after=30s 1800 ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS1_USER@$VPS1_HOST" \
            bash -s -- "$ROLLBACK_SHA" <<'REMOTE'
          set -Eeuo pipefail
          ROLLBACK_SHA="$1"
          APP_DIR="/var/www/hero-dapp"
          HEALTH_URL='https://herobase.io/api/trpc/system.health?input=%7B%22json%22%3A%7B%22timestamp%22%3A0%7D%7D'
          cd "$APP_DIR"
          exec 9>"$APP_DIR/.git/vets-production.lock"
          flock -w 1800 9 || exit 75
          git fetch --no-tags origin main:refs/remotes/origin/main
          git cat-file -e "${ROLLBACK_SHA}^{commit}"
          guard_path="$APP_DIR/.git/vets-dao-rollback-guard.mjs"
          guard_status=0
          git show "origin/main:scripts/check-dao-rollback-compatibility.mjs" > "$guard_path"
          node "$guard_path" "$ROLLBACK_SHA" || guard_status="$?"
          rm -f "$guard_path"
          test "$guard_status" = "0"
          git reset --hard "$ROLLBACK_SHA"
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          test "$(pnpm --version)" = "10.34.4"
          pnpm install --frozen-lockfile
          rm -rf dist
          pnpm exec vite build
          pnpm exec esbuild server/_core/index.ts \
            --platform=node --packages=external --bundle --format=esm --outdir=dist
          HERO_RELEASE_SHA="$ROLLBACK_SHA" pm2 reload hero-dapp --update-env
          test "$(git rev-parse HEAD)" = "$ROLLBACK_SHA"
          pm2 jlist | EXPECTED_SHA="$ROLLBACK_SHA" node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => { input += chunk; });
            process.stdin.on("end", () => {
              const processes = JSON.parse(input);
              const app = processes.find(item => item.name === "hero-dapp");
              const actual = app?.pm2_env?.env?.HERO_RELEASE_SHA ?? app?.pm2_env?.HERO_RELEASE_SHA;
              if (actual !== process.env.EXPECTED_SHA) process.exit(1);
            });
          '
          for attempt in $(seq 1 10); do
            response="$(curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 10 "$HEALTH_URL" || true)"
            if printf '%s' "$response" | grep -q '"ok":true' &&
               printf '%s' "$response" | grep -q "\"releaseSha\":\"$ROLLBACK_SHA\""; then
              exit 0
            fi
            sleep 3
          done
          exit 1
          REMOTE

      - name: Purge Cloudflare after rollback
        id: rollback_purge
        if: always() && steps.rollback_app.outcome == 'success'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 3); do
            if response="$(curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}')" &&
               jq -e '.success == true and ((.errors // []) | length == 0)' \
                 <<<"$response" >/dev/null; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Capture final active production state
        id: final_state
        if: always()
        continue-on-error: true
        env:
          VPS1_HOST: ${{ secrets.VPS1_HOST }}
          VPS1_USER: ${{ secrets.VPS1_USER }}
        shell: bash
        run: |
          set -euo pipefail
          final_sha="$(timeout --signal=TERM --kill-after=10s 60 ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS1_USER@$VPS1_HOST" \
            'cd /var/www/hero-dapp && git rev-parse HEAD')"
          [[ "$final_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "final_active_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Compute production state before receipt
        id: state
        if: always()
        env:
          FINAL_ACTIVE_SHA: ${{ steps.final_state.outputs.final_active_sha }}
          MUTATION_STARTED: ${{ steps.deploy_app.outputs.mutation_started }}
          INLINE_ATTEMPTED: ${{ steps.deploy_app.outputs.inline_rollback_attempted }}
          INLINE_SUCCEEDED: ${{ steps.deploy_app.outputs.inline_rollback_succeeded }}
          INLINE_FAILED: ${{ steps.deploy_app.outputs.inline_rollback_failed }}
          DEPLOY_OUTCOME: ${{ steps.deploy_app.outcome }}
          PURGE_OUTCOME: ${{ steps.cloudflare_purge.outcome }}
          VERIFY_OUTCOME: ${{ steps.public_verify.outcome }}
          POST_ROLLBACK_OUTCOME: ${{ steps.rollback_app.outcome }}
          ROLLBACK_PURGE_OUTCOME: ${{ steps.rollback_purge.outcome }}
          FINAL_STATE_OUTCOME: ${{ steps.final_state.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          post_attempted=false
          post_succeeded=false
          post_failed=false
          case "$POST_ROLLBACK_OUTCOME" in
            success) post_attempted=true; post_succeeded=true ;;
            failure|cancelled|timed_out|action_required|stale)
              post_attempted=true; post_failed=true ;;
          esac
          inline_attempted="${INLINE_ATTEMPTED:-false}"
          inline_succeeded="${INLINE_SUCCEEDED:-false}"
          inline_failed="${INLINE_FAILED:-false}"
          mutation_started="${MUTATION_STARTED:-false}"
          final_active_sha="${FINAL_ACTIVE_SHA:-unknown}"
          verified=false
          if [ "$DEPLOY_OUTCOME" = "success" ] &&
             [ "$PURGE_OUTCOME" = "success" ] &&
             [ "$VERIFY_OUTCOME" = "success" ] &&
             [ "$FINAL_STATE_OUTCOME" = "success" ] &&
             [ "$final_active_sha" = "$DEPLOY_SHA" ] &&
             [ "$inline_attempted" = "false" ] &&
             [ "$post_attempted" = "false" ]; then
            verified=true
          fi
          echo "verified=$verified" >> "$GITHUB_OUTPUT"
          echo "mutation_started=$mutation_started" >> "$GITHUB_OUTPUT"
          echo "inline_attempted=$inline_attempted" >> "$GITHUB_OUTPUT"
          echo "inline_succeeded=$inline_succeeded" >> "$GITHUB_OUTPUT"
          echo "inline_failed=$inline_failed" >> "$GITHUB_OUTPUT"
          echo "post_attempted=$post_attempted" >> "$GITHUB_OUTPUT"
          echo "post_succeeded=$post_succeeded" >> "$GITHUB_OUTPUT"
          echo "post_failed=$post_failed" >> "$GITHUB_OUTPUT"

      - name: Post final production receipt
        id: receipt
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED: ${{ steps.state.outputs.verified }}
          FINAL_ACTIVE_SHA: ${{ steps.final_state.outputs.final_active_sha }}
          PREVIOUS_SHA: ${{ steps.deploy_app.outputs.previous_sha }}
          MUTATION_STARTED: ${{ steps.state.outputs.mutation_started }}
          INLINE_ATTEMPTED: ${{ steps.state.outputs.inline_attempted }}
          INLINE_SUCCEEDED: ${{ steps.state.outputs.inline_succeeded }}
          INLINE_FAILED: ${{ steps.state.outputs.inline_failed }}
          POST_ATTEMPTED: ${{ steps.state.outputs.post_attempted }}
          POST_SUCCEEDED: ${{ steps.state.outputs.post_succeeded }}
          POST_FAILED: ${{ steps.state.outputs.post_failed }}
          DEPLOY_OUTCOME: ${{ steps.deploy_app.outcome }}
          PURGE_OUTCOME: ${{ steps.cloudflare_purge.outcome }}
          VERIFY_OUTCOME: ${{ steps.public_verify.outcome }}
          ROLLBACK_PURGE_OUTCOME: ${{ steps.rollback_purge.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(cat <<EOF_BODY
          ## VETS production result

          - Requested SHA: \`$DEPLOY_SHA\`
          - Previous SHA: \`${PREVIOUS_SHA:-unknown}\`
          - Final active SHA: \`${FINAL_ACTIVE_SHA:-unknown}\`
          - Correlation: \`$DEPLOY_CORRELATION_ID\`
          - Operation: **$DEPLOY_OPERATION**
          - Authorization mode: **$AUTHORIZATION_MODE**
          - Consumption comment: \`$CONSUMPTION_COMMENT_ID\`
          - Authorizing CI run: \`$AUTH_CI_RUN_ID\`
          - Authorizing Security run: \`$AUTH_SECURITY_RUN_ID\`
          - Mutation started: **${MUTATION_STARTED:-false}**
          - Deployment outcome: **$DEPLOY_OUTCOME**
          - Cloudflare purge outcome: **$PURGE_OUTCOME**
          - Public verification outcome: **$VERIFY_OUTCOME**
          - Inline rollback attempted/succeeded/failed: **${INLINE_ATTEMPTED:-false}/${INLINE_SUCCEEDED:-false}/${INLINE_FAILED:-false}**
          - Post-deploy rollback attempted/succeeded/failed: **${POST_ATTEMPTED:-false}/${POST_SUCCEEDED:-false}/${POST_FAILED:-false}**
          - Rollback purge outcome: **$ROLLBACK_PURGE_OUTCOME**
          - Exact state verified: **${VERIFIED:-false}**
          - Result artifact: \`production-result-$DEPLOY_CORRELATION_ID\`
          EOF_BODY
          )"
          payload="$(jq -nc --arg body "$body" '{body:$body}')"
          posted=false
          for attempt in $(seq 1 5); do
            if curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE/comments" \
              --data "$payload" >/dev/null; then
              posted=true
              break
            fi
            sleep $((attempt * 2))
          done
          echo "posted=$posted" >> "$GITHUB_OUTPUT"
          test "$posted" = "true"

      - name: Write immutable production result
        id: result
        if: always()
        env:
          PREVIOUS_SHA: ${{ steps.deploy_app.outputs.previous_sha }}
          FINAL_ACTIVE_SHA: ${{ steps.final_state.outputs.final_active_sha }}
          MUTATION_STARTED: ${{ steps.state.outputs.mutation_started }}
          INLINE_ATTEMPTED: ${{ steps.state.outputs.inline_attempted }}
          INLINE_SUCCEEDED: ${{ steps.state.outputs.inline_succeeded }}
          INLINE_FAILED: ${{ steps.state.outputs.inline_failed }}
          POST_ATTEMPTED: ${{ steps.state.outputs.post_attempted }}
          POST_SUCCEEDED: ${{ steps.state.outputs.post_succeeded }}
          POST_FAILED: ${{ steps.state.outputs.post_failed }}
          DEPLOY_OUTCOME: ${{ steps.deploy_app.outcome }}
          PURGE_OUTCOME: ${{ steps.cloudflare_purge.outcome }}
          VERIFY_OUTCOME: ${{ steps.public_verify.outcome }}
          ROLLBACK_PURGE_OUTCOME: ${{ steps.rollback_purge.outcome }}
          FINAL_STATE_OUTCOME: ${{ steps.final_state.outcome }}
          APPLICATION_VERIFIED: ${{ steps.state.outputs.verified }}
          RECEIPT_POSTED: ${{ steps.receipt.outputs.posted }}
          RECEIPT_OUTCOME: ${{ steps.receipt.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          receipt_posted="${RECEIPT_POSTED:-false}"
          application_verified="${APPLICATION_VERIFIED:-false}"
          verified=false
          if [ "$application_verified" = "true" ] && [ "$receipt_posted" = "true" ]; then
            verified=true
          fi
          echo "verified=$verified" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg requested_sha "$DEPLOY_SHA" \
            --arg previous_sha "${PREVIOUS_SHA:-unknown}" \
            --arg final_active_sha "${FINAL_ACTIVE_SHA:-unknown}" \
            --arg correlation_id "$DEPLOY_CORRELATION_ID" \
            --arg operation "$DEPLOY_OPERATION" \
            --arg authorization_mode "$AUTHORIZATION_MODE" \
            --arg consumption_comment_id "$CONSUMPTION_COMMENT_ID" \
            --arg authorizing_ci_run_id "$AUTH_CI_RUN_ID" \
            --arg authorizing_security_run_id "$AUTH_SECURITY_RUN_ID" \
            --arg deploy_outcome "$DEPLOY_OUTCOME" \
            --arg purge_outcome "$PURGE_OUTCOME" \
            --arg verify_outcome "$VERIFY_OUTCOME" \
            --arg rollback_purge_outcome "$ROLLBACK_PURGE_OUTCOME" \
            --arg final_state_outcome "$FINAL_STATE_OUTCOME" \
            --arg receipt_outcome "$RECEIPT_OUTCOME" \
            --argjson mutation_started "${MUTATION_STARTED:-false}" \
            --argjson inline_rollback_attempted "${INLINE_ATTEMPTED:-false}" \
            --argjson inline_rollback_succeeded "${INLINE_SUCCEEDED:-false}" \
            --argjson inline_rollback_failed "${INLINE_FAILED:-false}" \
            --argjson post_rollback_attempted "${POST_ATTEMPTED:-false}" \
            --argjson post_rollback_succeeded "${POST_SUCCEEDED:-false}" \
            --argjson post_rollback_failed "${POST_FAILED:-false}" \
            --argjson application_verified "$application_verified" \
            --argjson receipt_posted "$receipt_posted" \
            --argjson verified "$verified" \
            '{
              requested_sha:$requested_sha,
              previous_sha:$previous_sha,
              final_active_sha:$final_active_sha,
              correlation_id:$correlation_id,
              operation:$operation,
              authorization_mode:$authorization_mode,
              consumption_comment_id:$consumption_comment_id,
              authorizing_ci_run_id:$authorizing_ci_run_id,
              authorizing_security_run_id:$authorizing_security_run_id,
              mutation_started:$mutation_started,
              deploy_outcome:$deploy_outcome,
              purge_outcome:$purge_outcome,
              verify_outcome:$verify_outcome,
              rollback_purge_outcome:$rollback_purge_outcome,
              final_state_outcome:$final_state_outcome,
              inline_rollback_attempted:$inline_rollback_attempted,
              inline_rollback_succeeded:$inline_rollback_succeeded,
              inline_rollback_failed:$inline_rollback_failed,
              post_rollback_attempted:$post_rollback_attempted,
              post_rollback_succeeded:$post_rollback_succeeded,
              post_rollback_failed:$post_rollback_failed,
              application_verified:$application_verified,
              receipt_posted:$receipt_posted,
              receipt_outcome:$receipt_outcome,
              verified:$verified
            }' > production-result.json

      - name: Upload immutable production result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-result-${{ inputs.correlation_id }}
          path: production-result.json
          retention-days: 30
          if-no-files-found: error

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Enforce verified production state and required receipt
        if: always()
        env:
          VERIFIED: ${{ steps.result.outputs.verified }}
          RECEIPT_POSTED: ${{ steps.receipt.outputs.posted }}
        shell: bash
        run: |
          test "$VERIFIED" = "true"
          test "$RECEIPT_POSTED" = "true"
