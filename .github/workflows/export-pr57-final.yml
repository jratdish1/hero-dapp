name: Export PR57 final production-controller blobs

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  issues: write

concurrency:
  group: export-pr57-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.event.pull_request.head.ref == 'fix/production-controller-finality-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/production-controller-finality-20260725
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Generate, validate, and publish exact blobs
        id: exporter
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 ops/pr57-export.py > pr57-export.log 2>&1
          status=$?
          cat pr57-export.log
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload exporter evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr57-export-${{ github.event.pull_request.head.sha }}
          path: |
            pr57-export.log
            pr57-output
          retention-days: 7
          if-no-files-found: warn

      - name: Enforce exporter gate
        if: always()
        shell: bash
        run: |
          test "${{ steps.exporter.outcome }}" = "success"
          test "${{ steps.exporter.outputs.exit_status }}" = "0"
