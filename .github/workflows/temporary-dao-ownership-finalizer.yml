name: Temporary narrow DAO ownership finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: temporary-dao-ownership-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.event.pull_request.number == 59 &&
      github.event.pull_request.head.ref == 'ops/herobase-deploy-monitor-20260725' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_MAIN_SHA: 26d60888fe3410951f422cb7a68cee10661c2eaf
      FINAL_BRANCH: fix/dao-ownership-production-final-20260726
      TRIGGER_TEXT: VETS FINALIZE DAO OWNERSHIP 26d60888fe3410951f422cb7a68cee10661c2eaf

    steps:
      - name: Checkout exact current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Verify owner trigger and build exact one-file correction
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          trigger=''
          git show "origin/ops/herobase-deploy-monitor-20260725:ops/dao-ownership-finalize.trigger" >/tmp/dao-trigger 2>/dev/null || true
          [ -f /tmp/dao-trigger ] && trigger="$(cat /tmp/dao-trigger)"
          test "$trigger" = "$TRIGGER_TEXT"
          test "$(git rev-parse HEAD)" = "$TARGET_MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_MAIN_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/routers.ts')
          text = path.read_text()

          old_proposal = '''        .mutation(async ({ input }) => {
            const proposal = await getProposalById(input.proposalId);
            if (!proposal) createStandardError("NOT_FOUND", "Proposal not found");
            await updateProposal(proposal.id, { status: input.status });
'''
          new_proposal = '''        .mutation(async ({ ctx, input }) => {
            const proposal = await getProposalById(input.proposalId);
            if (!proposal) createStandardError("NOT_FOUND", "Proposal not found");
            // SECURITY FIX: only the authenticated proposal creator may change status.
            if (proposal.proposerId !== ctx.user.id) {
              createStandardError("FORBIDDEN", "Only the proposal creator may update its status");
            }
            await updateProposal(proposal.id, { status: input.status });
'''
          old_delegate = '''      .mutation(async ({ input }) => {
            const delegate = await getDelegateByAddress(input.address);
            if (!delegate) createStandardError("NOT_FOUND", "Delegate not found");
            await updateDelegate(delegate.id, {
'''
          new_delegate = '''      .mutation(async ({ ctx, input }) => {
            const delegate = await getDelegateByAddress(input.address);
            if (!delegate) createStandardError("NOT_FOUND", "Delegate not found");
            // SECURITY FIX: only the authenticated delegate owner may edit this profile.
            if (delegate.userId !== ctx.user.id) {
              createStandardError("FORBIDDEN", "Only the delegate owner may update this profile");
            }
            await updateDelegate(delegate.id, {
'''

          if text.count(old_proposal) != 1:
              raise SystemExit(f'proposal anchor count: {text.count(old_proposal)}')
          if text.count(old_delegate) != 1:
              raise SystemExit(f'delegate anchor count: {text.count(old_delegate)}')
          text = text.replace(old_proposal, new_proposal, 1)
          text = text.replace(old_delegate, new_delegate, 1)
          path.write_text(text)
          PY

          test "$(git diff --name-only | wc -l)" = '1'
          test "$(git diff --name-only)" = 'server/routers.ts'
          grep -q 'proposal.proposerId !== ctx.user.id' server/routers.ts
          grep -q 'delegate.userId !== ctx.user.id' server/routers.ts
          grep -q 'Only the proposal creator may update its status' server/routers.ts
          grep -q 'Only the delegate owner may update this profile' server/routers.ts
          git diff --check

          git config user.name 'VETS Production Security'
          git config user.email '92892706+jratdish1@users.noreply.github.com'
          git switch -c "$FINAL_BRANCH"
          git add server/routers.ts
          git commit -m 'fix(security): enforce DAO proposal and delegate ownership'
          head_sha="$(git rev-parse HEAD)"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          git push origin "HEAD:refs/heads/$FINAL_BRANCH"

          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$FINAL_BRANCH" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$FINAL_BRANCH" \
              --title 'fix(security): enforce DAO proposal and delegate ownership' \
              --body-file - <<EOF_BODY
          ## Mission

          Narrow production-security correction preventing authenticated cross-user DAO mutation.

          ## Exact scope

          One file: \`server/routers.ts\`.

          ## Corrections

          - \`dao.proposals.updateStatus\` now requires the authenticated user to own the proposal.
          - \`dao.delegates.update\` now requires the authenticated user to own the delegate profile.

          Single-sided staking and binding DAO governance/snapshot voting remain approved deferred work. This PR does not activate contracts, wallets, staking, trading, or production.

          ## Required gates

          Exact-head CI, Security and Quality, fresh Codex review, zero unresolved P0/P1/P2 findings, independent ChatGPT Grade A, and expected-head squash merge.
          EOF_BODY
            )"
            pr_number="${pr_url##*/}"
          else
            pr_number="$existing"
            pr_url="https://github.com/$GITHUB_REPOSITORY/pull/$pr_number"
          fi
          [[ "$pr_number" =~ ^[0-9]+$ ]]
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          printf 'DAO_FINAL_PR=%s\nDAO_FINAL_HEAD=%s\n' "$pr_number" "$head_sha"

      - name: Upload finalizer receipt
        if: always()
        shell: bash
        env:
          HEAD_SHA: ${{ steps.finalize.outputs.head_sha }}
          PR_NUMBER: ${{ steps.finalize.outputs.pr_number }}
          PR_URL: ${{ steps.finalize.outputs.pr_url }}
        run: |
          set -euo pipefail
          jq -n \
            --arg head_sha "${HEAD_SHA:-unknown}" \
            --arg pr_number "${PR_NUMBER:-unknown}" \
            --arg pr_url "${PR_URL:-unknown}" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{head_sha:$head_sha,pr_number:$pr_number,pr_url:$pr_url,scope:["server/routers.ts"],created_at:$created_at}' \
            > dao-ownership-finalizer.json

      - name: Preserve finalizer receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dao-ownership-finalizer-${{ github.sha }}
          path: dao-ownership-finalizer.json
          retention-days: 14
          if-no-files-found: error
