name: Temporary HeroBase production host finalizer v3

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: vets-herobase-production-host-finalizer-v3
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.event.pull_request.number == 59 &&
      github.event.pull_request.head.ref == 'ops/herobase-deploy-monitor-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      VDS_HOST: ${{ secrets.VDS_HOST }}
      VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
      VPS1_HOST: ${{ secrets.VPS1_HOST }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      PATCH_BRANCH: fix/dao-ownership-production-final-v3-20260726
      TRACKER_ISSUE: '43'
      EXPECTED_VDS_ED25519: SHA256:EdmFXzo/0Tw9jlbH+tNfBGcRGDf1TQu8m0LWiobRXFY
    steps:
      - name: Checkout temporary executor lane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ops/herobase-deploy-monitor-20260725
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Execute idempotent locked host finalizer
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 ops/herobase-production-host-finalizer-v2.sh
          ops/herobase-production-host-finalizer-v2.sh
      - name: Upload immutable host-finalizer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: herobase-host-finalizer-v3-${{ github.event.pull_request.head.sha }}
          path: evidence
          retention-days: 30
          if-no-files-found: error
