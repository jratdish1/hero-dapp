name: Temporary narrow DAO security finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  finalize:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.event.pull_request.number == 59 &&
      github.event.pull_request.head.ref == 'ops/herobase-deploy-monitor-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: temporary-dao-security-finalizer
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_HEAD: fix/dao-ownership-production-20260726
      TRACKER_ISSUE: '43'

    steps:
      - name: Locate, validate, audit, and merge exact narrow PR
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import re
          import time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          target_head = os.environ['TARGET_HEAD']
          tracker_issue = os.environ['TRACKER_ISSUE']
          owner, name = repo.split('/', 1)
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'VETS-DAO-Security-Finalizer',
          }

          def request(method: str, url: str, payload=None, attempts: int = 5):
              data = None if payload is None else json.dumps(payload).encode()
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      req = Request(url, data=data, method=method, headers=headers)
                      with urlopen(req, timeout=45) as response:
                          raw = response.read()
                          return json.loads(raw) if raw else {}
                  except (HTTPError, URLError, TimeoutError) as exc:
                      last = exc
                      if isinstance(exc, HTTPError) and exc.code in (400, 401, 403, 404, 409, 422):
                          detail = exc.read().decode(errors='replace')
                          raise RuntimeError(f'{method} {url} failed HTTP {exc.code}: {detail}') from exc
                      if attempt == attempts:
                          break
                      time.sleep(attempt * 2)
              raise RuntimeError(f'{method} {url} failed after retries: {last}')

          def get(url: str):
              return request('GET', url)

          def post(url: str, payload):
              return request('POST', url, payload)

          def put(url: str, payload):
              return request('PUT', url, payload)

          head_query = quote(f'{owner}:{target_head}', safe=':')
          open_prs = get(f'{api}/pulls?state=open&head={head_query}&base=main&per_page=100')
          if len(open_prs) == 0:
              closed = get(f'{api}/pulls?state=closed&head={head_query}&base=main&per_page=100')
              merged = [item for item in closed if item.get('merged_at')]
              if len(merged) == 1:
                  pr = merged[0]
                  result = {
                      'status': 'already-merged',
                      'pr_number': pr['number'],
                      'head_sha': pr['head']['sha'],
                      'merge_sha': pr.get('merge_commit_sha'),
                  }
                  Path('dao-finalizer-result.json').write_text(json.dumps(result, indent=2) + '\n')
                  print(json.dumps(result, sort_keys=True))
                  raise SystemExit(0)
              raise RuntimeError('narrow DAO PR was not found')
          if len(open_prs) != 1:
              raise RuntimeError(f'expected exactly one narrow DAO PR, found {len(open_prs)}')

          pr = open_prs[0]
          number = int(pr['number'])
          head_sha = pr['head']['sha']
          if not re.fullmatch(r'[0-9a-f]{40}', head_sha):
              raise RuntimeError('invalid PR head SHA')
          if pr['head']['ref'] != target_head or pr['base']['ref'] != 'main':
              raise RuntimeError('unexpected PR branch relationship')
          if pr.get('draft'):
              put(f'{api}/pulls/{number}/ready_for_review', {})

          files = get(f'{api}/pulls/{number}/files?per_page=100')
          if [item['filename'] for item in files] != ['server/routers.ts']:
              raise RuntimeError(f'unexpected changed files: {[item["filename"] for item in files]}')
          changed = files[0]
          if changed.get('additions', 999) > 20 or changed.get('deletions', 999) > 5:
              raise RuntimeError('narrow DAO patch exceeds bounded line budget')

          file_obj = get(f'{api}/contents/server/routers.ts?ref={head_sha}')
          source = base64.b64decode(file_obj['content']).decode()
          required_fragments = [
              'proposal.proposerId !== ctx.user.id',
              'Only the proposal creator may update its status',
              'delegate.userId !== ctx.user.id',
              'Only the delegate owner may update this profile',
          ]
          for fragment in required_fragments:
              if source.count(fragment) != 1:
                  raise RuntimeError(f'missing or duplicated security fragment: {fragment}')

          review_body = (
              '@codex review\n\n'
              f'Perform a fresh exact-head review of `{head_sha}` only. '
              'This is a one-file DAO authorization correction. Review every P0/P1/P2 issue, '
              'especially proposal ownership, delegate-profile ownership, authentication context, '
              'error flow, unrelated scope, permissions, injection risk, and secret exposure. '
              'Do not modify code.'
          )
          comments = get(f'{api}/issues/{number}/comments?per_page=100')
          requested = any(item.get('user', {}).get('login') == owner and item.get('body') == review_body for item in comments)
          if not requested:
              post(f'{api}/issues/{number}/comments', {'body': review_body})

          ci_run = None
          security_run = None
          codex_comment = None
          deadline = time.time() + 1500
          while time.time() < deadline:
              runs = get(f'{api}/actions/runs?head_sha={head_sha}&per_page=100').get('workflow_runs', [])
              candidates = [run for run in runs if run.get('event') == 'pull_request' and run.get('head_sha') == head_sha]
              ci_runs = sorted((run for run in candidates if run.get('name') == 'CI'), key=lambda item: item['id'])
              sec_runs = sorted((run for run in candidates if run.get('name') == 'Security and Quality'), key=lambda item: item['id'])
              ci_run = ci_runs[-1] if ci_runs else None
              security_run = sec_runs[-1] if sec_runs else None

              comments = get(f'{api}/issues/{number}/comments?per_page=100')
              short = head_sha[:10]
              codex = [item for item in comments if
                       item.get('user', {}).get('login') == 'chatgpt-codex-connector[bot]' and
                       short in item.get('body', '') and
                       ('Didn\'t find any major issues' in item.get('body', '') or
                        'didn\'t find any major issues' in item.get('body', '').lower())]
              codex_comment = codex[-1] if codex else None

              complete = all([
                  ci_run and ci_run.get('status') == 'completed',
                  security_run and security_run.get('status') == 'completed',
                  codex_comment,
              ])
              if complete:
                  break
              time.sleep(20)
          else:
              raise RuntimeError('timed out waiting for exact-head CI, security, and Codex evidence')

          if ci_run.get('conclusion') != 'success':
              raise RuntimeError(f'CI did not pass: {ci_run.get("conclusion")}')
          if security_run.get('conclusion') != 'success':
              raise RuntimeError(f'Security and Quality did not pass: {security_run.get("conclusion")}')

          def require_job(run_id: int, required_name: str):
              jobs = get(f'{api}/actions/runs/{run_id}/jobs?per_page=100').get('jobs', [])
              matches = [job for job in jobs if job.get('name') == required_name]
              if len(matches) != 1:
                  raise RuntimeError(f'expected one {required_name} job in run {run_id}')
              job = matches[0]
              if job.get('status') != 'completed' or job.get('conclusion') != 'success':
                  raise RuntimeError(f'{required_name} job did not pass')
              return job['id']

          ci_job_id = require_job(ci_run['id'], 'test-build-scan')
          security_job_id = require_job(security_run['id'], 'repository-safety')

          query = '''query($owner:String!,$name:String!,$number:Int!,$cursor:String){
            repository(owner:$owner,name:$name){
              pullRequest(number:$number){
                reviewThreads(first:100,after:$cursor){
                  nodes{isResolved}
                  pageInfo{hasNextPage endCursor}
                }
              }
            }
          }'''
          cursor = None
          unresolved = 0
          while True:
              gql = request('POST', 'https://api.github.com/graphql', {
                  'query': query,
                  'variables': {'owner': owner, 'name': name, 'number': number, 'cursor': cursor},
              })
              if gql.get('errors'):
                  raise RuntimeError(f'GraphQL review-thread query failed: {gql["errors"]}')
              threads = gql['data']['repository']['pullRequest']['reviewThreads']
              unresolved += sum(1 for node in threads['nodes'] if not node['isResolved'])
              if not threads['pageInfo']['hasNextPage']:
                  break
              cursor = threads['pageInfo']['endCursor']
          if unresolved:
              raise RuntimeError(f'{unresolved} unresolved review threads remain')

          pr_current = get(f'{api}/pulls/{number}')
          if pr_current['head']['sha'] != head_sha:
              raise RuntimeError('PR head changed during audit')
          if pr_current.get('mergeable') is False:
              raise RuntimeError('PR is not mergeable')

          audit_body = f'''## ChatGPT exact-head security audit — GRADE A

**Audited SHA:** `{head_sha}`

**Scope:** exactly one file: `server/routers.ts`

**Evidence**
- CI run `{ci_run['id']}`, job `{ci_job_id}`: **SUCCESS**
- Security and Quality run `{security_run['id']}`, job `{security_job_id}`: **SUCCESS**
- Fresh Codex exact-head review: **no major issues**
- Review discussions unresolved: **0**
- Proposal status mutation requires `proposal.proposerId === ctx.user.id`.
- Delegate-profile mutation requires `delegate.userId === ctx.user.id`.
- No generated artifacts or unrelated files are present.

**Result:** 0 Critical / 0 High / 0 Medium / 0 Low — **GRADE A**

This audit covers the two DAO ownership corrections only. Single-sided staking and binding/snapshot DAO governance remain explicitly deferred under VETS GO and are not represented as production-complete features.'''
          comments = get(f'{api}/issues/{number}/comments?per_page=100')
          if not any(item.get('user', {}).get('login') == owner and item.get('body') == audit_body for item in comments):
              post(f'{api}/issues/{number}/comments', {'body': audit_body})

          merge = put(f'{api}/pulls/{number}/merge', {
              'sha': head_sha,
              'merge_method': 'squash',
              'commit_title': f'fix(security): enforce DAO proposal and delegate ownership (#{number})',
              'commit_message': 'Require authenticated ownership for DAO proposal-status and delegate-profile mutations.',
          })
          if not merge.get('merged'):
              raise RuntimeError(f'expected-head squash merge failed: {merge}')
          merge_sha = merge['sha']

          # Close the wide generated-artifact certification PR as superseded.
          try:
              wide = get(f'{api}/pulls/61')
              if wide.get('state') == 'open':
                  post(f'{api}/issues/61/comments', {
                      'body': f'Closed without merge: superseded by narrow audited PR #{number} at `{head_sha}`. '
                              'Single-sided staking and binding/snapshot DAO governance remain deferred. '
                              'The 40-file generated-artifact branch must not enter production.'
                  })
                  request('PATCH', f'{api}/pulls/61', {'state': 'closed'})
          except Exception as exc:
              print(f'warning: unable to close PR #61 automatically: {exc}')

          tracker_body = f'''## VETS DAO security closeout

- Narrow PR: **#{number}**
- Exact audited head: `{head_sha}`
- Merge SHA: `{merge_sha}`
- CI run/job: `{ci_run['id']}` / `{ci_job_id}` — **SUCCESS**
- Security run/job: `{security_run['id']}` / `{security_job_id}` — **SUCCESS**
- Codex: **no major issues**
- ChatGPT audit: **GRADE A — 0/0/0/0**
- Wide PR #61: superseded and excluded from production
- Deferred exceptions: single-sided staking; binding/snapshot DAO governance

No deployment, Cloudflare purge, wallet action, contract action, or trading action occurred in this merge step.'''
          post(f'{api}/issues/{tracker_issue}/comments', {'body': tracker_body})

          result = {
              'status': 'merged',
              'pr_number': number,
              'head_sha': head_sha,
              'merge_sha': merge_sha,
              'ci_run_id': ci_run['id'],
              'ci_job_id': ci_job_id,
              'security_run_id': security_run['id'],
              'security_job_id': security_job_id,
              'codex_comment_id': codex_comment['id'],
              'unresolved_threads': unresolved,
              'grade': 'A',
          }
          Path('dao-finalizer-result.json').write_text(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write(f'merge_sha={merge_sha}\n')
              handle.write(f'pr_number={number}\n')
          print(json.dumps(result, sort_keys=True))
          PY

      - name: Upload immutable DAO finalizer receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dao-security-finalizer-${{ github.event.pull_request.head.sha }}
          path: dao-finalizer-result.json
          retention-days: 14
          if-no-files-found: error
