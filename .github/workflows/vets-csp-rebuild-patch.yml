name: One-shot clean CSP rebuild patch

on:
  push:
    branches:
      - closeout/csp-rebuild-20260802
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'closeout/csp-rebuild-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: closeout/csp-rebuild-20260802
          fetch-depth: 0

      - name: Stop after the one-shot result commit
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" = 'chore: apply clean CSP rebuild patch' ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch bounded source commit
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin cert/m1-csp-clean-20260730
          git cat-file -e 3f9af36c1b916143bf9c05081c908e2ea504b422^{commit}

      - name: Apply deterministic CSP-only patch
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/vets-csp-rebuild-patch.py
          python3 -m py_compile scripts/vets-csp-rebuild-patch.py
          node --check scripts/check-csp-contract.mjs
          node --check scripts/check-csp-routes.mjs
          node --check scripts/check-scroll-lock-csp.mjs
          node --check scripts/check-generic-error-focus.mjs
          test ! -e .github/workflows/deploy-vdss.yml
          test ! -e scripts/vets-vdss-production.sh
          git diff --check

      - name: Commit exact patch result
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VETS GitHub automation'
          git config user.email 'jratdish1@users.noreply.github.com'
          git add --all
          git diff --cached --quiet && {
            echo 'Expected CSP patch produced no changes' >&2
            exit 1
          }
          git commit -m 'chore: apply clean CSP rebuild patch'
          git push origin HEAD:closeout/csp-rebuild-20260802
