name: Temporary VPS1 canonical HeroBase migration v2

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  migrate:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.event.pull_request.number == 59 &&
      github.event.pull_request.head.ref == 'ops/herobase-deploy-monitor-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    concurrency:
      group: temporary-vps1-canonical-herobase-migration-v2
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VDS_HOST: ${{ secrets.VDS_HOST }}
      VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
      TRACKER_ISSUE: '43'

    steps:
      - name: Require audited main and credential-preparation v2 receipt
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          api_get() {
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' "$1"
          }
          deadline=$((SECONDS + 2700))
          while [ "$SECONDS" -lt "$deadline" ]; do
            sha="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -r '.object.sha')"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            ci_id="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml" | jq -r '.id')"
            sec_id="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/security-and-quality.yml" | jq -r '.id')"
            ci="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$ci_id/runs?branch=main&event=push&head_sha=$sha&per_page=100" | jq -c --arg sha "$sha" '[.workflow_runs[]|select(.head_sha==$sha and .event=="push" and .run_attempt==1)]|sort_by(.id)|last//empty')"
            sec="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$sec_id/runs?branch=main&event=push&head_sha=$sha&per_page=100" | jq -c --arg sha "$sha" '[.workflow_runs[]|select(.head_sha==$sha and .event=="push" and .run_attempt==1)]|sort_by(.id)|last//empty')"
            comments="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE/comments?per_page=100")"
            receipt="$(jq -c --arg sha "$sha" '[.[]|select(
              .user.login=="github-actions[bot]" and
              (.body|startswith("## VETS production credential preparation v2 — COMPLETE")) and
              (.body|contains("Release SHA: `"+$sha+"`")) and
              (.body|contains("Required production environment secret names: **6/6 present**"))
            )]|sort_by(.id)|last//empty' <<<"$comments")"
            if [ -n "$ci" ] && [ -n "$sec" ] && [ -n "$receipt" ] && \
               [ "$(jq -r '.status+":"+(.conclusion//"")' <<<"$ci")" = completed:success ] && \
               [ "$(jq -r '.status+":"+(.conclusion//"")' <<<"$sec")" = completed:success ]; then
              echo "release_sha=$sha" >> "$GITHUB_OUTPUT"
              echo "ci_run_id=$(jq -r '.id' <<<"$ci")" >> "$GITHUB_OUTPUT"
              echo "security_run_id=$(jq -r '.id' <<<"$sec")" >> "$GITHUB_OUTPUT"
              echo "credential_receipt_id=$(jq -r '.id' <<<"$receipt")" >> "$GITHUB_OUTPUT"
              printf 'MIGRATION_V2_GATE=PASS sha=%s\n' "$sha"
              exit 0
            fi
            sleep 20
          done
          echo 'Migration v2 gate timed out' >&2
          exit 75

      - name: Establish pinned VDS-M route
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$VDS_HOST" ] && [ -n "$VDS_SSH_KEY" ]
          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VDS_SSH_KEY" > "$HOME/.ssh/vds_key"
          ssh-keygen -y -f "$HOME/.ssh/vds_key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$VDS_HOST" > "$HOME/.ssh/vds_known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$HOME/.ssh/vds_known_hosts" | awk '{print $2}')" = \
            'SHA256:EdmFXzo/0Tw9jlbH+tNfBGcRGDf1TQu8m0LWiobRXFY'
          chmod 600 "$HOME/.ssh/vds_key" "$HOME/.ssh/vds_known_hosts"

      - name: Perform canonical non-root migration with rollback and soak
        id: migration
        env:
          RELEASE_SHA: ${{ steps.gate.outputs.release_sha }}
          CI_RUN: ${{ steps.gate.outputs.ci_run_id }}
          SECURITY_RUN: ${{ steps.gate.outputs.security_run_id }}
          CREDENTIAL_RECEIPT: ${{ steps.gate.outputs.credential_receipt_id }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/vds_key" -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/vds_known_hosts" \
            "root@$VDS_HOST" bash -s -- "$RELEASE_SHA" "$CI_RUN" "$SECURITY_RUN" "$CREDENTIAL_RECEIPT" <<'VDS' \
            | tee vps1-migration-v2-receipt.txt
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            vps1 bash -s -- "$1" "$2" "$3" "$4" <<'VPS1'
          set -Eeuo pipefail
          RELEASE_SHA="$1"; CI_RUN="$2"; SECURITY_RUN="$3"; CREDENTIAL_RECEIPT="$4"
          USER_NAME='hero-deploy'
          CANONICAL='/var/www/hero-dapp'
          OLD_ACTIVE='/root/hero-dapp'
          HEALTH='/api/trpc/system.health?input=%7B%22json%22%3A%7B%22timestamp%22%3A0%7D%7D'
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="/var/backups/vets-herobase/$stamp"
          STAGE="/var/www/.hero-dapp-stage-${RELEASE_SHA:0:12}"
          mkdir -p "$BACKUP"; chmod 700 "$BACKUP"
          exec > >(tee -a "$BACKUP/migration.log") 2>&1

          root_process_exists=false
          root_was_online=false
          canonical_swapped=false
          user_process_started=false
          rollback() {
            status=$?
            trap - ERR
            printf 'VETS_MIGRATION_ROLLBACK_ATTEMPTED=true\n'
            if [ "$user_process_started" = true ]; then
              runuser -u "$USER_NAME" -- env HOME="/home/$USER_NAME" PM2_HOME="/home/$USER_NAME/.pm2" \
                PATH="/home/$USER_NAME/.local/bin:/usr/local/bin:/usr/bin:/bin" \
                pm2 delete hero-dapp >/dev/null 2>&1 || true
            fi
            systemctl stop pm2-hero-deploy.service >/dev/null 2>&1 || true
            if [ "$canonical_swapped" = true ] && [ -d "$BACKUP/original-var-www-hero-dapp" ]; then
              if [ -e "$CANONICAL" ]; then mv "$CANONICAL" "$CANONICAL.failed.$stamp" || true; fi
              mv "$BACKUP/original-var-www-hero-dapp" "$CANONICAL" || true
            fi
            if [ "$root_process_exists" = true ]; then
              pm2 restart hero-dapp --update-env >/dev/null 2>&1 || pm2 resurrect >/dev/null 2>&1 || true
            fi
            printf 'VETS_MIGRATION_ROLLBACK_COMPLETED=true\n'
            exit "$status"
          }
          trap rollback ERR

          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          id "$USER_NAME" >/dev/null
          for cmd in git node npm corepack pm2 curl flock jq rsync runuser sshd ss; do command -v "$cmd" >/dev/null; done

          printf 'RELEASE_SHA=%s\nCI_RUN=%s\nSECURITY_RUN=%s\nCREDENTIAL_RECEIPT=%s\n' \
            "$RELEASE_SHA" "$CI_RUN" "$SECURITY_RUN" "$CREDENTIAL_RECEIPT"

          pm2 jlist > "$BACKUP/root-pm2-before.json"; chmod 600 "$BACKUP/root-pm2-before.json"
          root_status="$(node - "$BACKUP/root-pm2-before.json" <<'NODE'
          const fs=require('fs');const a=JSON.parse(fs.readFileSync(process.argv[2],'utf8')||'[]').find(x=>x.name==='hero-dapp');process.stdout.write(a?.pm2_env?.status||'absent');
          NODE
          )"
          root_cwd="$(node - "$BACKUP/root-pm2-before.json" <<'NODE'
          const fs=require('fs');const a=JSON.parse(fs.readFileSync(process.argv[2],'utf8')||'[]').find(x=>x.name==='hero-dapp');process.stdout.write(a?.pm2_env?.pm_cwd||'unknown');
          NODE
          )"
          printf 'ROOT_PM2_STATUS=%s\nROOT_PM2_CWD=%s\n' "$root_status" "$root_cwd"
          if [ "$root_status" != absent ]; then root_process_exists=true; fi
          if [ "$root_status" = online ]; then root_was_online=true; fi

          for path in "$OLD_ACTIVE" "$CANONICAL"; do
            label="$(printf '%s' "$path" | tr '/' '_')"
            if [ -d "$path/.git" ]; then
              (cd "$path"; git rev-parse HEAD > "$BACKUP/$label.head"; git status --porcelain=v1 --untracked-files=all > "$BACKUP/$label.status"; git diff --binary > "$BACKUP/$label.worktree.patch" || true; git diff --cached --binary > "$BACKUP/$label.index.patch" || true)
            fi
          done

          rm -rf "$STAGE"
          install -d -m 755 -o "$USER_NAME" -g "$USER_NAME" "$STAGE"
          runuser -u "$USER_NAME" -- env HOME="/home/$USER_NAME" git clone --no-tags https://github.com/jratdish1/hero-dapp.git "$STAGE"
          runuser -u "$USER_NAME" -- env HOME="/home/$USER_NAME" bash -c \
            "cd '$STAGE' && git checkout --detach '$RELEASE_SHA' && test \"\$(git rev-parse HEAD)\" = '$RELEASE_SHA' && test -z \"\$(git status --porcelain=v1 --untracked-files=all)\""

          if [ -d "$OLD_ACTIVE" ]; then
            while IFS= read -r -d '' env_file; do
              rel="${env_file#"$OLD_ACTIVE"/}"
              case "$rel" in *.example|*.sample|node_modules/*|dist/*) continue;; esac
              install -d -m 700 -o "$USER_NAME" -g "$USER_NAME" "$STAGE/$(dirname "$rel")"
              install -m 600 -o "$USER_NAME" -g "$USER_NAME" "$env_file" "$STAGE/$rel"
              printf 'COPIED_ENV_FILE=%s\n' "$rel"
            done < <(find "$OLD_ACTIVE" -maxdepth 2 -type f -name '.env*' -print0)
          fi

          node - "$BACKUP/root-pm2-before.json" "$BACKUP/runtime-env.json" <<'NODE'
          const fs=require('fs');const [src,out]=process.argv.slice(2);const list=JSON.parse(fs.readFileSync(src,'utf8')||'[]');const app=list.find(x=>x.name==='hero-dapp');const env={...(app?.pm2_env?.env||{})};const blocked=/^(PM2_|SUDO_|SSH_|OLDPWD$|PWD$|HOME$|USER$|LOGNAME$|SHELL$|SHLVL$|_$)/;for(const k of Object.keys(env))if(blocked.test(k))delete env[k];fs.writeFileSync(out,JSON.stringify(env));fs.chmodSync(out,0o600);
          NODE

          user_bin="/home/$USER_NAME/.local/bin"
          install -d -m 755 -o "$USER_NAME" -g "$USER_NAME" "$user_bin" "/home/$USER_NAME/.cache/corepack"
          system_corepack="$(command -v corepack)"
          system_node="$(command -v node)"
          system_npm="$(command -v npm)"
          system_pm2="$(command -v pm2)"
          cat > "$user_bin/corepack" <<EOF_WRAPPER
          #!/bin/sh
          set -eu
          case "\${1:-}" in
            enable)
              shift
              exec env COREPACK_HOME="\${COREPACK_HOME:-\$HOME/.cache/corepack}" "$system_corepack" enable --install-directory "\$HOME/.local/bin" "\$@"
              ;;
            *)
              exec env COREPACK_HOME="\${COREPACK_HOME:-\$HOME/.cache/corepack}" "$system_corepack" "\$@"
              ;;
          esac
          EOF_WRAPPER
          chmod 755 "$user_bin/corepack"; chown "$USER_NAME:$USER_NAME" "$user_bin/corepack"
          ln -sfn "$system_node" "$user_bin/node"; ln -sfn "$system_npm" "$user_bin/npm"; ln -sfn "$system_pm2" "$user_bin/pm2"
          chown -h "$USER_NAME:$USER_NAME" "$user_bin/node" "$user_bin/npm" "$user_bin/pm2"

          cat > /etc/ssh/sshd_config.d/99-hero-deploy-environment.conf <<EOF_SSHD
          Match User $USER_NAME
              SetEnv PATH=$user_bin:/usr/local/bin:/usr/bin:/bin
              SetEnv COREPACK_HOME=/home/$USER_NAME/.cache/corepack
              SetEnv PM2_HOME=/home/$USER_NAME/.pm2
          EOF_SSHD
          sshd -t
          systemctl reload ssh || systemctl reload sshd

          runuser -u "$USER_NAME" -- env HOME="/home/$USER_NAME" PATH="$user_bin:/usr/local/bin:/usr/bin:/bin" COREPACK_HOME="/home/$USER_NAME/.cache/corepack" \
            bash -c 'corepack enable && corepack prepare pnpm@10.34.4 --activate && test "$(pnpm --version)" = 10.34.4'
          runuser -u "$USER_NAME" -- env HOME="/home/$USER_NAME" PATH="$user_bin:/usr/local/bin:/usr/bin:/bin" COREPACK_HOME="/home/$USER_NAME/.cache/corepack" \
            bash -c "cd '$STAGE' && pnpm install --frozen-lockfile && rm -rf dist && pnpm build"

          python3 - "$BACKUP/runtime-env.json" "$STAGE/runtime.env" "$RELEASE_SHA" <<'PY'
          import json,shlex,sys
env=json.load(open(sys.argv[1]));env['PORT']='3301';env['HERO_RELEASE_SHA']=sys.argv[3]
with open(sys.argv[2],'w') as f:
    for k,v in sorted(env.items()):
        if k and k[0].isalpha() and k.replace('_','').isalnum():f.write(f'{k}={shlex.quote(str(v))}\n')
          PY
          chown "$USER_NAME:$USER_NAME" "$STAGE/runtime.env"; chmod 600 "$STAGE/runtime.env"
          runuser -u "$USER_NAME" -- env HOME="/home/$USER_NAME" PATH="$user_bin:/usr/local/bin:/usr/bin:/bin" \
            bash -c "set -a; source '$STAGE/runtime.env'; set +a; cd '$STAGE'; nohup node dist/index.js > '$STAGE/dry-run.log' 2>&1 & echo \$! > '$STAGE/dry-run.pid'"
          dry_pid="$(cat "$STAGE/dry-run.pid")"; dry_ok=false
          for attempt in $(seq 1 25); do
            response="$(curl --fail --silent --show-error --connect-timeout 3 --max-time 8 "http://127.0.0.1:3301$HEALTH" 2>/dev/null || true)"
            if grep -q '"ok":true' <<<"$response" && grep -q "\"releaseSha\":\"$RELEASE_SHA\"" <<<"$response"; then dry_ok=true; break; fi
            sleep 2
          done
          kill "$dry_pid" >/dev/null 2>&1 || true; wait "$dry_pid" 2>/dev/null || true
          test "$dry_ok" = true
          printf 'STAGING_HEALTH=PASS\n'

          if [ -e "$CANONICAL" ]; then mv "$CANONICAL" "$BACKUP/original-var-www-hero-dapp"; fi
          mv "$STAGE" "$CANONICAL"; canonical_swapped=true
          chown -R "$USER_NAME:$USER_NAME" "$CANONICAL"
          test -z "$(cd "$CANONICAL" && git status --porcelain=v1 --untracked-files=all)"

          install -d -m 700 -o "$USER_NAME" -g "$USER_NAME" "/home/$USER_NAME/.config/herobase"
          python3 - "$BACKUP/runtime-env.json" "/home/$USER_NAME/.config/herobase/ecosystem.config.cjs" "$RELEASE_SHA" "$CANONICAL" <<'PY'
          import json,sys
env=json.load(open(sys.argv[1]));env['HERO_RELEASE_SHA']=sys.argv[3];env['PORT']='3000'
config={'apps':[{'name':'hero-dapp','cwd':sys.argv[4],'script':'dist/index.js','interpreter':'node','env':env}]}
open(sys.argv[2],'w').write('module.exports = '+json.dumps(config,separators=(',',':'))+';\n')
          PY
          chown "$USER_NAME:$USER_NAME" "/home/$USER_NAME/.config/herobase/ecosystem.config.cjs"; chmod 600 "/home/$USER_NAME/.config/herobase/ecosystem.config.cjs"

          if [ "$root_was_online" = true ]; then pm2 stop hero-dapp; fi
          runuser -u "$USER_NAME" -- env HOME="/home/$USER_NAME" PM2_HOME="/home/$USER_NAME/.pm2" PATH="$user_bin:/usr/local/bin:/usr/bin:/bin" \
            pm2 start "/home/$USER_NAME/.config/herobase/ecosystem.config.cjs" --only hero-dapp
          user_process_started=true

          live_ok=false
          for attempt in $(seq 1 25); do
            response="$(curl --fail --silent --show-error --connect-timeout 3 --max-time 10 "http://127.0.0.1:3000$HEALTH" 2>/dev/null || true)"
            if grep -q '"ok":true' <<<"$response" && grep -q "\"releaseSha\":\"$RELEASE_SHA\"" <<<"$response"; then live_ok=true; break; fi
            sleep 3
          done
          test "$live_ok" = true
          runuser -u "$USER_NAME" -- env HOME="/home/$USER_NAME" PM2_HOME="/home/$USER_NAME/.pm2" PATH="$user_bin:/usr/local/bin:/usr/bin:/bin" pm2 save

          cat > /etc/systemd/system/pm2-hero-deploy.service <<EOF_UNIT
          [Unit]
          Description=PM2 process manager for HeroBase deployment user
          After=network.target
          [Service]
          Type=forking
          User=$USER_NAME
          Environment=PATH=$user_bin:/usr/local/bin:/usr/bin:/bin
          Environment=PM2_HOME=/home/$USER_NAME/.pm2
          PIDFile=/home/$USER_NAME/.pm2/pm2.pid
          Restart=on-failure
          ExecStart=$user_bin/pm2 resurrect
          ExecReload=$user_bin/pm2 reload all
          ExecStop=$user_bin/pm2 kill
          [Install]
          WantedBy=multi-user.target
          EOF_UNIT
          systemctl daemon-reload; systemctl enable pm2-hero-deploy.service; systemctl restart pm2-hero-deploy.service
          sleep 5; systemctl is-active --quiet pm2-hero-deploy.service

          verify_user_runtime() {
            runuser -u "$USER_NAME" -- env HOME="/home/$USER_NAME" PM2_HOME="/home/$USER_NAME/.pm2" PATH="$user_bin:/usr/local/bin:/usr/bin:/bin" pm2 jlist \
              | EXPECTED_SHA="$RELEASE_SHA" node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const a=JSON.parse(s).find(x=>x.name==="hero-dapp");const r=a?.pm2_env?.env?.HERO_RELEASE_SHA??a?.pm2_env?.HERO_RELEASE_SHA;if(a?.pm2_env?.status!=="online"||r!==process.env.EXPECTED_SHA)process.exit(1)})'
            response="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "https://herobase.io$HEALTH")"
            grep -q '"ok":true' <<<"$response" && grep -q "\"releaseSha\":\"$RELEASE_SHA\"" <<<"$response"
            listener_pids="$(ss -ltnp 'sport = :3000' | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u)"
            [ -n "$listener_pids" ]
            for pid in $listener_pids; do test "$(ps -o user= -p "$pid" | xargs)" = "$USER_NAME"; done
            if [ "$root_process_exists" = true ]; then
              test "$(pm2 jlist | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const a=JSON.parse(s).find(x=>x.name==="hero-dapp");process.stdout.write(a?.pm2_env?.status||"absent")})')" != online
            fi
          }
          verify_user_runtime
          printf 'MIGRATION_SOAK_SECONDS=660\n'
          for cycle in $(seq 1 22); do sleep 30; verify_user_runtime; done

          if [ "$root_process_exists" = true ]; then pm2 delete hero-dapp >/dev/null 2>&1 || true; pm2 save >/dev/null 2>&1 || true; fi
          verify_user_runtime
          test "$(stat -c '%U' "$CANONICAL")" = "$USER_NAME"
          test "$(cd "$CANONICAL" && git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(cd "$CANONICAL" && git status --porcelain=v1 --untracked-files=all)"

          canonical_swapped=false; user_process_started=false; root_process_exists=false; trap - ERR
          printf 'CANONICAL_PATH=%s\nCANONICAL_OWNER=%s\nCANONICAL_SHA=%s\nCANONICAL_DIRTY_COUNT=0\n' "$CANONICAL" "$USER_NAME" "$RELEASE_SHA"
          printf 'PM2_OWNER=%s\nPM2_RELEASE_SHA=%s\nLOCAL_HEALTH=PASS\nPUBLIC_HEALTH=PASS\n' "$USER_NAME" "$RELEASE_SHA"
          printf 'BACKUP_PATH=%s\nVETS_CANONICAL_MIGRATION_COMPLETE_V2\n' "$BACKUP"
          VPS1
          VDS
          grep -q '^VETS_CANONICAL_MIGRATION_COMPLETE_V2$' vps1-migration-v2-receipt.txt
          echo 'complete=true' >> "$GITHUB_OUTPUT"

      - name: Post durable migration v2 receipt
        if: steps.migration.outputs.complete == 'true'
        env:
          RELEASE_SHA: ${{ steps.gate.outputs.release_sha }}
          CI_RUN: ${{ steps.gate.outputs.ci_run_id }}
          SECURITY_RUN: ${{ steps.gate.outputs.security_run_id }}
          CREDENTIAL_RECEIPT: ${{ steps.gate.outputs.credential_receipt_id }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          ## VETS VPS1 canonical runtime migration v2 — COMPLETE

          - Release SHA: \`$RELEASE_SHA\`
          - Exact-main CI/Security: \`$CI_RUN\` / \`$SECURITY_RUN\`
          - Credential receipt: \`$CREDENTIAL_RECEIPT\`
          - Canonical path and owner: \`/var/www/hero-dapp\` / **hero-deploy**
          - Clean exact-SHA tree: **PASS**
          - User-owned PM2 systemd service: **PASS**
          - PM2 release identity: **PASS**
          - Local and public exact-SHA health: **PASS**
          - 660-second conflict/watchdog soak: **PASS**
          - Prior app and dirty-tree evidence preserved: **YES**
          - Rollback invoked: **NO**
          EOF
          )"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE/comments" \
            --data "$(jq -nc --arg body "$body" '{body:$body}')" >/dev/null

      - name: Upload immutable migration v2 receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: herobase-vps1-migration-v2-${{ github.event.pull_request.head.sha }}
          path: vps1-migration-v2-receipt.txt
          retention-days: 30
          if-no-files-found: error

      - name: Remove ephemeral VDS key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/vds_key" "$HOME/.ssh/vds_known_hosts"
