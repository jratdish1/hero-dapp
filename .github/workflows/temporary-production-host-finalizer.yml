name: Temporary HeroBase production host finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  finalize:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.event.pull_request.number == 59 &&
      github.event.pull_request.head.ref == 'ops/herobase-deploy-monitor-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      VDS_HOST: ${{ secrets.VDS_HOST }}
      VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
      VPS1_HOST: ${{ secrets.VPS1_HOST }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      PATCH_BRANCH: fix/dao-ownership-production-20260726
      TRACKER_ISSUE: '43'
      EXPECTED_VDS_ED25519: SHA256:EdmFXzo/0Tw9jlbH+tNfBGcRGDf1TQu8m0LWiobRXFY

    steps:
      - name: Wait for DAO correction merge and exact-main first-attempt gates
        id: release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence

          api_get() {
            local url="$1" response=""
            for attempt in $(seq 1 5); do
              if response="$(curl --fail-with-body --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$url")"; then
                printf '%s' "$response"
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          repo_api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          owner="${GITHUB_REPOSITORY%%/*}"
          target_sha=""
          ci_run_id=""
          security_run_id=""

          first_attempt_push_run() {
            local workflow_file="$1" required_job="$2" sha="$3"
            local workflow_id runs run_id jobs
            workflow_id="$(api_get "$repo_api/actions/workflows/$workflow_file" | jq -r '.id')"
            [[ "$workflow_id" =~ ^[0-9]+$ ]] || return 1
            runs="$(api_get "$repo_api/actions/workflows/$workflow_id/runs?branch=main&event=push&head_sha=$sha&per_page=100")"
            run_id="$(jq -r --arg sha "$sha" '
              [.workflow_runs[] | select(
                .head_sha == $sha and
                .head_branch == "main" and
                .event == "push" and
                .run_attempt == 1 and
                .status == "completed" and
                .conclusion == "success"
              )] | sort_by(.id) | last.id // empty
            ' <<<"$runs")"
            [[ "$run_id" =~ ^[0-9]+$ ]] || return 1
            jobs="$(api_get "$repo_api/actions/runs/$run_id/jobs?per_page=100")"
            jq -e --arg name "$required_job" '
              [.jobs[] | select(.name == $name)]
              | length > 0 and (max_by(.id) | .status == "completed" and .conclusion == "success")
            ' <<<"$jobs" >/dev/null || return 1
            printf '%s' "$run_id"
          }

          for attempt in $(seq 1 120); do
            pulls="$(api_get "$repo_api/pulls?state=all&head=$owner:$PATCH_BRANCH&base=main&per_page=100")"
            merged="$(jq -r 'if length == 1 then .[0].merged_at != null else false end' <<<"$pulls")"
            if [ "$merged" = "true" ]; then
              main_ref="$(api_get "$repo_api/git/ref/heads/main")"
              candidate="$(jq -r '.object.sha' <<<"$main_ref")"
              [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || exit 1
              routers="$(api_get "$repo_api/contents/server/routers.ts?ref=$candidate" | jq -r '.content' | tr -d '\n' | base64 -d)"
              if grep -Fq 'proposal.proposerId !== ctx.user.id' <<<"$routers" &&
                 grep -Fq 'delegate.userId !== ctx.user.id' <<<"$routers"; then
                ci_run_id="$(first_attempt_push_run ci.yml test-build-scan "$candidate" || true)"
                security_run_id="$(first_attempt_push_run security-and-quality.yml repository-safety "$candidate" || true)"
                if [[ "$ci_run_id" =~ ^[0-9]+$ ]] && [[ "$security_run_id" =~ ^[0-9]+$ ]]; then
                  target_sha="$candidate"
                  break
                fi
              fi
            fi
            sleep 20
          done

          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ci_run_id" =~ ^[0-9]+$ ]]
          [[ "$security_run_id" =~ ^[0-9]+$ ]]
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"
          echo "security_run_id=$security_run_id" >> "$GITHUB_OUTPUT"
          jq -n --arg target_sha "$target_sha" --arg ci_run_id "$ci_run_id" --arg security_run_id "$security_run_id" \
            '{target_sha:$target_sha,ci_run_id:$ci_run_id,security_run_id:$security_run_id,gate:"PASS"}' \
            > evidence/exact-main-gate.json

      - name: Validate encrypted route inputs and VDS-M host identity
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "$VDS_HOST" ] || missing+=(VDS_HOST)
          [ -n "$VDS_SSH_KEY" ] || missing+=(VDS_SSH_KEY)
          [ -n "$VPS1_HOST" ] || missing+=(VPS1_HOST)
          [ -n "$CF_ZONE_ID" ] || missing+=(CF_ZONE_ID)
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing encrypted route input: %s\n' "${missing[@]}" >&2
            exit 78
          fi
          [[ "$VDS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS1_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$CF_ZONE_ID" =~ ^[0-9a-fA-F]{32}$ ]]

          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VDS_SSH_KEY" > "$HOME/.ssh/vds_key"
          timeout --signal=TERM --kill-after=5s 15s ssh-keygen -y -f "$HOME/.ssh/vds_key" >/dev/null
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3; do
            ssh-keyscan -T 10 -t ed25519 -H "$VDS_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
            [ -s "$HOME/.ssh/known_hosts" ] && break
            sleep $((attempt * 2))
          done
          [ -s "$HOME/.ssh/known_hosts" ]
          actual_fingerprint="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" | awk 'NR==1 {print $2}')"
          test "$actual_fingerprint" = "$EXPECTED_VDS_ED25519"
          chmod 600 "$HOME/.ssh/vds_key" "$HOME/.ssh/known_hosts"
          printf 'VDS_HOST_IDENTITY=PASS:%s\n' "$actual_fingerprint" | tee evidence/vds-host-identity.txt

      - name: Prepare canonical VPS1 runtime, recover purge token, and set protected secrets
        id: host_prep
        env:
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
          AUTH_CI_RUN_ID: ${{ steps.release.outputs.ci_run_id }}
          AUTH_SECURITY_RUN_ID: ${{ steps.release.outputs.security_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          remote_log="$RUNNER_TEMP/host-prep.log"
          ssh \
            -i "$HOME/.ssh/vds_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "root@$VDS_HOST" \
            bash -s -- "$TARGET_SHA" "$VPS1_HOST" "$CF_ZONE_ID" "$GITHUB_REPOSITORY" "$AUTH_CI_RUN_ID" "$AUTH_SECURITY_RUN_ID" <<'VDS' 2>&1 | tee "$remote_log"
          set -Eeuo pipefail
          TARGET_SHA="$1"
          VPS1_HOST="$2"
          CF_ZONE_ID="$3"
          REPO="$4"
          AUTH_CI_RUN_ID="$5"
          AUTH_SECURITY_RUN_ID="$6"
          DEPLOY_USER='hero-deploy'
          TRACKER_ISSUE='43'
          WORK="$(mktemp -d /root/vets-herobase-finalize.XXXXXX)"
          trap 'rm -rf "$WORK"; unset CF_API_TOKEN' EXIT
          chmod 700 "$WORK"

          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VPS1_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$CF_ZONE_ID" =~ ^[0-9a-fA-F]{32}$ ]]
          [[ "$AUTH_CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$AUTH_SECURITY_RUN_ID" =~ ^[0-9]+$ ]]
          command -v gh >/dev/null
          command -v jq >/dev/null
          command -v ssh >/dev/null
          test "$(gh api user --jq .login)" = "jratdish1"
          gh repo view "$REPO" >/dev/null

          printf 'VETS_VDSM_ROUTE=PASS\n'
          printf 'VETS_VDSM_GITHUB_AUTH=PASS\n'

          # Recover a bearer token without printing candidate values.
          mkdir -m 700 "$WORK/candidates"
          python3 - "$WORK/candidates" <<'PY'
          from pathlib import Path
          import os, re, sys

          out = Path(sys.argv[1])
          files = [
              Path('/opt/apex-agent/.cf_token_cache'),
              Path('/opt/apex-agent/.cf_token'),
              Path('/root/.env_architecture'),
              Path('/opt/apex-agent/.env'),
              Path('/opt/apex-agent/config/.env'),
              Path('/root/.cloudflare_creds'),
          ]
          names = {
              'CF_API_TOKEN', 'CLOUDFLARE_API_TOKEN', 'CF_TOKEN',
              'CLOUDFLARE_TOKEN', 'CF_CACHE_TOKEN', 'CLOUDFLARE_CACHE_TOKEN',
          }
          candidates = []
          for path in files:
              try:
                  if not path.is_file() or path.is_symlink() and not path.exists():
                      continue
                  text = path.read_text(errors='ignore')
              except Exception:
                  continue
              stripped = text.strip()
              if path.name in {'.cf_token_cache', '.cf_token'} and stripped and '\n' not in stripped and ' ' not in stripped:
                  candidates.append(stripped)
              for line in text.splitlines():
                  line = line.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  key, value = line.split('=', 1)
                  key = key.strip().removeprefix('export ').strip()
                  if key not in names:
                      continue
                  value = value.strip().strip('"').strip("'")
                  if value:
                      candidates.append(value)
          seen = set()
          index = 0
          for candidate in candidates:
              if candidate in seen:
                  continue
              seen.add(candidate)
              index += 1
              target = out / f'candidate-{index:02d}'
              target.write_text(candidate)
              os.chmod(target, 0o600)
          (out / 'count').write_text(str(index))
          os.chmod(out / 'count', 0o600)
          PY

          selected_token_file=''
          candidate_count="$(cat "$WORK/candidates/count")"
          printf 'VETS_CF_CANDIDATES_FOUND=%s\n' "$candidate_count"
          for candidate_file in "$WORK"/candidates/candidate-*; do
            [ -f "$candidate_file" ] || continue
            token="$(cat "$candidate_file")"
            if verify="$(curl -4 --fail-with-body --silent --show-error \
                  --connect-timeout 10 --max-time 30 \
                  -H "Authorization: Bearer $token" \
                  -H 'Content-Type: application/json' \
                  https://api.cloudflare.com/client/v4/user/tokens/verify 2>/dev/null)" &&
               jq -e '.success == true and .result.status == "active" and ((.errors // []) | length == 0)' <<<"$verify" >/dev/null &&
               zone="$(curl -4 --fail-with-body --silent --show-error \
                  --connect-timeout 10 --max-time 30 \
                  -H "Authorization: Bearer $token" \
                  -H 'Content-Type: application/json' \
                  "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID" 2>/dev/null)" &&
               jq -e '.success == true and .result.name == "herobase.io" and .result.status == "active" and ((.errors // []) | length == 0)' <<<"$zone" >/dev/null; then
              selected_token_file="$candidate_file"
              unset token verify zone
              break
            fi
            unset token verify zone
          done
          [ -n "$selected_token_file" ] || {
            echo 'BLOCKED: no active scoped Cloudflare bearer token with herobase.io zone-read access was found' >&2
            exit 78
          }
          CF_API_TOKEN="$(cat "$selected_token_file")"
          export CF_API_TOKEN
          printf 'VETS_CF_TOKEN_VERIFY=PASS\n'
          printf 'VETS_CF_ZONE=PASS:herobase.io:active\n'

          # Create/reuse a dedicated deploy key on VDS-M.
          DEPLOY_KEY='/root/.ssh/hero-dapp-deploy-ed25519'
          install -m 700 -d /root/.ssh
          if [ ! -s "$DEPLOY_KEY" ]; then
            ssh-keygen -q -t ed25519 -N '' -C 'hero-dapp-production-deploy' -f "$DEPLOY_KEY"
          fi
          chmod 600 "$DEPLOY_KEY"
          chmod 644 "$DEPLOY_KEY.pub"
          ssh-keygen -y -f "$DEPLOY_KEY" >/dev/null
          deploy_pub_b64="$(base64 -w0 < "$DEPLOY_KEY.pub")"

          # Build known_hosts from the VPS1 key reached through the already-trusted VDS alias.
          vps1_key="$(ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes vps1 \
            'cat /etc/ssh/ssh_host_ed25519_key.pub')"
          [[ "$vps1_key" =~ ^ssh-ed25519[[:space:]][A-Za-z0-9+/=]+ ]]
          printf '%s %s\n' "$VPS1_HOST" "$(awk '{print $1" "$2}' <<<"$vps1_key")" > "$WORK/vps1_known_hosts"
          chmod 600 "$WORK/vps1_known_hosts"

          # Prepare/migrate the live host. The remote script is internally rollback-capable.
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes vps1 \
            bash -s -- "$TARGET_SHA" "$deploy_pub_b64" <<'VPS1'
          set -Eeuo pipefail
          TARGET_SHA="$1"
          DEPLOY_PUB="$(printf '%s' "$2" | base64 -d)"
          DEPLOY_USER='hero-deploy'
          APP_DIR='/var/www/hero-dapp'
          LEGACY_DIR='/root/hero-dapp'
          HEALTH_LOCAL='http://127.0.0.1:3000/api/trpc/system.health?input=%7B%22json%22%3A%7B%22timestamp%22%3A0%7D%7D'
          HEALTH_PUBLIC='https://herobase.io/api/trpc/system.health?input=%7B%22json%22%3A%7B%22timestamp%22%3A0%7D%7D'
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="/var/backups/vets-herobase/$STAMP"
          STAGE="/var/www/.hero-dapp-stage-$TARGET_SHA"
          FAILED="/var/www/.hero-dapp-failed-$STAMP"
          ROOT_PM2_HAD_APP=false
          NEW_PM2_STARTED=false
          CANONICAL_SWAPPED=false
          OLD_CANONICAL=''

          rollback() {
            status="$?"
            trap - ERR
            printf 'VETS_HOST_PREP_ROLLBACK_ATTEMPTED=true\n'
            if [ "$NEW_PM2_STARTED" = true ]; then
              runuser -u "$DEPLOY_USER" -- env HOME="/home/$DEPLOY_USER" pm2 delete hero-dapp >/dev/null 2>&1 || true
              runuser -u "$DEPLOY_USER" -- env HOME="/home/$DEPLOY_USER" pm2 save >/dev/null 2>&1 || true
            fi
            if [ "$ROOT_PM2_HAD_APP" = true ]; then
              pm2 restart hero-dapp --update-env >/dev/null 2>&1 || true
              pm2 save >/dev/null 2>&1 || true
            fi
            if [ "$CANONICAL_SWAPPED" = true ] && [ -n "$OLD_CANONICAL" ] && [ -d "$OLD_CANONICAL" ]; then
              [ -d "$APP_DIR" ] && mv "$APP_DIR" "$FAILED" || true
              mv "$OLD_CANONICAL" "$APP_DIR" || true
            fi
            printf 'VETS_HOST_PREP_ROLLBACK_COMPLETED=true\n'
            exit "$status"
          }
          trap rollback ERR

          for command_name in git node corepack pm2 curl flock jq runuser tar systemctl; do
            command -v "$command_name" >/dev/null
          done
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$BACKUP"
          chmod 700 "$BACKUP"
          df -h /var/www > "$BACKUP/df-before.txt"
          pm2 jlist > "$BACKUP/root-pm2-jlist.json"
          pm2 save >/dev/null 2>&1 || true
          [ -f /root/.pm2/dump.pm2 ] && cp -a /root/.pm2/dump.pm2 "$BACKUP/root-pm2-dump.pm2"
          nginx -T > "$BACKUP/nginx-T.txt" 2>&1
          curl --silent --show-error --connect-timeout 5 --max-time 15 "$HEALTH_LOCAL" > "$BACKUP/health-local-before.json" 2>/dev/null || true
          curl --silent --show-error --connect-timeout 5 --max-time 15 "$HEALTH_PUBLIC" > "$BACKUP/health-public-before.json" 2>/dev/null || true

          if [ -d "$APP_DIR/.git" ]; then
            git -C "$APP_DIR" rev-parse HEAD > "$BACKUP/var-www-head.txt" || true
            git -C "$APP_DIR" status --porcelain=v1 --untracked-files=all > "$BACKUP/var-www-status.txt" || true
            git -C "$APP_DIR" diff --binary > "$BACKUP/var-www-working.diff" || true
            git -C "$APP_DIR" diff --cached --binary > "$BACKUP/var-www-index.diff" || true
            git -C "$APP_DIR" ls-files --others --exclude-standard -z > "$BACKUP/var-www-untracked.zlist" || true
            if [ -s "$BACKUP/var-www-untracked.zlist" ]; then
              tar --null -T "$BACKUP/var-www-untracked.zlist" -C "$APP_DIR" -czf "$BACKUP/var-www-untracked.tgz" || true
            fi
          fi
          if [ -d "$LEGACY_DIR/.git" ]; then
            git -C "$LEGACY_DIR" rev-parse HEAD > "$BACKUP/legacy-head.txt" || true
            git -C "$LEGACY_DIR" status --porcelain=v1 --untracked-files=all > "$BACKUP/legacy-status.txt" || true
          fi

          if ! id "$DEPLOY_USER" >/dev/null 2>&1; then
            useradd --create-home --home-dir "/home/$DEPLOY_USER" --shell /bin/bash "$DEPLOY_USER"
          fi
          test "$(id -u "$DEPLOY_USER")" -ge 1000
          install -d -m 700 -o "$DEPLOY_USER" -g "$DEPLOY_USER" "/home/$DEPLOY_USER/.ssh"
          touch "/home/$DEPLOY_USER/.ssh/authorized_keys"
          chown "$DEPLOY_USER:$DEPLOY_USER" "/home/$DEPLOY_USER/.ssh/authorized_keys"
          chmod 600 "/home/$DEPLOY_USER/.ssh/authorized_keys"
          auth_line="restrict $DEPLOY_PUB"
          grep -Fxq "$auth_line" "/home/$DEPLOY_USER/.ssh/authorized_keys" || printf '%s\n' "$auth_line" >> "/home/$DEPLOY_USER/.ssh/authorized_keys"

          # Preserve the effective application environment without exposing it.
          install -d -m 700 -o "$DEPLOY_USER" -g "$DEPLOY_USER" "/home/$DEPLOY_USER/.config/hero-dapp"
          node - "$BACKUP/root-pm2-jlist.json" "/home/$DEPLOY_USER/.config/hero-dapp/runtime-env.json" <<'NODE'
          const fs = require('fs');
          const list = JSON.parse(fs.readFileSync(process.argv[2], 'utf8') || '[]');
          const app = list.find(item => item.name === 'hero-dapp');
          if (!app) process.exit(42);
          const source = app?.pm2_env?.env || {};
          const blocked = /^(PM2_|pm_|NODE_APP_INSTANCE$|PWD$|OLDPWD$|HOME$|USER$|LOGNAME$|SHELL$|SHLVL$|_$|PATH$|SSH_|XDG_)/;
          const env = {};
          for (const [key, value] of Object.entries(source)) {
            if (!blocked.test(key) && typeof value === 'string') env[key] = value;
          }
          fs.writeFileSync(process.argv[3], JSON.stringify(env, null, 2) + '\n', {mode: 0o600});
          NODE
          chown "$DEPLOY_USER:$DEPLOY_USER" "/home/$DEPLOY_USER/.config/hero-dapp/runtime-env.json"
          chmod 600 "/home/$DEPLOY_USER/.config/hero-dapp/runtime-env.json"

          rm -rf "$STAGE"
          install -d -m 755 -o "$DEPLOY_USER" -g "$DEPLOY_USER" /var/www
          runuser -u "$DEPLOY_USER" -- env HOME="/home/$DEPLOY_USER" git clone --no-tags https://github.com/jratdish1/hero-dapp.git "$STAGE"
          runuser -u "$DEPLOY_USER" -- env HOME="/home/$DEPLOY_USER" git -C "$STAGE" checkout -B main "$TARGET_SHA"
          test "$(git -C "$STAGE" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$STAGE" remote get-url origin)" = 'https://github.com/jratdish1/hero-dapp.git'
          test -z "$(git -C "$STAGE" status --porcelain=v1 --untracked-files=all)"

          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          test "$(pnpm --version)" = '10.34.4'
          if ! runuser -u "$DEPLOY_USER" -- env HOME="/home/$DEPLOY_USER" bash -c 'corepack enable && corepack prepare pnpm@10.34.4 --activate && test "$(pnpm --version)" = 10.34.4'; then
            real_corepack="$(readlink -f "$(command -v corepack)")"
            test "$real_corepack" != '/usr/local/bin/corepack'
            cat > /usr/local/bin/corepack <<EOF_COREPACK
          #!/bin/sh
          if [ "\${1:-}" = enable ] && command -v pnpm >/dev/null 2>&1 && [ "\$(pnpm --version 2>/dev/null)" = 10.34.4 ]; then
            exit 0
          fi
          exec "$real_corepack" "\$@"
          EOF_COREPACK
            chmod 755 /usr/local/bin/corepack
            runuser -u "$DEPLOY_USER" -- env HOME="/home/$DEPLOY_USER" bash -c 'corepack enable && corepack prepare pnpm@10.34.4 --activate && test "$(pnpm --version)" = 10.34.4'
            printf 'VETS_COREPACK_COMPAT_SHIM=INSTALLED\n'
          else
            printf 'VETS_COREPACK_COMPAT_SHIM=NOT_REQUIRED\n'
          fi

          runuser -u "$DEPLOY_USER" -- env HOME="/home/$DEPLOY_USER" bash -c "cd '$STAGE' && corepack enable && corepack prepare pnpm@10.34.4 --activate && pnpm install --frozen-lockfile && rm -rf dist && pnpm build"
          test -f "$STAGE/dist/index.js"

          OLD_CANONICAL=''
          if [ -e "$APP_DIR" ]; then
            OLD_CANONICAL="$BACKUP/var-www-hero-dapp"
            mv "$APP_DIR" "$OLD_CANONICAL"
          fi
          mv "$STAGE" "$APP_DIR"
          CANONICAL_SWAPPED=true
          chown -R "$DEPLOY_USER:$DEPLOY_USER" "$APP_DIR"
          test "$(stat -c '%U' "$APP_DIR")" = "$DEPLOY_USER"
          test -z "$(git -C "$APP_DIR" status --porcelain=v1 --untracked-files=all)"

          cat > "/home/$DEPLOY_USER/.config/hero-dapp/ecosystem.config.cjs" <<EOF_ECOSYSTEM
          const fs = require('fs');
          const env = JSON.parse(fs.readFileSync('/home/$DEPLOY_USER/.config/hero-dapp/runtime-env.json', 'utf8'));
          module.exports = { apps: [{
            name: 'hero-dapp',
            cwd: '$APP_DIR',
            script: '$APP_DIR/dist/index.js',
            interpreter: 'node',
            env: { ...env, NODE_ENV: 'production', HERO_RELEASE_SHA: '$TARGET_SHA' }
          }] };
          EOF_ECOSYSTEM
          chown "$DEPLOY_USER:$DEPLOY_USER" "/home/$DEPLOY_USER/.config/hero-dapp/ecosystem.config.cjs"
          chmod 600 "/home/$DEPLOY_USER/.config/hero-dapp/ecosystem.config.cjs"

          if pm2 describe hero-dapp >/dev/null 2>&1; then
            ROOT_PM2_HAD_APP=true
            pm2 stop hero-dapp
          fi
          runuser -u "$DEPLOY_USER" -- env HOME="/home/$DEPLOY_USER" HERO_RELEASE_SHA="$TARGET_SHA" pm2 start "/home/$DEPLOY_USER/.config/hero-dapp/ecosystem.config.cjs" --only hero-dapp --update-env
          NEW_PM2_STARTED=true
          runuser -u "$DEPLOY_USER" -- env HOME="/home/$DEPLOY_USER" pm2 save

          verify_health() {
            local url="$1" response=""
            for attempt in $(seq 1 20); do
              response="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "$url" || true)"
              if grep -q '"ok":true' <<<"$response" && grep -q "\"releaseSha\":\"$TARGET_SHA\"" <<<"$response"; then
                return 0
              fi
              sleep 3
            done
            return 1
          }
          verify_health "$HEALTH_LOCAL"
          verify_health "$HEALTH_PUBLIC"

          runuser -u "$DEPLOY_USER" -- env HOME="/home/$DEPLOY_USER" pm2 jlist | EXPECTED_SHA="$TARGET_SHA" node -e '
            let s=""; process.stdin.on("data",c=>s+=c); process.stdin.on("end",()=>{
              const a=JSON.parse(s).find(x=>x.name==="hero-dapp");
              const sha=a?.pm2_env?.env?.HERO_RELEASE_SHA ?? a?.pm2_env?.HERO_RELEASE_SHA;
              if(a?.pm2_env?.status!=="online" || sha!==process.env.EXPECTED_SHA || a?.pm2_env?.pm_cwd!=="/var/www/hero-dapp") process.exit(1);
            });'

          if [ "$ROOT_PM2_HAD_APP" = true ]; then
            pm2 delete hero-dapp
            pm2 save
          fi
          env PATH="$PATH" pm2 startup systemd -u "$DEPLOY_USER" --hp "/home/$DEPLOY_USER" >/dev/null 2>&1 || true
          systemctl enable "pm2-$DEPLOY_USER" >/dev/null 2>&1 || true
          runuser -u "$DEPLOY_USER" -- env HOME="/home/$DEPLOY_USER" pm2 save

          MUTATION_RECEIPT="$BACKUP/host-prep-receipt.txt"
          {
            printf 'target_sha=%s\n' "$TARGET_SHA"
            printf 'deploy_user=%s\n' "$DEPLOY_USER"
            printf 'canonical_path=%s\n' "$APP_DIR"
            printf 'legacy_path_preserved=%s\n' "$LEGACY_DIR"
            printf 'backup_path=%s\n' "$BACKUP"
            printf 'local_health=PASS\n'
            printf 'public_health=PASS\n'
            printf 'pm2_identity=PASS\n'
            printf 'rollback_attempted=false\n'
          } > "$MUTATION_RECEIPT"
          chmod 600 "$MUTATION_RECEIPT"
          CANONICAL_SWAPPED=false
          NEW_PM2_STARTED=false
          ROOT_PM2_HAD_APP=false
          trap - ERR
          printf 'VETS_HOST_PREPARED=true\n'
          printf 'VETS_HOST_BACKUP=%s\n' "$BACKUP"
          printf 'VETS_HOST_FINAL_SHA=%s\n' "$TARGET_SHA"
          VPS1

          # Verify the newly provisioned direct non-root path.
          ssh -i "$DEPLOY_KEY" -o BatchMode=yes -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$WORK/vps1_known_hosts" \
            "$DEPLOY_USER@$VPS1_HOST" \
            bash -s -- "$TARGET_SHA" <<'VERIFY'
          set -euo pipefail
          TARGET_SHA="$1"
          test "$(id -un)" = 'hero-deploy'
          test "$(stat -c '%U' /var/www/hero-dapp)" = 'hero-deploy'
          test "$(git -C /var/www/hero-dapp rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git -C /var/www/hero-dapp status --porcelain=v1 --untracked-files=all)"
          pm2 jlist | EXPECTED_SHA="$TARGET_SHA" node -e '
            let s=""; process.stdin.on("data",c=>s+=c); process.stdin.on("end",()=>{
              const a=JSON.parse(s).find(x=>x.name==="hero-dapp");
              const sha=a?.pm2_env?.env?.HERO_RELEASE_SHA ?? a?.pm2_env?.HERO_RELEASE_SHA;
              if(a?.pm2_env?.status!=="online" || sha!==process.env.EXPECTED_SHA) process.exit(1);
            });'
          VERIFY
          printf 'VETS_DIRECT_NONROOT_SSH=PASS\n'

          # Publish protected environment secrets without printing values.
          printf '%s' "$VPS1_HOST" | gh secret set VPS1_HOST --env production --repo "$REPO"
          printf '%s' "$DEPLOY_USER" | gh secret set VPS1_USER --env production --repo "$REPO"
          gh secret set VPS1_SSH_KEY --env production --repo "$REPO" < "$DEPLOY_KEY"
          gh secret set VPS1_KNOWN_HOSTS --env production --repo "$REPO" < "$WORK/vps1_known_hosts"
          printf '%s' "$CF_API_TOKEN" | gh secret set CF_API_TOKEN --env production --repo "$REPO"
          printf '%s' "$CF_ZONE_ID" | gh secret set CF_ZONE_ID --env production --repo "$REPO"

          required=(CF_API_TOKEN CF_ZONE_ID VPS1_HOST VPS1_KNOWN_HOSTS VPS1_SSH_KEY VPS1_USER)
          inventory="$(gh secret list --env production --repo "$REPO" --json name --jq 'map(.name)')"
          for name in "${required[@]}"; do
            jq -e --arg name "$name" 'index($name) != null' <<<"$inventory" >/dev/null
          done
          printf 'VETS_PRODUCTION_SECRET_INVENTORY=PASS\n'

          prep_body="$(cat <<EOF_PREP
          ## VETS host preparation receipt

          - Target SHA: \`$TARGET_SHA\`
          - Exact-main CI run: \`$AUTH_CI_RUN_ID\`
          - Exact-main Security run: \`$AUTH_SECURITY_RUN_ID\`
          - VDS-M route and owner GitHub authentication: **PASS**
          - Cloudflare bearer token and active herobase.io zone read: **PASS**
          - Restricted deployment user: **$DEPLOY_USER**
          - Canonical app path: \`/var/www/hero-dapp\`
          - Legacy path preserved for rollback: \`/root/hero-dapp\`
          - Canonical Git/PM2/local health/public health exact-SHA identity: **PASS**
          - Six protected production secret names: **PRESENT**
          - Result: **HOST PREPARED / READY FOR PROTECTED DEPLOYMENT**
          EOF_PREP
          )"
          gh api "repos/$REPO/issues/$TRACKER_ISSUE/comments" -f body="$prep_body" >/dev/null

          # Post a unique owner command only after every host and secret gate passes.
          exact_command="VETS DEPLOY $TARGET_SHA"
          comments="$(gh api --paginate "repos/$REPO/issues/$TRACKER_ISSUE/comments?per_page=100" --slurp | jq 'add')"
          existing="$(jq -r --arg body "$exact_command" '[.[] | select(.user.login == "jratdish1" and .body == $body)] | length' <<<"$comments")"
          if [ "$existing" = '0' ]; then
            command_comment="$(gh api "repos/$REPO/issues/$TRACKER_ISSUE/comments" -f body="$exact_command")"
          elif [ "$existing" = '1' ]; then
            command_comment="$(jq -c --arg body "$exact_command" '[.[] | select(.user.login == "jratdish1" and .body == $body)] | .[0]' <<<"$comments")"
          else
            echo 'BLOCKED: duplicate exact owner deployment commands found' >&2
            exit 74
          fi
          command_comment_id="$(jq -r '.id' <<<"$command_comment")"
          [[ "$command_comment_id" =~ ^[0-9]+$ ]]
          printf 'VETS_OWNER_COMMAND_COMMENT_ID=%s\n' "$command_comment_id"
          printf 'VETS_OWNER_COMMAND_POSTED=true\n'
          VDS
          ssh_status="${PIPESTATUS[0]}"
          exit "$ssh_status"

      - name: Parse host-preparation and command receipt
        id: receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/host-prep.log"
          test -f "$log"
          grep -q '^VETS_HOST_PREPARED=true$' "$log"
          grep -q '^VETS_DIRECT_NONROOT_SSH=PASS$' "$log"
          grep -q '^VETS_PRODUCTION_SECRET_INVENTORY=PASS$' "$log"
          grep -q '^VETS_OWNER_COMMAND_POSTED=true$' "$log"
          final_sha="$(sed -n 's/^VETS_HOST_FINAL_SHA=//p' "$log" | tail -n 1)"
          backup_path="$(sed -n 's/^VETS_HOST_BACKUP=//p' "$log" | tail -n 1)"
          command_comment_id="$(sed -n 's/^VETS_OWNER_COMMAND_COMMENT_ID=//p' "$log" | tail -n 1)"
          [[ "$final_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$command_comment_id" =~ ^[0-9]+$ ]]
          jq -n \
            --arg target_sha "$final_sha" \
            --arg backup_path "$backup_path" \
            --arg command_comment_id "$command_comment_id" \
            --arg ci_run_id "${{ steps.release.outputs.ci_run_id }}" \
            --arg security_run_id "${{ steps.release.outputs.security_run_id }}" \
            '{target_sha:$target_sha,backup_path:$backup_path,command_comment_id:$command_comment_id,ci_run_id:$ci_run_id,security_run_id:$security_run_id,host_prepared:true,secrets_present:true,owner_command_posted:true}' \
            > evidence/host-finalizer.json
          cat evidence/host-finalizer.json

      - name: Upload immutable host-finalizer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: herobase-host-finalizer-${{ github.event.pull_request.head.sha }}
          path: evidence
          retention-days: 30
          if-no-files-found: error

      - name: Remove ephemeral route key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/vds_key" "$HOME/.ssh/known_hosts"
