name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Activate repository-pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          test "$(pnpm --version)" = "10.34.4"
          test ! -e package-lock.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        shell: bash
        run: |
          set +e
          pnpm check > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          exit "$status"

      - name: Upload type-check diagnostics
        if: failure() && hashFiles('typecheck.log') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typecheck-diagnostics-${{ github.sha }}
          path: typecheck.log
          retention-days: 7
          if-no-files-found: error

      - name: Test
        env:
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
        shell: bash
        run: |
          set +e
          pnpm test > test.log 2>&1
          status=$?
          cat test.log
          exit "$status"

      - name: Upload test diagnostics
        if: failure() && hashFiles('test.log') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-diagnostics-${{ github.sha }}
          path: test.log
          retention-days: 7
          if-no-files-found: error

      - name: Build
        run: pnpm build

      - name: Verify public landing critical path
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-landing-bundle.mjs 2>&1 | tee landing-bundle-report.txt

      - name: Upload exact-head landing evidence
        if: always() && hashFiles('landing-bundle-report.txt') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: landing-evidence-${{ github.sha }}
          path: |
            landing-bundle-report.txt
            dist/public/.vite/manifest.json
          retention-days: 14
          if-no-files-found: error

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Verify security-sensitive dependency resolutions
        shell: bash
        run: |
          set -euo pipefail
          node -e "const v=require('./node_modules/axios/package.json').version;if(v!=='1.18.0'){throw new Error('axios resolved to '+v)}"
          grep -q "wouter@3.7.1" pnpm-lock.yaml
          grep -q "axios@1.18.0" pnpm-lock.yaml

      - name: Token registry scanner
        run: node scripts/check-token-registry.mjs
