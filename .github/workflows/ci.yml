name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build-scan:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Activate repository-pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          test "$(pnpm --version)" = "10.34.4"
          test ! -e package-lock.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        shell: bash
        run: |
          set +e
          pnpm check > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          exit "$status"

      - name: Upload type-check diagnostics
        if: failure() && hashFiles('typecheck.log') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typecheck-diagnostics-${{ github.sha }}
          path: typecheck.log
          retention-days: 7
          if-no-files-found: error

      - name: Test
        env:
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify production CSP contract
        run: node scripts/check-csp-contract.mjs

      - name: Complete Hardhat v2 suite
        run: pnpm exec hardhat test test/v2/*.test.mjs --config hardhat.v2test.config.mjs

      - name: Locate headless Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome_bin"
          test -x "$chrome_bin"
          echo "chrome_bin=$chrome_bin" >> "$GITHUB_OUTPUT"
          "$chrome_bin" --version

      - name: Exercise mounted bootstrap and route chunk recovery
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome_bin }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 180s \
            node scripts/check-bootstrap-recovery.mjs \
            > bootstrap-recovery.log 2>&1
          status=$?
          cat bootstrap-recovery.log
          exit "$status"

      - name: Exercise mounted generic render-error focus
        if: always()
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome_bin }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 90s \
            node scripts/check-generic-error-focus.mjs \
            > generic-error-focus.log 2>&1
          status=$?
          cat generic-error-focus.log
          exit "$status"

      - name: Exercise production CSP route matrix
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome_bin }}
        run: node scripts/check-csp-routes.mjs

      - name: Exercise Radix dialog scroll lock under production CSP
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome_bin }}
        run: node scripts/check-scroll-lock-csp.mjs

      - name: Verify public landing critical path
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-landing-bundle.mjs 2>&1 | tee landing-bundle-report.txt

      - name: Upload exact-head landing and recovery evidence
        if: always() && hashFiles('landing-bundle-report.txt', 'bootstrap-recovery.log', 'bootstrap-recovery-report.json', 'generic-error-focus.log', 'generic-error-focus-report.json', 'csp-contract-report.json', 'csp-browser-report.json', 'scroll-lock-csp-report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: landing-evidence-${{ github.sha }}
          path: |
            landing-bundle-report.txt
            bootstrap-recovery.log
            bootstrap-recovery-report.json
            generic-error-focus.log
            generic-error-focus-report.json
            csp-contract-report.json
            csp-browser-report.json
            scroll-lock-csp-report.json
            dist/public/.vite/manifest.json
            dist/public/assets/DappBootstrap-*.js
          retention-days: 14
          if-no-files-found: error

      - name: Production dependency advisory gate
        id: production_audit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-production-advisories.mjs \
            2>&1 | tee production-advisory-report.log

      - name: Upload exact-head production advisory evidence
        if: always() && hashFiles('production-advisory-report.log', 'production-advisory-report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-advisory-evidence-${{ github.sha }}
          path: |
            production-advisory-report.log
            production-advisory-report.json
          retention-days: 14
          if-no-files-found: error

      - name: Verify security-sensitive dependency resolutions
        shell: bash
        run: |
          set -euo pipefail
          node -e "const v=require('./node_modules/axios/package.json').version;if(v!=='1.18.1'){throw new Error('axios resolved to '+v)}"
          grep -q "wouter@3.7.1" pnpm-lock.yaml
          grep -q "axios@1.18.1" pnpm-lock.yaml

      - name: Token registry scanner
        run: node scripts/check-token-registry.mjs
