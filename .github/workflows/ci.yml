name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  remediate-m2:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'jratdish1' &&
      github.event.pull_request.number == 71
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact owner branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: cert/m2-dao-snapshot-clean-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and push source-only DAO remediation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '5527ef71345b6c97bc153e8531142e4288e8771c'

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow_path = '.github/workflows/vets-one-shot-m2-dao.yml'
          original = subprocess.check_output(
              ['git', 'show', f'HEAD^^^^^:{workflow_path}'],
              text=True,
          )
          step_names = [
              'Apply bounded snapshot and feature-fence remediation',
              'Validate candidate source',
          ]
          for index, name in enumerate(step_names, start=1):
              marker = f'      - name: {name}\n'
              marker_at = original.find(marker)
              if marker_at < 0:
                  raise SystemExit(f'FAIL-CLOSED: original step not found: {name}')
              run_marker = '        run: |\n'
              run_at = original.find(run_marker, marker_at)
              if run_at < 0:
                  raise SystemExit(f'FAIL-CLOSED: original run block not found: {name}')
              start = run_at + len(run_marker)
              end = original.find('\n      - name:', start)
              if end < 0:
                  end = len(original)
              raw_lines = original[start:end].splitlines()
              block_lines = []
              for line in raw_lines:
                  if line and not line.startswith('          '):
                      raise SystemExit(f'FAIL-CLOSED: unexpected indentation in {name}: {line!r}')
                  block_lines.append(line[10:] if line else '')
              target = Path(f'/tmp/vets-m2-step-{index}.sh')
              target.write_text(
                  '#!/usr/bin/env bash\n' + '\n'.join(block_lines).rstrip() + '\n',
                  encoding='utf-8',
              )
              target.chmod(0o700)
          PY

          /tmp/vets-m2-step-1.sh
          /tmp/vets-m2-step-2.sh

          git config user.name 'VETS Remediation Controller'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            drizzle/schema.ts \
            drizzle/migrations/dao_snapshot_v2.sql \
            drizzle/migrations/dao_snapshot_v2.rollback.sql \
            server/db.ts \
            server/routers.ts \
            server/dao-snapshot-policy.ts \
            server/dao-snapshot-policy.test.ts
          git diff --cached --check
          git commit -m 'fix(dao): add fail-closed chain-bound historical snapshots'
          git push origin HEAD:cert/m2-dao-snapshot-clean-20260730

  test-build-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Activate repository-pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          test "$(pnpm --version)" = "10.34.4"
          test ! -e package-lock.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        shell: bash
        run: |
          set +e
          pnpm check > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          exit "$status"

      - name: Upload type-check diagnostics
        if: failure() && hashFiles('typecheck.log') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typecheck-diagnostics-${{ github.sha }}
          path: typecheck.log
          retention-days: 7
          if-no-files-found: error

      - name: Test
        env:
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Locate headless Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome_bin"
          test -x "$chrome_bin"
          echo "chrome_bin=$chrome_bin" >> "$GITHUB_OUTPUT"
          "$chrome_bin" --version

      - name: Exercise mounted bootstrap and route chunk recovery
        id: recovery
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome_bin }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 180s \
            node scripts/check-bootstrap-recovery.mjs \
            > bootstrap-recovery.log 2>&1
          status=$?
          cat bootstrap-recovery.log
          printf 'exit_status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Exercise mounted generic render-error focus
        id: generic_focus
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome_bin }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 90s \
            node scripts/check-generic-error-focus.mjs \
            > generic-error-focus.log 2>&1
          status=$?
          cat generic-error-focus.log
          printf 'exit_status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Verify public landing critical path
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-landing-bundle.mjs 2>&1 | tee landing-bundle-report.txt

      - name: Upload exact-head landing and recovery evidence
        if: always() && hashFiles('landing-bundle-report.txt', 'bootstrap-recovery.log', 'bootstrap-recovery-report.json', 'generic-error-focus.log', 'generic-error-focus-report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: landing-evidence-${{ github.sha }}
          path: |
            landing-bundle-report.txt
            bootstrap-recovery.log
            bootstrap-recovery-report.json
            generic-error-focus.log
            generic-error-focus-report.json
            dist/public/.vite/manifest.json
          retention-days: 14
          if-no-files-found: error

      - name: Enforce mounted recovery gates
        if: always()
        shell: bash
        run: |
          test "${{ steps.recovery.outcome }}" = "success"
          test "${{ steps.recovery.outputs.exit_status }}" = "0"
          test "${{ steps.generic_focus.outcome }}" = "success"
          test "${{ steps.generic_focus.outputs.exit_status }}" = "0"

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Verify security-sensitive dependency resolutions
        shell: bash
        run: |
          set -euo pipefail
          node -e "const v=require('./node_modules/axios/package.json').version;if(v!=='1.18.0'){throw new Error('axios resolved to '+v)}"
          grep -q "wouter@3.7.1" pnpm-lock.yaml
          grep -q "axios@1.18.0" pnpm-lock.yaml

      - name: Token registry scanner
        run: node scripts/check-token-registry.mjs
