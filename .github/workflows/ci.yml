name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - fix/security-high-vulns-2026-07-16
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Activate repository-pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          test "$(pnpm --version)" = "10.34.4"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        env:
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Token registry scanner
        run: node scripts/check-token-registry.mjs

  finalize-pr40:
    name: One-shot PR 40 finalization
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/fix/security-high-vulns-2026-07-16' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: Checkout authorized branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/security-high-vulns-2026-07-16
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Activate repository-pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          test "$(pnpm --version)" = "10.34.4"

      - name: Remove prohibited hidden Unicode from tracked text files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          forbidden = (
              "\u200b",
              "\u200c",
              "\u200d",
              "\u2060",
              "\ufeff",
              "\u202a",
              "\u202b",
              "\u202c",
              "\u202d",
              "\u202e",
          )

          for raw_path in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0"):
              if not raw_path:
                  continue
              path = Path(raw_path.decode("utf-8", "surrogateescape"))
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              cleaned = text
              for character in forbidden:
                  cleaned = cleaned.replace(character, "")
              if cleaned != text:
                  print(f"sanitized: {path}")
                  path.write_text(cleaned, encoding="utf-8")
          PY

      - name: Regenerate canonical pnpm lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts
          test ! -e package-lock.json

      - name: Validate frozen dependency graph and application
        shell: bash
        env:
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          pnpm audit --prod --audit-level=high
          node scripts/check-token-registry.mjs
          git diff --check
          node -e "const v=require('./node_modules/axios/package.json').version;if(v!=='1.18.0'){throw new Error('axios resolved to '+v)}"
          grep -q "wouter@3.7.1" pnpm-lock.yaml
          grep -q "axios@1.18.0" pnpm-lock.yaml

      - name: Commit bounded remediation artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --short)"
          git config user.name "vets-finalization-bot"
          git config user.email "vets-finalization-bot@users.noreply.github.com"
          git add -u
          git commit -m "fix(security): finalize pnpm graph and remove hidden Unicode"
          git push origin HEAD:fix/security-high-vulns-2026-07-16
