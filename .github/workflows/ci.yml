name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-m2:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'jratdish1' &&
      github.event.pull_request.number == 71
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact owner branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: cert/m2-dao-snapshot-clean-20260730
          fetch-depth: 0
          persist-credentials: false

      - name: Diagnose exact replacement counts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '4fb740d4824c60c3da801916cfca66321f1d486b'
          python3 - <<'PY'
          import subprocess

          workflow_path = '.github/workflows/vets-one-shot-m2-dao.yml'
          original = subprocess.check_output(
              ['git', 'show', '0e8dd251e93106a9e4e6e319291ec4e6de082959:' + workflow_path],
              text=True,
          )
          marker = '      - name: Apply bounded snapshot and feature-fence remediation\n'
          marker_at = original.find(marker)
          run_marker = '        run: |\n'
          run_at = original.find(run_marker, marker_at)
          start = run_at + len(run_marker)
          end = original.find('\n      - name:', start)
          raw_lines = original[start:end].splitlines()
          block_lines = [line[10:] if line else '' for line in raw_lines]
          script = '\n'.join(block_lines).rstrip() + '\n'
          needle = "raise SystemExit(f'FAIL-CLOSED: {path_name} expected block count={count}')"
          replacement = "raise SystemExit(f'FAIL-CLOSED: {path_name} old={old[:160]!r} expected block count={count}')"
          if needle not in script:
              raise SystemExit('FAIL-CLOSED: diagnostic needle missing')
          script = script.replace(needle, replacement, 1)
          open('/tmp/diagnose-m2.sh', 'w', encoding='utf-8').write('#!/usr/bin/env bash\n' + script)
          PY
          chmod 700 /tmp/diagnose-m2.sh
          /tmp/diagnose-m2.sh
