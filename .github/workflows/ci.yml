name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Activate repository-pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          test "$(pnpm --version)" = "10.34.4"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        env:
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Token registry scanner
        run: node scripts/check-token-registry.mjs

  validate-pr40-remediation:
    name: Validate PR 40 remediation read-only
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 40 &&
      github.head_ref == 'fix/security-high-vulns-2026-07-16'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Activate repository-pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          test "$(pnpm --version)" = "10.34.4"

      - name: Generate bounded remediation in read-only workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          forbidden = (
              "\u200b", "\u200c", "\u200d", "\u2060", "\ufeff",
              "\u202a", "\u202b", "\u202c", "\u202d", "\u202e",
          )
          sanitized = []
          entries = subprocess.check_output(["git", "ls-files", "-z", "--stage"]).split(b"\0")
          for entry in entries:
              if not entry:
                  continue
              metadata, raw_path = entry.split(b"\t", 1)
              mode = metadata.split(b" ", 1)[0]
              if mode not in {b"100644", b"100755"}:
                  continue
              path = Path(raw_path.decode("utf-8", "surrogateescape"))
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              cleaned = text
              for character in forbidden:
                  cleaned = cleaned.replace(character, "")
              if cleaned != text:
                  sanitized.append(str(path))
                  path.write_text(cleaned, encoding="utf-8")
          Path("/tmp/pr40-sanitized-files.txt").write_text("\n".join(sanitized), encoding="utf-8")
          PY
          pnpm install --lockfile-only --ignore-scripts
          test ! -e package-lock.json

      - name: Frozen dependency installation
        run: pnpm install --frozen-lockfile

      - name: Test suite
        env:
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Token registry scanner
        run: node scripts/check-token-registry.mjs

      - name: Verify canonical graph and bounded generated diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node -e "const v=require('./node_modules/axios/package.json').version;if(v!=='1.18.0'){throw new Error('axios resolved to '+v)}"
          grep -q "wouter@3.7.1" pnpm-lock.yaml
          grep -q "axios@1.18.0" pnpm-lock.yaml
          test -n "$(git status --short)"
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          allowed = {"pnpm-lock.yaml"}
          allowed.update(Path("/tmp/pr40-sanitized-files.txt").read_text(encoding="utf-8").splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f"Unexpected generated files: {sorted(unexpected)}")
          PY

  commit-pr40-remediation:
    name: Commit validated PR 40 remediation
    needs: validate-pr40-remediation
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 40 &&
      github.head_ref == 'fix/security-high-vulns-2026-07-16' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout authorized branch at exact event head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/security-high-vulns-2026-07-16
          fetch-depth: 1

      - name: Reject branch movement
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Activate repository-pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          test "$(pnpm --version)" = "10.34.4"

      - name: Reproduce validated deterministic artifacts without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          forbidden = (
              "\u200b", "\u200c", "\u200d", "\u2060", "\ufeff",
              "\u202a", "\u202b", "\u202c", "\u202d", "\u202e",
          )
          entries = subprocess.check_output(["git", "ls-files", "-z", "--stage"]).split(b"\0")
          for entry in entries:
              if not entry:
                  continue
              metadata, raw_path = entry.split(b"\t", 1)
              mode = metadata.split(b" ", 1)[0]
              if mode not in {b"100644", b"100755"}:
                  continue
              path = Path(raw_path.decode("utf-8", "surrogateescape"))
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              cleaned = text
              for character in forbidden:
                  cleaned = cleaned.replace(character, "")
              if cleaned != text:
                  path.write_text(cleaned, encoding="utf-8")
          PY
          pnpm install --lockfile-only --ignore-scripts
          test ! -e package-lock.json
          git diff --check
          grep -q "wouter@3.7.1" pnpm-lock.yaml
          grep -q "axios@1.18.0" pnpm-lock.yaml

      - name: Commit bounded remediation artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --short)"
          git config user.name "vets-finalization-bot"
          git config user.email "vets-finalization-bot@users.noreply.github.com"
          git add -u
          git commit -m "fix(security): finalize pnpm graph and remove hidden Unicode"
          git push origin HEAD:fix/security-high-vulns-2026-07-16
