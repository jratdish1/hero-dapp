name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate-m2-hardening:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'jratdish1' &&
      github.event.pull_request.number == 71
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact owner branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: cert/m2-dao-snapshot-clean-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and push bounded DAO hardening
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'cea00b89668d360476d90478d5dbcfba474c2613'
          node scripts/vets-dao-hardening.cjs
          git diff --check
          git config user.name 'VETS Remediation Controller'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drizzle/schema.ts server/routers.ts
          git rm scripts/vets-dao-hardening.cjs
          git commit -m 'fix(dao): close binding snapshot trust gates'
          git push origin HEAD:cert/m2-dao-snapshot-clean-20260730
