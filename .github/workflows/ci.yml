name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate-m2:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'jratdish1' &&
      github.event.pull_request.number == 71
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact owner branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: cert/m2-dao-snapshot-clean-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and push context-bound DAO remediation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '66028454a1cafa8e42faaf1ba42fdbdb103a666a'

          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/routers.ts')
          text = path.read_text(encoding='utf-8')
          old = '''          txHash: txHashSchema,
                    confirmBinding: z.boolean().optional(),
                  }))
                  .mutation(async ({ ctx, input }) => {
                    // AUDIT FIX 1.4: Verify delegator address belongs to authenticated user
          '''
          new = old.replace('confirmBinding:', '__vetsDelegationConfirmBinding:')
          if text.count(old) != 1:
              raise SystemExit('FAIL-CLOSED: delegation confirmBinding context changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow_path = '.github/workflows/vets-one-shot-m2-dao.yml'
          original = subprocess.check_output(
              ['git', 'show', '0e8dd251e93106a9e4e6e319291ec4e6de082959:' + workflow_path],
              text=True,
          )
          step_names = [
              'Apply bounded snapshot and feature-fence remediation',
              'Validate candidate source',
          ]
          for index, name in enumerate(step_names, start=1):
              marker = f'      - name: {name}\n'
              marker_at = original.find(marker)
              if marker_at < 0:
                  raise SystemExit(f'FAIL-CLOSED: original step not found: {name}')
              run_marker = '        run: |\n'
              run_at = original.find(run_marker, marker_at)
              if run_at < 0:
                  raise SystemExit(f'FAIL-CLOSED: original run block not found: {name}')
              start = run_at + len(run_marker)
              end = original.find('\n      - name:', start)
              if end < 0:
                  end = len(original)
              raw_lines = original[start:end].splitlines()
              block_lines = []
              for line in raw_lines:
                  if line and not line.startswith('          '):
                      raise SystemExit(f'FAIL-CLOSED: unexpected indentation in {name}: {line!r}')
                  block_lines.append(line[10:] if line else '')
              target = Path(f'/tmp/vets-m2-step-{index}.sh')
              target.write_text(
                  '#!/usr/bin/env bash\n' + '\n'.join(block_lines).rstrip() + '\n',
                  encoding='utf-8',
              )
              target.chmod(0o700)
          PY

          /tmp/vets-m2-step-1.sh

          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/routers.ts')
          text = path.read_text(encoding='utf-8')
          if text.count('__vetsDelegationConfirmBinding:') != 1:
              raise SystemExit('FAIL-CLOSED: delegation marker was not preserved exactly once')
          path.write_text(
              text.replace('__vetsDelegationConfirmBinding:', 'confirmBinding:', 1),
              encoding='utf-8',
          )
          PY

          /tmp/vets-m2-step-2.sh

          git config user.name 'VETS Remediation Controller'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            drizzle/schema.ts \
            drizzle/migrations/dao_snapshot_v2.sql \
            drizzle/migrations/dao_snapshot_v2.rollback.sql \
            server/db.ts \
            server/routers.ts \
            server/dao-snapshot-policy.ts \
            server/dao-snapshot-policy.test.ts
          git diff --cached --check
          git commit -m 'fix(dao): add fail-closed chain-bound historical snapshots'
          git push origin HEAD:cert/m2-dao-snapshot-clean-20260730
