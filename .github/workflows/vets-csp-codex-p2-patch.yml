name: One-shot Codex P2 CSP corrections

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: vets-csp-codex-p2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'closeout/csp-rebuild-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: closeout/csp-rebuild-20260802
          fetch-depth: 0

      - name: Apply bounded P2 corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/vets-csp-codex-p2-patch.py
          python3 -m py_compile scripts/vets-csp-codex-p2-patch.py
          node --check scripts/check-csp-contract.mjs
          node --check scripts/check-csp-routes.mjs
          node --check scripts/check-scroll-lock-csp.mjs
          git diff --check

      - name: Commit exact correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VETS GitHub automation'
          git config user.email 'jratdish1@users.noreply.github.com'
          git add client/src/lib/csp-safe-markdown.ts server/csp-safe-markdown.test.ts scripts/check-csp-contract.mjs scripts/check-csp-routes.mjs scripts/check-scroll-lock-csp.mjs
          git diff --cached --quiet && {
            echo 'Expected P2 correction produced no change' >&2
            exit 1
          }
          git commit -m 'fix(csp): close Codex fail-closed coverage gaps'
          git pull --rebase origin closeout/csp-rebuild-20260802
          git push origin HEAD:closeout/csp-rebuild-20260802
