name: Temporary VPS1 canonical HeroBase migration

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  migrate:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.event.pull_request.number == 59 &&
      github.event.pull_request.head.ref == 'ops/herobase-deploy-monitor-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: temporary-vps1-canonical-herobase-migration
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VDS_HOST: ${{ secrets.VDS_HOST }}
      VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
      TRACKER_ISSUE: '43'

    steps:
      - name: Require current main gates and completed credential preparation
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          api_get() {
            local url="$1" response=""
            for attempt in $(seq 1 5); do
              if response="$(curl --fail-with-body --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "$url")"; then
                printf '%s' "$response"
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }
          deadline=$((SECONDS + 2400))
          while [ "$SECONDS" -lt "$deadline" ]; do
            main_sha="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -r '.object.sha')"
            [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
            ci_id="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml" | jq -r '.id')"
            sec_id="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/security-and-quality.yml" | jq -r '.id')"
            ci_run="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$ci_id/runs?branch=main&event=push&head_sha=$main_sha&per_page=100" \
              | jq -c --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .run_attempt == 1)] | sort_by(.id) | last // empty')"
            sec_run="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$sec_id/runs?branch=main&event=push&head_sha=$main_sha&per_page=100" \
              | jq -c --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .run_attempt == 1)] | sort_by(.id) | last // empty')"
            comments="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE/comments?per_page=100")"
            credential_receipt="$(jq -c --arg sha "$main_sha" '[.[] | select(
              .user.login == "github-actions[bot]" and
              (.body | startswith("## VETS production credential preparation — COMPLETE")) and
              (.body | contains("Release SHA: `" + $sha + "`")) and
              (.body | contains("Required production environment secret names: **6/6 present**"))
            )] | sort_by(.id) | last // empty' <<<"$comments")"
            if [ -n "$ci_run" ] && [ -n "$sec_run" ] && [ -n "$credential_receipt" ] && \
               [ "$(jq -r '.status' <<<"$ci_run")" = completed ] && \
               [ "$(jq -r '.conclusion' <<<"$ci_run")" = success ] && \
               [ "$(jq -r '.status' <<<"$sec_run")" = completed ] && \
               [ "$(jq -r '.conclusion' <<<"$sec_run")" = success ]; then
              echo "release_sha=$main_sha" >> "$GITHUB_OUTPUT"
              echo "ci_run_id=$(jq -r '.id' <<<"$ci_run")" >> "$GITHUB_OUTPUT"
              echo "security_run_id=$(jq -r '.id' <<<"$sec_run")" >> "$GITHUB_OUTPUT"
              echo "credential_receipt_id=$(jq -r '.id' <<<"$credential_receipt")" >> "$GITHUB_OUTPUT"
              printf 'MIGRATION_GATE=PASS sha=%s\n' "$main_sha"
              exit 0
            fi
            sleep 20
          done
          echo 'Timed out waiting for current-main gates and credential-preparation receipt' >&2
          exit 75

      - name: Pin VDS-M identity and install ephemeral key
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$VDS_HOST" ] && [ -n "$VDS_SSH_KEY" ]
          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VDS_SSH_KEY" > "$HOME/.ssh/vds_key"
          ssh-keygen -y -f "$HOME/.ssh/vds_key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$VDS_HOST" > "$HOME/.ssh/vds_known_hosts" 2>/dev/null
          [ -s "$HOME/.ssh/vds_known_hosts" ]
          fingerprint="$(ssh-keygen -lf "$HOME/.ssh/vds_known_hosts" | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:EdmFXzo/0Tw9jlbH+tNfBGcRGDf1TQu8m0LWiobRXFY'
          chmod 600 "$HOME/.ssh/vds_key" "$HOME/.ssh/vds_known_hosts"

      - name: Build, migrate, and verify canonical non-root runtime
        id: migration
        env:
          RELEASE_SHA: ${{ steps.gate.outputs.release_sha }}
          AUTH_CI_RUN_ID: ${{ steps.gate.outputs.ci_run_id }}
          AUTH_SECURITY_RUN_ID: ${{ steps.gate.outputs.security_run_id }}
          CREDENTIAL_RECEIPT_ID: ${{ steps.gate.outputs.credential_receipt_id }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/vps1-migration-receipt.txt"
          ssh \
            -i "$HOME/.ssh/vds_key" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/vds_known_hosts" \
            "root@$VDS_HOST" \
            bash -s -- "$RELEASE_SHA" "$AUTH_CI_RUN_ID" "$AUTH_SECURITY_RUN_ID" "$CREDENTIAL_RECEIPT_ID" <<'VDS' \
            | tee "$receipt"
          set -Eeuo pipefail
          RELEASE_SHA="$1"
          AUTH_CI_RUN_ID="$2"
          AUTH_SECURITY_RUN_ID="$3"
          CREDENTIAL_RECEIPT_ID="$4"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            vps1 bash -s -- "$RELEASE_SHA" "$AUTH_CI_RUN_ID" "$AUTH_SECURITY_RUN_ID" "$CREDENTIAL_RECEIPT_ID" <<'VPS1'
          set -Eeuo pipefail
          RELEASE_SHA="$1"
          AUTH_CI_RUN_ID="$2"
          AUTH_SECURITY_RUN_ID="$3"
          CREDENTIAL_RECEIPT_ID="$4"
          DEPLOY_USER='hero-deploy'
          CANONICAL='/var/www/hero-dapp'
          ACTIVE_OLD='/root/hero-dapp'
          HEALTH_PATH='/api/trpc/system.health?input=%7B%22json%22%3A%7B%22timestamp%22%3A0%7D%7D'
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup_root="/var/backups/vets-herobase/$timestamp"
          stage="/var/www/.hero-dapp-stage-${RELEASE_SHA:0:12}"
          migration_log="$backup_root/migration.log"
          mkdir -p "$backup_root"
          chmod 700 "$backup_root"
          exec > >(tee -a "$migration_log") 2>&1

          rollback_required=false
          old_root_was_online=false
          new_started=false
          canonical_swapped=false

          rollback() {
            status=$?
            trap - ERR
            printf 'VETS_MIGRATION_ROLLBACK_ATTEMPTED=true\n'
            if [ "$new_started" = true ]; then
              runuser -u "$DEPLOY_USER" -- env HOME="/home/$DEPLOY_USER" PM2_HOME="/home/$DEPLOY_USER/.pm2" \
                pm2 delete hero-dapp >/dev/null 2>&1 || true
            fi
            if [ "$canonical_swapped" = true ] && [ -d "$backup_root/original-var-www-hero-dapp" ]; then
              rm -rf "$CANONICAL.failed.$timestamp" 2>/dev/null || true
              if [ -e "$CANONICAL" ]; then mv "$CANONICAL" "$CANONICAL.failed.$timestamp" || true; fi
              mv "$backup_root/original-var-www-hero-dapp" "$CANONICAL" || true
            fi
            if [ "$old_root_was_online" = true ] && command -v pm2 >/dev/null 2>&1; then
              pm2 restart hero-dapp --update-env >/dev/null 2>&1 || pm2 resurrect >/dev/null 2>&1 || true
            fi
            printf 'VETS_MIGRATION_ROLLBACK_COMPLETED=true\n'
            exit "$status"
          }
          trap rollback ERR

          id "$DEPLOY_USER" >/dev/null
          test "$(id -u "$DEPLOY_USER")" -ge 1000
          for command_name in git node npm corepack pm2 curl flock tar rsync runuser jq; do
            command -v "$command_name" >/dev/null
          done

          printf 'RELEASE_SHA=%s\n' "$RELEASE_SHA"
          printf 'AUTHORIZED_CI_RUN=%s\n' "$AUTH_CI_RUN_ID"
          printf 'AUTHORIZED_SECURITY_RUN=%s\n' "$AUTH_SECURITY_RUN_ID"
          printf 'CREDENTIAL_RECEIPT_ID=%s\n' "$CREDENTIAL_RECEIPT_ID"

          pm2 jlist > "$backup_root/root-pm2-before.json"
          chmod 600 "$backup_root/root-pm2-before.json"
          root_status="$(node - "$backup_root/root-pm2-before.json" <<'NODE'
          const fs=require('fs');
          const list=JSON.parse(fs.readFileSync(process.argv[2],'utf8')||'[]');
          const app=list.find(x=>x.name==='hero-dapp');
          process.stdout.write(app?.pm2_env?.status || 'absent');
          NODE
          )"
          root_cwd="$(node - "$backup_root/root-pm2-before.json" <<'NODE'
          const fs=require('fs');
          const list=JSON.parse(fs.readFileSync(process.argv[2],'utf8')||'[]');
          const app=list.find(x=>x.name==='hero-dapp');
          process.stdout.write(app?.pm2_env?.pm_cwd || 'unknown');
          NODE
          )"
          printf 'ROOT_PM2_STATUS=%s\n' "$root_status"
          printf 'ROOT_PM2_CWD=%s\n' "$root_cwd"
          if [ "$root_status" = online ]; then old_root_was_online=true; fi

          for path in "$ACTIVE_OLD" "$CANONICAL"; do
            key="$(printf '%s' "$path" | tr '/' '_')"
            if [ -d "$path/.git" ]; then
              (
                cd "$path"
                git rev-parse HEAD > "$backup_root/${key}.head"
                git status --porcelain=v1 --untracked-files=all > "$backup_root/${key}.status"
                git diff --binary > "$backup_root/${key}.worktree.patch" || true
                git diff --cached --binary > "$backup_root/${key}.index.patch" || true
              )
            fi
          done

          rm -rf "$stage"
          install -d -m 755 -o "$DEPLOY_USER" -g "$DEPLOY_USER" "$stage"
          runuser -u "$DEPLOY_USER" -- env HOME="/home/$DEPLOY_USER" \
            git clone --no-tags https://github.com/jratdish1/hero-dapp.git "$stage"
          runuser -u "$DEPLOY_USER" -- env HOME="/home/$DEPLOY_USER" bash -lc \
            "cd '$stage' && git checkout --detach '$RELEASE_SHA' && test \"\$(git rev-parse HEAD)\" = '$RELEASE_SHA' && test -z \"\$(git status --porcelain=v1 --untracked-files=all)\""

          # Preserve existing runtime env files without logging their contents.
          if [ -d "$ACTIVE_OLD" ]; then
            while IFS= read -r -d '' env_file; do
              rel="${env_file#"$ACTIVE_OLD"/}"
              case "$rel" in
                *.example|*.sample|node_modules/*|dist/*) continue ;;
              esac
              install -d -m 700 -o "$DEPLOY_USER" -g "$DEPLOY_USER" "$stage/$(dirname "$rel")"
              install -m 600 -o "$DEPLOY_USER" -g "$DEPLOY_USER" "$env_file" "$stage/$rel"
              printf 'COPIED_ENV_FILE=%s\n' "$rel"
            done < <(find "$ACTIVE_OLD" -maxdepth 2 -type f -name '.env*' -print0)
          fi

          # Capture the existing process environment to a root-only artifact and create a filtered user runtime file.
          node - "$backup_root/root-pm2-before.json" "$backup_root/hero-runtime-env.json" <<'NODE'
          const fs=require('fs');
          const [source,out]=process.argv.slice(2);
          const list=JSON.parse(fs.readFileSync(source,'utf8')||'[]');
          const app=list.find(x=>x.name==='hero-dapp');
          if(!app) throw new Error('root hero-dapp PM2 process not found');
          const env={...(app.pm2_env?.env||{})};
          const blocked=/^(PM2_|SUDO_|SSH_|OLDPWD$|PWD$|HOME$|USER$|LOGNAME$|SHELL$|SHLVL$|_$)/;
          for(const key of Object.keys(env)) if(blocked.test(key)) delete env[key];
          fs.writeFileSync(out, JSON.stringify(env));
          fs.chmodSync(out,0o600);
          NODE

          # Provide a user-owned Node/Corepack toolchain so the audited non-root deploy workflow can run corepack enable.
          node_bin="$(readlink -f "$(command -v node)")"
          node_root="$(dirname "$(dirname "$node_bin")")"
          if [ -x "$node_root/bin/node" ] && [ -x "$node_root/bin/corepack" ]; then
            install -d -m 755 -o "$DEPLOY_USER" -g "$DEPLOY_USER" "/home/$DEPLOY_USER/.local/node"
            rsync -a --delete "$node_root/" "/home/$DEPLOY_USER/.local/node/"
            chown -R "$DEPLOY_USER:$DEPLOY_USER" "/home/$DEPLOY_USER/.local/node"
            user_node_bin="/home/$DEPLOY_USER/.local/node/bin"
          else
            user_node_bin="$(dirname "$(command -v node)")"
          fi
          printf 'USER_NODE_BIN=%s\n' "$user_node_bin"

          runuser -u "$DEPLOY_USER" -- env \
            HOME="/home/$DEPLOY_USER" \
            PATH="$user_node_bin:/usr/local/bin:/usr/bin:/bin" \
            bash -lc "corepack enable && corepack prepare pnpm@10.34.4 --activate && test \"\$(pnpm --version)\" = 10.34.4"

          runuser -u "$DEPLOY_USER" -- env \
            HOME="/home/$DEPLOY_USER" \
            PATH="$user_node_bin:/usr/local/bin:/usr/bin:/bin" \
            bash -lc "cd '$stage' && pnpm install --frozen-lockfile && rm -rf dist && pnpm build"

          # Dry-run the built server on a separate port with filtered existing environment.
          python3 - "$backup_root/hero-runtime-env.json" "$stage/runtime.env" "$RELEASE_SHA" <<'PY'
          import json, shlex, sys
          source,out,sha=sys.argv[1:]
          env=json.load(open(source))
          env['PORT']='3301'
          env['HERO_RELEASE_SHA']=sha
          with open(out,'w') as handle:
              for key,value in sorted(env.items()):
                  if not key.replace('_','').isalnum() or not key[0].isalpha():
                      continue
                  handle.write(f'{key}={shlex.quote(str(value))}\n')
          PY
          chown "$DEPLOY_USER:$DEPLOY_USER" "$stage/runtime.env"
          chmod 600 "$stage/runtime.env"
          runuser -u "$DEPLOY_USER" -- env \
            HOME="/home/$DEPLOY_USER" \
            PATH="$user_node_bin:/usr/local/bin:/usr/bin:/bin" \
            bash -lc "set -a; source '$stage/runtime.env'; set +a; cd '$stage'; nohup node dist/index.js > '$stage/dry-run.log' 2>&1 & echo \$! > '$stage/dry-run.pid'"
          dry_pid="$(cat "$stage/dry-run.pid")"
          dry_ok=false
          for attempt in $(seq 1 20); do
            response="$(curl --fail --silent --show-error --connect-timeout 3 --max-time 8 \
              "http://127.0.0.1:3301$HEALTH_PATH" 2>/dev/null || true)"
            if printf '%s' "$response" | grep -q '"ok":true' && \
               printf '%s' "$response" | grep -q "\"releaseSha\":\"$RELEASE_SHA\""; then
              dry_ok=true
              break
            fi
            sleep 2
          done
          kill "$dry_pid" >/dev/null 2>&1 || true
          wait "$dry_pid" 2>/dev/null || true
          test "$dry_ok" = true
          printf 'STAGING_HEALTH=PASS\n'

          if [ -e "$CANONICAL" ]; then
            mv "$CANONICAL" "$backup_root/original-var-www-hero-dapp"
          fi
          mv "$stage" "$CANONICAL"
          canonical_swapped=true
          chown -R "$DEPLOY_USER:$DEPLOY_USER" "$CANONICAL"
          test -z "$(cd "$CANONICAL" && git status --porcelain=v1 --untracked-files=all)"

          install -d -m 700 -o "$DEPLOY_USER" -g "$DEPLOY_USER" "/home/$DEPLOY_USER/.config/herobase"
          python3 - "$backup_root/hero-runtime-env.json" "/home/$DEPLOY_USER/.config/herobase/ecosystem.config.cjs" "$RELEASE_SHA" "$CANONICAL" <<'PY'
          import json, sys
          env_path,out,sha,cwd=sys.argv[1:]
          env=json.load(open(env_path))
          env['HERO_RELEASE_SHA']=sha
          env.pop('PORT',None)
          config={'apps':[{'name':'hero-dapp','cwd':cwd,'script':'dist/index.js','interpreter':'node','env':env}]}
          with open(out,'w') as handle:
              handle.write('module.exports = ' + json.dumps(config,separators=(',',':')) + ';\n')
          PY
          chown "$DEPLOY_USER:$DEPLOY_USER" "/home/$DEPLOY_USER/.config/herobase/ecosystem.config.cjs"
          chmod 600 "/home/$DEPLOY_USER/.config/herobase/ecosystem.config.cjs"

          if [ "$old_root_was_online" = true ]; then pm2 stop hero-dapp; fi
          runuser -u "$DEPLOY_USER" -- env \
            HOME="/home/$DEPLOY_USER" \
            PM2_HOME="/home/$DEPLOY_USER/.pm2" \
            PATH="$user_node_bin:/usr/local/bin:/usr/bin:/bin" \
            pm2 start "/home/$DEPLOY_USER/.config/herobase/ecosystem.config.cjs" --only hero-dapp
          new_started=true

          live_ok=false
          for attempt in $(seq 1 20); do
            response="$(curl --fail --silent --show-error --connect-timeout 3 --max-time 10 \
              "http://127.0.0.1:3000$HEALTH_PATH" 2>/dev/null || true)"
            if printf '%s' "$response" | grep -q '"ok":true' && \
               printf '%s' "$response" | grep -q "\"releaseSha\":\"$RELEASE_SHA\""; then
              live_ok=true
              break
            fi
            sleep 3
          done
          test "$live_ok" = true

          runuser -u "$DEPLOY_USER" -- env HOME="/home/$DEPLOY_USER" PM2_HOME="/home/$DEPLOY_USER/.pm2" \
            PATH="$user_node_bin:/usr/local/bin:/usr/bin:/bin" pm2 save
          pm2 delete hero-dapp >/dev/null 2>&1 || true
          pm2 save >/dev/null 2>&1 || true

          # Install a dedicated systemd unit for the user-owned PM2 daemon.
          cat > /etc/systemd/system/pm2-hero-deploy.service <<EOF_UNIT
          [Unit]
          Description=PM2 process manager for HeroBase deployment user
          After=network.target

          [Service]
          Type=forking
          User=$DEPLOY_USER
          LimitNOFILE=infinity
          LimitNPROC=infinity
          LimitCORE=infinity
          Environment=PATH=$user_node_bin:/usr/local/bin:/usr/bin:/bin
          Environment=PM2_HOME=/home/$DEPLOY_USER/.pm2
          PIDFile=/home/$DEPLOY_USER/.pm2/pm2.pid
          Restart=on-failure
          ExecStart=$user_node_bin/pm2 resurrect
          ExecReload=$user_node_bin/pm2 reload all
          ExecStop=$user_node_bin/pm2 kill

          [Install]
          WantedBy=multi-user.target
          EOF_UNIT
          systemctl daemon-reload
          systemctl enable pm2-hero-deploy.service
          systemctl restart pm2-hero-deploy.service
          sleep 3
          systemctl is-active --quiet pm2-hero-deploy.service

          runuser -u "$DEPLOY_USER" -- env HOME="/home/$DEPLOY_USER" PM2_HOME="/home/$DEPLOY_USER/.pm2" \
            PATH="$user_node_bin:/usr/local/bin:/usr/bin:/bin" pm2 jlist \
            | EXPECTED_SHA="$RELEASE_SHA" node -e '
              let input="";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data",c=>input+=c);
              process.stdin.on("end",()=>{
                const list=JSON.parse(input);
                const app=list.find(x=>x.name==="hero-dapp");
                const actual=app?.pm2_env?.env?.HERO_RELEASE_SHA ?? app?.pm2_env?.HERO_RELEASE_SHA;
                if(app?.pm2_env?.status!=="online" || actual!==process.env.EXPECTED_SHA) process.exit(1);
              });'
          test "$(stat -c '%U' "$CANONICAL")" = "$DEPLOY_USER"
          test "$(cd "$CANONICAL" && git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(cd "$CANONICAL" && git status --porcelain=v1 --untracked-files=all)"

          response="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            "https://herobase.io$HEALTH_PATH")"
          printf '%s' "$response" | grep -q '"ok":true'
          printf '%s' "$response" | grep -q "\"releaseSha\":\"$RELEASE_SHA\""

          canonical_swapped=false
          new_started=false
          trap - ERR
          printf 'CANONICAL_PATH=%s\n' "$CANONICAL"
          printf 'CANONICAL_OWNER=%s\n' "$(stat -c '%U' "$CANONICAL")"
          printf 'CANONICAL_SHA=%s\n' "$(cd "$CANONICAL" && git rev-parse HEAD)"
          printf 'CANONICAL_DIRTY_COUNT=%s\n' "$(cd "$CANONICAL" && git status --porcelain=v1 --untracked-files=all | wc -l)"
          printf 'PM2_OWNER=%s\n' "$DEPLOY_USER"
          printf 'PM2_RELEASE_SHA=%s\n' "$RELEASE_SHA"
          printf 'LOCAL_HEALTH=PASS\n'
          printf 'PUBLIC_HEALTH=PASS\n'
          printf 'BACKUP_PATH=%s\n' "$backup_root"
          printf 'VETS_CANONICAL_MIGRATION_COMPLETE\n'
          VPS1
          VDS

          grep -q '^VETS_CANONICAL_MIGRATION_COMPLETE$' "$receipt"
          cp "$receipt" vps1-migration-receipt.txt
          echo 'complete=true' >> "$GITHUB_OUTPUT"

      - name: Post durable VPS1 migration receipt
        if: steps.migration.outputs.complete == 'true'
        env:
          RELEASE_SHA: ${{ steps.gate.outputs.release_sha }}
          AUTH_CI_RUN_ID: ${{ steps.gate.outputs.ci_run_id }}
          AUTH_SECURITY_RUN_ID: ${{ steps.gate.outputs.security_run_id }}
          CREDENTIAL_RECEIPT_ID: ${{ steps.gate.outputs.credential_receipt_id }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(cat <<EOF_BODY
          ## VETS VPS1 canonical runtime migration — COMPLETE

          - Release SHA: \`$RELEASE_SHA\`
          - Exact-main CI run: \`$AUTH_CI_RUN_ID\`
          - Exact-main Security run: \`$AUTH_SECURITY_RUN_ID\`
          - Credential receipt: \`$CREDENTIAL_RECEIPT_ID\`
          - Canonical application path: \`/var/www/hero-dapp\`
          - Canonical owner: **hero-deploy**
          - Clean exact-SHA tree: **PASS**
          - User-owned PM2 service: **PASS**
          - PM2 release identity: **PASS**
          - Local exact-SHA health: **PASS**
          - Public exact-SHA health: **PASS**
          - Prior application state preserved under timestamped backup: **YES**
          - Automatic rollback invoked: **NO**

          Next gate: protected owner-command deployment and Cloudflare purge using the audited controller.
          EOF_BODY
          )"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE/comments" \
            --data "$(jq -nc --arg body "$body" '{body:$body}')" >/dev/null

      - name: Upload immutable VPS1 migration receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: herobase-vps1-migration-${{ github.event.pull_request.head.sha }}
          path: vps1-migration-receipt.txt
          retention-days: 30
          if-no-files-found: error

      - name: Remove ephemeral VDS key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/vds_key" "$HOME/.ssh/vds_known_hosts"
