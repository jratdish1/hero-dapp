name: Temporary export alias-safe advisory identity corrections

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  export:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.actor == github.repository_owner &&
      github.event.pull_request.number == 59 &&
      github.event.pull_request.head.ref == 'ops/herobase-deploy-monitor-20260725' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact PR63 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/ci-audit-retry-20260726
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Patch, validate, and publish exact blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exported
          python3 <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          from urllib.request import Request, urlopen

          source = Path('scripts/check-production-advisories.mjs')
          text = source.read_text()

          replacements = [
              (
                  '  function visitChildren(node) {\n',
                  '''  function advisoryPackageName(child, fallbackName) {
                    const candidate = child?.from ?? child?.name ?? fallbackName;
                    if (typeof candidate !== "string" || !candidate.trim()) {
                      throw new Error(`production dependency ${fallbackName} had no stable registry package name`);
                    }
                    return candidate.trim();
                  }

                  function visitChildren(node) {
                  ''',
                  'package-name helper',
              ),
              (
                  '''        add(child.name ?? fallbackName, child.version);
                          visit(child);
                  ''',
                  '''        const resolvedName = advisoryPackageName(child, fallbackName);
                          add(resolvedName, child.version);
                          visit(child);
                  ''',
                  'nested alias identity',
              ),
              (
                  '''        const resolvedName = child.name ?? fallbackName;
                          if (
                            !productionRootNames.has(fallbackName) &&
                            !productionRootNames.has(resolvedName)
                          ) {
                            continue;
                          }
                          add(resolvedName, child.version);
                  ''',
                  '''        const declaredName =
                            typeof child.name === "string" && child.name.trim()
                              ? child.name.trim()
                              : fallbackName;
                          if (
                            !productionRootNames.has(fallbackName) &&
                            !productionRootNames.has(declaredName)
                          ) {
                            continue;
                          }
                          const advisoryName = advisoryPackageName(child, fallbackName);
                          add(advisoryName, child.version);
                  ''',
                  'root alias identity',
              ),
              (
                  'function normalizeAdvisories(response) {\n',
                  '''function normalizeAdvisoryId(value, packageName) {
                    if (typeof value === "number") {
                      if (!Number.isSafeInteger(value) || value < 0) {
                        throw new Error(`npm advisory for ${packageName} had invalid numeric ID`);
                      }
                      return String(value);
                    }
                    if (typeof value === "string" && value.trim()) {
                      return value.trim();
                    }
                    throw new Error(`npm advisory for ${packageName} had no stable scalar ID`);
                  }

                  function normalizeAdvisories(response) {
                  ''',
                  'advisory-id helper',
              ),
              (
                  '''      advisories.push({
                            packageName,
                            id: String(advisory.id ?? "unknown"),
                            severity,
                            title: String(advisory.title ?? "Untitled advisory"),
                            vulnerableVersions: String(advisory.vulnerable_versions ?? "unknown"),
                            url: String(advisory.url ?? ""),
                          });
                  ''',
                  '''      advisories.push({
                            packageName,
                            id: normalizeAdvisoryId(advisory.id, packageName),
                            severity,
                            title: String(advisory.title ?? "Untitled advisory"),
                            vulnerableVersions: String(advisory.vulnerable_versions ?? "unknown"),
                            url: String(advisory.url ?? ""),
                          });
                  ''',
                  'stable advisory ID',
              ),
              (
                  '''  const unique = new Map();
                    for (const advisory of advisories) {
                      unique.set(`${advisory.packageName}\\u0000${advisory.id}`, advisory);
                    }
                    return [...unique.values()];
                  ''',
                  '''  const unique = new Map();
                    for (const advisory of advisories) {
                      const key = `${advisory.packageName}\\u0000${advisory.id}`;
                      const existing = unique.get(key);
                      if (existing && JSON.stringify(existing) !== JSON.stringify(advisory)) {
                        throw new Error(
                          `npm advisory ${advisory.id} for ${advisory.packageName} had conflicting duplicate entries`,
                        );
                      }
                      if (!existing) unique.set(key, advisory);
                    }
                    return [...unique.values()];
                  ''',
                  'conflicting duplicate rejection',
              ),
          ]

          # Dedent the JavaScript snippets embedded above without disturbing
          # their intentional internal indentation.
          import textwrap
          normalized = []
          for old, new, label in replacements:
              normalized.append((textwrap.dedent(old), textwrap.dedent(new), label))

          for old, new, label in normalized:
              if text.count(old) != 1:
                  raise RuntimeError(f'{label} replacement count: {text.count(old)}')
              text = text.replace(old, new, 1)

          out = Path('exported/check-production-advisories.mjs')
          out.write_text(text)
          subprocess.run(['node', '--check', str(out)], check=True)

          required = [
              'child?.from ?? child?.name ?? fallbackName',
              'normalizeAdvisoryId(advisory.id, packageName)',
              'had no stable scalar ID',
              'had conflicting duplicate entries',
              'const elapsedMs = Date.now() - startedAt;',
              '...(inventoryEvidence ?? {})',
          ]
          for token in required:
              if token not in text:
                  raise RuntimeError(f'missing required token: {token}')

          forbidden = set('\u061c\u200e\u200f\u202a\u202b\u202c\u202d\u202e\u2066\u2067\u2068\u2069')
          credential = re.compile(r'BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}')
          if any(char in forbidden for char in text):
              raise RuntimeError('hidden or bidirectional Unicode found')
          if credential.search(text):
              raise RuntimeError('credential pattern found')

          payload = json.dumps({
              'content': base64.b64encode(text.encode()).decode(),
              'encoding': 'base64',
          }).encode()
          request = Request(
              f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs',
              data=payload,
              method='POST',
              headers={
                  'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'VETS-Advisory-Alias-ID-Exporter',
              },
          )
          with urlopen(request, timeout=60) as response:
              blob_sha = json.loads(response.read())['sha']
          if not re.fullmatch(r'[0-9a-f]{40}', blob_sha):
              raise RuntimeError('invalid blob SHA')

          Path('exported/blob-shas.json').write_text(json.dumps({
              'path': 'scripts/check-production-advisories.mjs',
              'blob_sha': blob_sha,
              'npm_alias_identity': 'PASS',
              'stable_advisory_id': 'PASS',
              'conflicting_duplicate_rejection': 'PASS',
              'node_check': 'PASS',
              'hidden_unicode': 'PASS',
              'credential_scan': 'PASS',
          }, indent=2) + '\n')
          print(f'ADVISORY_ALIAS_ID_BLOB={blob_sha}')
          PY

      - name: Upload validated correction
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: advisory-alias-id-${{ github.event.pull_request.head.sha }}
          path: exported
          retention-days: 7
          if-no-files-found: error
