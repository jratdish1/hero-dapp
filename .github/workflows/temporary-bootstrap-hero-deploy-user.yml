name: Temporary bootstrap restricted HeroBase deploy user

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  bootstrap:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.actor == github.repository_owner &&
      github.event.pull_request.number == 59 &&
      github.event.pull_request.head.ref == 'ops/herobase-deploy-monitor-20260725' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VDS_HOST: ${{ secrets.VDS_HOST }}
      VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}

    steps:
      - name: Checkout armed monitor branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ops/herobase-deploy-monitor-20260725
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Validate one-shot trigger and route
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat ops/herobase-user-bootstrap.trigger)" = 'VETS_EXECUTE_HERO_DEPLOY_BOOTSTRAP_V1'
          test -n "$VDS_HOST"
          test -n "$VDS_SSH_KEY"
          [[ "$VDS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]

      - name: Establish pinned VDS-M route
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VDS_SSH_KEY" > "$HOME/.ssh/vds_key"
          ssh-keygen -y -f "$HOME/.ssh/vds_key" >/dev/null
          ssh-keyscan -T 10 -t ed25519 -H "$VDS_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          actual="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" | awk '{print $2}')"
          test "$actual" = 'SHA256:EdmFXzo/0Tw9jlbH+tNfBGcRGDf1TQu8m0LWiobRXFY'
          chmod 600 "$HOME/.ssh/vds_key" "$HOME/.ssh/known_hosts"

      - name: Create user, preserve pre-bootstrap state, and install production secrets
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/vds_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "root@$VDS_HOST" \
            bash -s <<'VDS' | tee hero-deploy-bootstrap-receipt.txt
          set -euo pipefail
          REPO='jratdish1/hero-dapp'
          ENVIRONMENT='production'
          VPS1_HOST='62.146.175.67'
          VPS1_USER='hero-deploy'
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          chmod 700 "$work"

          command -v gh >/dev/null
          command -v ssh >/dev/null
          command -v ssh-keygen >/dev/null
          command -v ssh-keyscan >/dev/null
          gh auth status >/dev/null
          gh repo view "$REPO" >/dev/null

          key="$work/hero_deploy_ed25519"
          ssh-keygen -q -t ed25519 -N '' -C 'vets-herobase-production-deploy' -f "$key"
          chmod 600 "$key"
          public_key_b64="$(base64 -w0 < "$key.pub")"

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            vps1 bash -s -- "$public_key_b64" <<'VPS1'
          set -euo pipefail
          public_key="$(printf '%s' "$1" | base64 -d)"
          user='hero-deploy'
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup_root="/var/backups/hero-dapp/$timestamp"

          if ! id "$user" >/dev/null 2>&1; then
            useradd --create-home --shell /bin/bash --comment 'Restricted HeroBase production deployment' "$user"
          fi
          passwd -l "$user" >/dev/null 2>&1 || true
          install -d -m 700 -o "$user" -g "$user" "/home/$user/.ssh"
          printf '%s\n' "$public_key" > "/home/$user/.ssh/authorized_keys"
          chown "$user:$user" "/home/$user/.ssh/authorized_keys"
          chmod 600 "/home/$user/.ssh/authorized_keys"

          install -d -m 700 "$backup_root"
          for app_dir in /var/www/hero-dapp /root/hero-dapp; do
            label="$(printf '%s' "$app_dir" | sed 's#^/##; s#/#-#g')"
            if [ -d "$app_dir/.git" ]; then
              (
                cd "$app_dir"
                git rev-parse HEAD > "$backup_root/$label.head"
                git status --porcelain=v1 --untracked-files=all > "$backup_root/$label.status"
                git diff --binary > "$backup_root/$label.tracked.patch"
                git ls-files --others --exclude-standard -z > "$backup_root/$label.untracked.list0"
                if [ -s "$backup_root/$label.untracked.list0" ]; then
                  tar --null -czf "$backup_root/$label.untracked.tar.gz" -T "$backup_root/$label.untracked.list0"
                fi
                origin="$(git remote get-url origin 2>/dev/null || true)"
                origin="$(printf '%s' "$origin" | sed -E 's#(https://)[^/@]+@#\1REDACTED@#; s#(https://)[^:]+:[^@]+@#\1REDACTED@#')"
                printf '%s\n' "$origin" > "$backup_root/$label.origin"
              )
            fi
            if [ -f "$app_dir/.env" ]; then
              install -m 600 "$app_dir/.env" "$backup_root/$label.env"
              sha256sum "$backup_root/$label.env" > "$backup_root/$label.env.sha256"
            fi
          done

          install -d -m 755 /var/lib/vets
          cat > /var/lib/vets/hero-deploy-bootstrap.json <<EOF
          {"schema":"VETS_HERO_DEPLOY_BOOTSTRAP_V1","user":"$user","backup":"$backup_root","created_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          chmod 600 /var/lib/vets/hero-deploy-bootstrap.json

          printf 'VPS1_USER_READY=%s\n' "$(id -un "$user")"
          printf 'VPS1_USER_UID=%s\n' "$(id -u "$user")"
          printf 'VPS1_USER_HOME=%s\n' "$(getent passwd "$user" | cut -d: -f6)"
          printf 'VPS1_AUTHORIZED_KEY_FINGERPRINT='; ssh-keygen -lf "/home/$user/.ssh/authorized_keys" | awk '{print $2}'
          printf 'VPS1_BACKUP_ROOT=%s\n' "$backup_root"
          printf 'LIVE_PM2_UNCHANGED=true\n'
          VPS1

          trusted_fingerprint="$(ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            vps1 'ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub' | awk '{print $2}')"
          [[ "$trusted_fingerprint" =~ ^SHA256: ]]

          known_hosts="$work/vps1_known_hosts"
          ssh-keyscan -T 10 -t ed25519 "$VPS1_HOST" > "$known_hosts" 2>/dev/null
          test -s "$known_hosts"
          scanned_fingerprint="$(ssh-keygen -lf "$known_hosts" | awk '{print $2}')"
          test "$scanned_fingerprint" = "$trusted_fingerprint"
          chmod 600 "$known_hosts"

          direct_user="$(ssh \
            -i "$key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            "$VPS1_USER@$VPS1_HOST" 'id -un')"
          test "$direct_user" = "$VPS1_USER"

          printf '%s' "$VPS1_HOST" | gh secret set VPS1_HOST --env "$ENVIRONMENT" --repo "$REPO"
          printf '%s' "$VPS1_USER" | gh secret set VPS1_USER --env "$ENVIRONMENT" --repo "$REPO"
          gh secret set VPS1_SSH_KEY --env "$ENVIRONMENT" --repo "$REPO" < "$key"
          gh secret set VPS1_KNOWN_HOSTS --env "$ENVIRONMENT" --repo "$REPO" < "$known_hosts"

          names="$(gh secret list --env "$ENVIRONMENT" --repo "$REPO" --json name --jq 'map(.name) | sort | join(" ")')"
          for required in CF_API_TOKEN CF_ZONE_ID VPS1_HOST VPS1_KNOWN_HOSTS VPS1_SSH_KEY VPS1_USER; do
            case " $names " in
              *" $required "*) ;;
              *) printf 'MISSING_REQUIRED_SECRET=%s\n' "$required" >&2; exit 78 ;;
            esac
          done

          printf 'VDS_GITHUB_AUTH=READY\n'
          printf 'VPS1_DIRECT_RESTRICTED_SSH=PASS\n'
          printf 'VPS1_HOST_FINGERPRINT=%s\n' "$trusted_fingerprint"
          printf 'PRODUCTION_SECRET_NAMES=%s\n' "$names"
          printf 'VETS_SECRET_PREFLIGHT_READY\n'
          VDS

      - name: Upload immutable bootstrap receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hero-deploy-bootstrap-${{ github.event.pull_request.head.sha }}
          path: hero-deploy-bootstrap-receipt.txt
          retention-days: 30
          if-no-files-found: error

      - name: Remove ephemeral runner SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/vds_key" "$HOME/.ssh/known_hosts"
