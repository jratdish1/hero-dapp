name: Temporary HeroBase production credential preparation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  prepare:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.event.pull_request.number == 59 &&
      github.event.pull_request.head.ref == 'ops/herobase-deploy-monitor-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: temporary-herobase-production-credential-prep
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VDS_HOST: ${{ secrets.VDS_HOST }}
      VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
      VPS1_HOST: ${{ secrets.VPS1_HOST }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      TRACKER_ISSUE: '43'

    steps:
      - name: Wait for audited DAO security merge and exact-main gates
        id: release
        shell: bash
        run: |
          set -euo pipefail
          api_get() {
            local url="$1" response=""
            for attempt in $(seq 1 5); do
              if response="$(curl --fail-with-body --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "$url")"; then
                printf '%s' "$response"
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          deadline=$((SECONDS + 1800))
          while [ "$SECONDS" -lt "$deadline" ]; do
            main_sha="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -r '.object.sha')"
            [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
            closed_prs="$(api_get \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls?state=closed&head=jratdish1:fix/dao-ownership-production-20260726&base=main&per_page=100")"
            merge_sha="$(jq -r '[.[] | select(.merged_at != null)] | sort_by(.number) | last.merge_commit_sha // empty' <<<"$closed_prs")"
            if [ -n "$merge_sha" ] && [ "$main_sha" = "$merge_sha" ]; then
              ci_id="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml" | jq -r '.id')"
              sec_id="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/security-and-quality.yml" | jq -r '.id')"
              ci_run="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$ci_id/runs?branch=main&event=push&head_sha=$main_sha&per_page=100" \
                | jq -c --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .run_attempt == 1)] | sort_by(.id) | last // empty')"
              sec_run="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$sec_id/runs?branch=main&event=push&head_sha=$main_sha&per_page=100" \
                | jq -c --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .run_attempt == 1)] | sort_by(.id) | last // empty')"
              if [ -n "$ci_run" ] && [ -n "$sec_run" ] && \
                 [ "$(jq -r '.status' <<<"$ci_run")" = completed ] && \
                 [ "$(jq -r '.conclusion' <<<"$ci_run")" = success ] && \
                 [ "$(jq -r '.status' <<<"$sec_run")" = completed ] && \
                 [ "$(jq -r '.conclusion' <<<"$sec_run")" = success ]; then
                ci_run_id="$(jq -r '.id' <<<"$ci_run")"
                sec_run_id="$(jq -r '.id' <<<"$sec_run")"
                echo "release_sha=$main_sha" >> "$GITHUB_OUTPUT"
                echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"
                echo "security_run_id=$sec_run_id" >> "$GITHUB_OUTPUT"
                printf 'RELEASE_READY sha=%s ci=%s security=%s\n' "$main_sha" "$ci_run_id" "$sec_run_id"
                exit 0
              fi
            fi
            sleep 20
          done
          echo 'Timed out waiting for narrow DAO merge and exact-main first-attempt checks' >&2
          exit 75

      - name: Pin VDS-M host identity and install ephemeral key
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "$VDS_HOST" ] || missing+=(VDS_HOST)
          [ -n "$VDS_SSH_KEY" ] || missing+=(VDS_SSH_KEY)
          [ -n "$VPS1_HOST" ] || missing+=(VPS1_HOST)
          [ -n "$CF_ZONE_ID" ] || missing+=(CF_ZONE_ID)
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required route secret: %s\n' "${missing[@]}" >&2
            exit 78
          fi
          [[ "$VDS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS1_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$CF_ZONE_ID" =~ ^[0-9a-fA-F]{32}$ ]]
          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VDS_SSH_KEY" > "$HOME/.ssh/vds_key"
          ssh-keygen -y -f "$HOME/.ssh/vds_key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$VDS_HOST" > "$HOME/.ssh/vds_known_hosts" 2>/dev/null
          [ -s "$HOME/.ssh/vds_known_hosts" ]
          fingerprint="$(ssh-keygen -lf "$HOME/.ssh/vds_known_hosts" | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:EdmFXzo/0Tw9jlbH+tNfBGcRGDf1TQu8m0LWiobRXFY'
          chmod 600 "$HOME/.ssh/vds_key" "$HOME/.ssh/vds_known_hosts"
          printf 'VDS_HOST_IDENTITY=VERIFIED\n'

      - name: Create restricted deployment identity and publish protected secrets
        id: provision
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          AUTH_CI_RUN_ID: ${{ steps.release.outputs.ci_run_id }}
          AUTH_SECURITY_RUN_ID: ${{ steps.release.outputs.security_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/credential-prep-receipt.txt"
          ssh \
            -i "$HOME/.ssh/vds_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/vds_known_hosts" \
            "root@$VDS_HOST" \
            bash -s -- "$GITHUB_REPOSITORY" "$VPS1_HOST" "$CF_ZONE_ID" "$RELEASE_SHA" "$AUTH_CI_RUN_ID" "$AUTH_SECURITY_RUN_ID" <<'VDS' \
            | tee "$receipt"
          set -Eeuo pipefail
          REPO="$1"
          VPS1_HOST="$2"
          CF_ZONE_ID="$3"
          RELEASE_SHA="$4"
          AUTH_CI_RUN_ID="$5"
          AUTH_SECURITY_RUN_ID="$6"
          DEPLOY_USER='hero-deploy'
          tmp="$(mktemp -d)"
          cleanup() {
            chmod -R u+rwX "$tmp" 2>/dev/null || true
            rm -rf "$tmp"
            unset cf_token global_email global_key
          }
          trap cleanup EXIT
          umask 077

          command -v gh >/dev/null
          command -v jq >/dev/null
          command -v curl >/dev/null
          command -v ssh-keygen >/dev/null
          test "$(gh api user --jq .login)" = 'jratdish1'
          test "$(gh api "repos/$REPO" --jq .full_name)" = "$REPO"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AUTH_CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$AUTH_SECURITY_RUN_ID" =~ ^[0-9]+$ ]]

          vps1_alias_host="$(ssh -G vps1 | awk '$1 == "hostname" {print $2; exit}')"
          [ -n "$vps1_alias_host" ]
          ssh-keygen -F "$vps1_alias_host" -f /root/.ssh/known_hosts >/dev/null
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            vps1 'test "$(id -u)" = 0 && hostname' >/dev/null

          # Recover an existing scoped bearer token without printing it.
          python3 - "$tmp/candidates" <<'PY'
          from pathlib import Path
          import re
          import sys

          out = Path(sys.argv[1])
          names = {'CF_API_TOKEN', 'CLOUDFLARE_API_TOKEN', 'CF_TOKEN', 'CLOUDFLARE_TOKEN'}
          candidates = []
          direct = [
              Path('/root/.vets/herobase_cf_cache_token'),
              Path('/opt/apex-agent/.cf_token_cache'),
              Path('/opt/apex-agent/.cf_token'),
          ]
          for path in direct:
              try:
                  value = path.read_text().strip()
              except OSError:
                  continue
              if value and value not in candidates:
                  candidates.append(value)
          for path in [Path('/root/.cloudflare_creds'), Path('/root/.env_architecture'), Path('/opt/apex-agent/.env')]:
              try:
                  lines = path.read_text(errors='ignore').splitlines()
              except OSError:
                  continue
              for line in lines:
                  match = re.match(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*?)\s*$', line)
                  if not match or match.group(1) not in names:
                      continue
                  value = match.group(2).strip()
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                      value = value[1:-1]
                  if value and value not in candidates:
                      candidates.append(value)
          out.write_text('\n'.join(candidates) + ('\n' if candidates else ''))
          out.chmod(0o600)
          PY

          cf_token=''
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            if verify="$(curl -4 --fail-with-body --silent --show-error \
                 --connect-timeout 10 --max-time 30 \
                 -H "Authorization: Bearer $candidate" \
                 -H 'Content-Type: application/json' \
                 https://api.cloudflare.com/client/v4/user/tokens/verify 2>/dev/null)" &&
               jq -e '.success == true and .result.status == "active" and ((.errors // []) | length == 0)' \
                 <<<"$verify" >/dev/null &&
               zone="$(curl -4 --fail-with-body --silent --show-error \
                 --connect-timeout 10 --max-time 30 \
                 -H "Authorization: Bearer $candidate" \
                 -H 'Content-Type: application/json' \
                 "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID" 2>/dev/null)" &&
               jq -e '.success == true and .result.name == "herobase.io" and .result.status == "active" and ((.errors // []) | length == 0)' \
                 <<<"$zone" >/dev/null; then
              cf_token="$candidate"
              break
            fi
          done < "$tmp/candidates"
          unset candidate verify zone

          # If no bearer token exists, create a least-privilege zone token from existing global auth.
          if [ -z "$cf_token" ]; then
            python3 - "$tmp/global-auth.json" <<'PY'
          from pathlib import Path
          import json
          import re
          import sys

          wanted_email = {'CF_EMAIL', 'CLOUDFLARE_EMAIL', 'CF_API_EMAIL'}
          wanted_key = {'CF_GLOBAL_API_KEY', 'CLOUDFLARE_API_KEY', 'CF_API_KEY', 'GLOBAL_API_KEY'}
          found = {}
          for path in [Path('/root/.cloudflare_creds'), Path('/root/.env_architecture'), Path('/opt/apex-agent/.env')]:
              try:
                  lines = path.read_text(errors='ignore').splitlines()
              except OSError:
                  continue
              for line in lines:
                  match = re.match(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*?)\s*$', line)
                  if not match:
                      continue
                  name, value = match.group(1), match.group(2).strip()
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                      value = value[1:-1]
                  if name in wanted_email and value and 'email' not in found:
                      found['email'] = value
                  if name in wanted_key and value and 'key' not in found:
                      found['key'] = value
          Path(sys.argv[1]).write_text(json.dumps(found))
          Path(sys.argv[1]).chmod(0o600)
          PY
            global_email="$(jq -r '.email // empty' "$tmp/global-auth.json")"
            global_key="$(jq -r '.key // empty' "$tmp/global-auth.json")"
            [ -n "$global_email" ] && [ -n "$global_key" ] || {
              echo 'CLOUDFLARE_TOKEN_SOURCE=BLOCKED_NO_VALID_BEARER_OR_GLOBAL_AUTH' >&2
              exit 78
            }
            zone="$(curl -4 --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              -H "X-Auth-Email: $global_email" \
              -H "X-Auth-Key: $global_key" \
              -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID")"
            jq -e '.success == true and .result.name == "herobase.io" and .result.status == "active" and ((.errors // []) | length == 0)' \
              <<<"$zone" >/dev/null
            permission_groups="$(curl -4 --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              -H "X-Auth-Email: $global_email" \
              -H "X-Auth-Key: $global_key" \
              -H 'Content-Type: application/json' \
              https://api.cloudflare.com/client/v4/user/tokens/permission_groups)"
            purge_group="$(jq -r '[.result[] | select((.name | ascii_downcase) == "cache purge")] | first.id // empty' \
              <<<"$permission_groups")"
            [ -n "$purge_group" ] || {
              echo 'CLOUDFLARE_TOKEN_SOURCE=BLOCKED_CACHE_PURGE_PERMISSION_GROUP_NOT_FOUND' >&2
              exit 78
            }
            token_payload="$(jq -nc \
              --arg name "HeroBase GitHub Deploy Cache Purge $(date -u +%Y%m%dT%H%M%SZ)" \
              --arg zone "$CF_ZONE_ID" \
              --arg group "$purge_group" \
              '{name:$name,policies:[{effect:"allow",resources:{("com.cloudflare.api.account.zone."+$zone):"*"},permission_groups:[{id:$group}]}]}')"
            created="$(curl -4 --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 60 \
              -X POST \
              -H "X-Auth-Email: $global_email" \
              -H "X-Auth-Key: $global_key" \
              -H 'Content-Type: application/json' \
              https://api.cloudflare.com/client/v4/user/tokens \
              --data "$token_payload")"
            jq -e '.success == true and ((.errors // []) | length == 0) and (.result.value | length > 20)' \
              <<<"$created" >/dev/null
            cf_token="$(jq -r '.result.value' <<<"$created")"
            install -m 700 -d /root/.vets
            printf '%s' "$cf_token" > /root/.vets/herobase_cf_cache_token
            chmod 600 /root/.vets/herobase_cf_cache_token
            unset global_email global_key zone permission_groups purge_group token_payload created
            printf 'CLOUDFLARE_TOKEN_SOURCE=CREATED_SCOPED_ZONE_CACHE_PURGE\n'
          else
            printf 'CLOUDFLARE_TOKEN_SOURCE=EXISTING_VALID_BEARER\n'
          fi

          verify="$(curl -4 --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $cf_token" \
            -H 'Content-Type: application/json' \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          jq -e '.success == true and .result.status == "active" and ((.errors // []) | length == 0)' <<<"$verify" >/dev/null
          printf 'CLOUDFLARE_TOKEN_VERIFY=PASS\n'

          ssh-keygen -q -t ed25519 -N '' -C 'github-actions-hero-deploy' -f "$tmp/hero_deploy_key"
          public_key="$(cat "$tmp/hero_deploy_key.pub")"

          ssh -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            vps1 bash -s -- "$DEPLOY_USER" "$public_key" <<'VPS1'
          set -Eeuo pipefail
          user="$1"
          public_key="$2"
          if ! id "$user" >/dev/null 2>&1; then
            useradd --create-home --shell /bin/bash "$user"
          fi
          test "$(id -u "$user")" -ge 1000
          install -d -m 700 -o "$user" -g "$user" "/home/$user/.ssh"
          auth="/home/$user/.ssh/authorized_keys"
          touch "$auth"
          chmod 600 "$auth"
          chown "$user:$user" "$auth"
          tmp_auth="$(mktemp)"
          awk '!/github-actions-hero-deploy$/' "$auth" > "$tmp_auth"
          printf '%s\n' "$public_key" >> "$tmp_auth"
          install -m 600 -o "$user" -g "$user" "$tmp_auth" "$auth"
          rm -f "$tmp_auth"
          printf 'DEPLOY_USER_READY=%s\n' "$user"
          VPS1

          known_hosts="$tmp/vps1_known_hosts"
          ssh-keygen -F "$VPS1_HOST" -f /root/.ssh/known_hosts 2>/dev/null | awk '!/^#/' > "$known_hosts"
          [ -s "$known_hosts" ] || {
            alias_host="$(ssh -G vps1 | awk '$1 == "hostname" {print $2; exit}')"
            test "$alias_host" = "$VPS1_HOST"
            ssh-keygen -F "$alias_host" -f /root/.ssh/known_hosts 2>/dev/null | awk '!/^#/' > "$known_hosts"
          }
          [ -s "$known_hosts" ]
          chmod 600 "$known_hosts"

          ssh -i "$tmp/hero_deploy_key" \
            -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
            "$DEPLOY_USER@$VPS1_HOST" 'test "$(id -un)" = hero-deploy && hostname' >/dev/null
          printf 'DIRECT_DEPLOY_SSH=PASS\n'

          printf '%s' "$VPS1_HOST" | gh secret set VPS1_HOST --env production --repo "$REPO"
          printf '%s' "$DEPLOY_USER" | gh secret set VPS1_USER --env production --repo "$REPO"
          gh secret set VPS1_SSH_KEY --env production --repo "$REPO" < "$tmp/hero_deploy_key"
          gh secret set VPS1_KNOWN_HOSTS --env production --repo "$REPO" < "$known_hosts"
          printf '%s' "$cf_token" | gh secret set CF_API_TOKEN --env production --repo "$REPO"
          printf '%s' "$CF_ZONE_ID" | gh secret set CF_ZONE_ID --env production --repo "$REPO"
          unset cf_token

          required='CF_API_TOKEN CF_ZONE_ID VPS1_HOST VPS1_KNOWN_HOSTS VPS1_SSH_KEY VPS1_USER'
          actual="$(gh secret list --env production --repo "$REPO" --json name --jq 'map(.name) | sort | join(" ")')"
          test "$actual" = "$required"
          printf 'PRODUCTION_SECRET_NAMES=%s\n' "$actual"
          printf 'RELEASE_SHA=%s\n' "$RELEASE_SHA"
          printf 'AUTHORIZED_CI_RUN=%s\n' "$AUTH_CI_RUN_ID"
          printf 'AUTHORIZED_SECURITY_RUN=%s\n' "$AUTH_SECURITY_RUN_ID"
          printf 'VETS_SECRET_PREFLIGHT_READY\n'
          VDS

          grep -q '^VETS_SECRET_PREFLIGHT_READY$' "$receipt"
          cp "$receipt" credential-prep-receipt.txt
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Post durable credential-preparation receipt
        if: steps.provision.outputs.ready == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          AUTH_CI_RUN_ID: ${{ steps.release.outputs.ci_run_id }}
          AUTH_SECURITY_RUN_ID: ${{ steps.release.outputs.security_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(cat <<EOF_BODY
          ## VETS production credential preparation — COMPLETE

          - Release SHA: \`$RELEASE_SHA\`
          - Exact-main CI run: \`$AUTH_CI_RUN_ID\`
          - Exact-main Security run: \`$AUTH_SECURITY_RUN_ID\`
          - Restricted VPS1 user: **hero-deploy**
          - Direct strict-host SSH test: **PASS**
          - Cloudflare scoped token validation: **PASS**
          - Required production environment secret names: **6/6 present**
          - Secret values exposed: **NO**
          - Application deployment performed: **NO**
          - Cloudflare purge performed: **NO**

          Next gate: bounded canonical-path and PM2 migration with rollback evidence.
          EOF_BODY
          )"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE/comments" \
            --data "$(jq -nc --arg body "$body" '{body:$body}')" >/dev/null

      - name: Upload immutable credential-preparation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: herobase-credential-prep-${{ github.event.pull_request.head.sha }}
          path: credential-prep-receipt.txt
          retention-days: 14
          if-no-files-found: error

      - name: Remove ephemeral VDS key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/vds_key" "$HOME/.ssh/vds_known_hosts"
