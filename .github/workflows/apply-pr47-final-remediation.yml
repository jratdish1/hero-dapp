name: Apply final PR47 remediation

on:
  push:
    branches:
      - ops/vets-production-command-20260724

permissions:
  contents: write

concurrency:
  group: apply-pr47-final-remediation
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply final PR47 remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ops/vets-production-command-20260724
          fetch-depth: 0
          show-progress: false

      - name: Verify exact staged head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "ops/vets-production-command-20260724"
          test "$(git rev-parse HEAD^)" = "47475972453cc20d6ac8b8311eb099b31f7eb5be"
          test "$(git log -1 --pretty=%s)" = "chore: apply final PR47 remediation"
          test -z "$(git status --porcelain)"
          test -f ops/pr47-final-remediation.py

      - name: Apply and validate bounded workflow corrections
        run: python3 ops/pr47-final-remediation.py

      - name: Commit exact validated workflow tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VETS Production Gate Remediation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix: close production command race and rollback gaps"
          git push origin HEAD:ops/vets-production-command-20260724
