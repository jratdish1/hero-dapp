name: Apply final PR47 remediation

on:
  push:
    branches:
      - ops/vets-production-command-20260724
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-pr47-final-remediation
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'ops/vets-production-command-20260724') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/ops/vets-production-command-20260724' && github.event.head_commit.message == 'chore: apply final PR47 remediation')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ops/vets-production-command-20260724
          fetch-depth: 0
          show-progress: false

      - name: Verify exact staged head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "ops/vets-production-command-20260724"
          test "$(git rev-parse HEAD^)" = "38d4416ce4d22d2df1bce7722019b10a22542e22"
          test "$(git log -1 --pretty=%s)" = "chore: rerun PR47 final remediation"
          test -z "$(git status --porcelain)"
          test -f ops/pr47-final-remediation.py

      - name: Apply and validate bounded workflow corrections
        id: remediation
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 ops/pr47-final-remediation.py > pr47-remediation.log 2>&1
          status=$?
          cat pr47-remediation.log
          printf 'exit_status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload remediation diagnostics
        if: always() && hashFiles('pr47-remediation.log') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr47-remediation-diagnostics-${{ github.sha }}
          path: pr47-remediation.log
          retention-days: 7
          if-no-files-found: error

      - name: Enforce remediation gate
        if: always()
        shell: bash
        run: |
          test "${{ steps.remediation.outcome }}" = "success"
          test "${{ steps.remediation.outputs.exit_status }}" = "0"

      - name: Commit exact validated workflow tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VETS Production Gate Remediation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix: close production command race and rollback gaps"
          git push origin HEAD:ops/vets-production-command-20260724
