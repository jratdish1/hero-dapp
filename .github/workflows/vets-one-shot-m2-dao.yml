name: vets-one-shot-m2-dao

on:
  push:
    branches:
      - cert/m2-dao-snapshot-clean-20260730
    paths:
      - .github/workflows/vets-one-shot-m2-dao.yml

permissions:
  contents: write

concurrency:
  group: vets-one-shot-m2-dao
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout clean M-2 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: cert/m2-dao-snapshot-clean-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Recover and execute bounded predecessor steps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow_path = '.github/workflows/vets-one-shot-m2-dao.yml'
          previous = subprocess.check_output(
              ['git', 'show', f'HEAD^:{workflow_path}'],
              text=True,
          )

          step_names = [
              'Apply bounded snapshot and feature-fence remediation',
              'Validate generated source',
              'Commit clean M-2 candidate and self-remove',
          ]

          for index, name in enumerate(step_names, start=1):
              marker = f'      - name: {name}\n'
              marker_at = previous.find(marker)
              if marker_at < 0:
                  raise SystemExit(f'FAIL-CLOSED: predecessor step not found: {name}')
              run_marker = '        run: |\n'
              run_at = previous.find(run_marker, marker_at)
              if run_at < 0:
                  raise SystemExit(f'FAIL-CLOSED: predecessor run block not found: {name}')
              start = run_at + len(run_marker)
              end = previous.find('\n      - name:', start)
              if end < 0:
                  end = len(previous)
              raw_lines = previous[start:end].splitlines()
              block_lines = []
              for line in raw_lines:
                  if line and not line.startswith('          '):
                      raise SystemExit(f'FAIL-CLOSED: unexpected indentation in {name}: {line!r}')
                  block_lines.append(line[10:] if line else '')
              script = '\n'.join(block_lines).rstrip() + '\n'
              target = Path(f'/tmp/vets-m2-step-{index}.sh')
              target.write_text('#!/usr/bin/env bash\n' + script, encoding='utf-8')
              target.chmod(0o700)

          print('RECOVERED_BOUNDED_M2_STEPS')
          PY

          /tmp/vets-m2-step-1.sh
          /tmp/vets-m2-step-2.sh
          /tmp/vets-m2-step-3.sh

# Exact-parent PR controller trigger: M2
