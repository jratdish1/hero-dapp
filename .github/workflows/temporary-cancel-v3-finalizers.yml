name: Temporary cancel superseded HeroBase v3 runs

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.event.pull_request.number == 59 &&
      github.event.pull_request.head.ref == 'ops/herobase-deploy-monitor-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel superseded v3 orchestration runs
        shell: bash
        run: |
          set -euo pipefail
          repo_api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          runs="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$repo_api/actions/runs?branch=ops/herobase-deploy-monitor-20260725&per_page=100")"
          while IFS=$'\t' read -r id name status; do
            [[ "$id" =~ ^[0-9]+$ ]] || continue
            [ "$id" != "$GITHUB_RUN_ID" ] || continue
            case "$name" in
              'Temporary DAO one-file production finalizer v3'|'Temporary HeroBase production host finalizer v3'|'Temporary HeroBase production final verification v3')
                case "$status" in queued|in_progress|pending|waiting|requested)
                  curl --silent --show-error --connect-timeout 10 --max-time 30 -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$repo_api/actions/runs/$id/cancel" >/dev/null || true;;
                esac;;
            esac
          done < <(jq -r '.workflow_runs[]|[.id,.name,.status]|@tsv' <<<"$runs")
