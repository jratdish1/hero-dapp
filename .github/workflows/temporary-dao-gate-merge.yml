name: Temporary DAO narrow-lane gate and expected-head merge

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  finalize:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.event.pull_request.number == 59 &&
      github.event.pull_request.head.ref == 'ops/herobase-deploy-monitor-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PATCH_BRANCH: fix/dao-ownership-production-20260726
      TRACKER_ISSUE: '43'

    steps:
      - name: Require exact scope, exact-head gates, Codex, and merge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence

          api_get() {
            local url="$1" response=""
            for attempt in $(seq 1 5); do
              if response="$(curl --fail-with-body --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$url")"; then
                printf '%s' "$response"
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          api_write() {
            local method="$1" url="$2" payload="$3"
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 60 \
              -X "$method" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" --data "$payload"
          }

          repo_api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          owner="${GITHUB_REPOSITORY%%/*}"
          pulls="$(api_get "$repo_api/pulls?state=open&head=$owner:$PATCH_BRANCH&base=main&per_page=100")"
          pr_count="$(jq -r 'length' <<<"$pulls")"
          test "$pr_count" = "1"
          pr_number="$(jq -r '.[0].number' <<<"$pulls")"
          head_sha="$(jq -r '.[0].head.sha' <<<"$pulls")"
          [[ "$pr_number" =~ ^[0-9]+$ ]]
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]

          api_write PATCH "$repo_api/pulls/$pr_number" '{"draft":false}' >/dev/null

          files="$(api_get "$repo_api/pulls/$pr_number/files?per_page=100")"
          jq -e 'length == 1 and .[0].filename == "server/routers.ts"' <<<"$files" >/dev/null
          patch="$(jq -r '.[0].patch // empty' <<<"$files")"
          test -n "$patch"
          grep -Fq 'proposal.proposerId !== ctx.user.id' <<<"$patch"
          grep -Fq 'delegate.userId !== ctx.user.id' <<<"$patch"
          grep -Fq '.mutation(async ({ ctx, input }) =>' <<<"$patch"
          if grep -Eiq 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}' <<<"$patch"; then
            echo 'Credential-like content in patch' >&2
            exit 1
          fi

          comments="$(api_get "$repo_api/issues/$pr_number/comments?per_page=100")"
          if ! jq -e --arg sha "$head_sha" '
            any(.[];
              .user.login == "jratdish1" and
              (.body | startswith("@codex review"))
            )
          ' <<<"$comments" >/dev/null; then
            review_body="$(jq -nc --arg body "@codex review

Review the current exact head $head_sha only. One-file production security correction. Report every P0/P1/P2 issue and do not modify code." '{body:$body}')"
            api_write POST "$repo_api/issues/$pr_number/comments" "$review_body" >/dev/null
          fi

          find_success_run() {
            local workflow_file="$1" required_job="$2" workflow_id runs run_id jobs
            workflow_id="$(api_get "$repo_api/actions/workflows/$workflow_file" | jq -r '.id')"
            [[ "$workflow_id" =~ ^[0-9]+$ ]]
            runs="$(api_get "$repo_api/actions/workflows/$workflow_id/runs?branch=$PATCH_BRANCH&event=pull_request&head_sha=$head_sha&per_page=100")"
            run_id="$(jq -r --arg sha "$head_sha" '
              [.workflow_runs[] | select(
                .head_sha == $sha and
                .event == "pull_request" and
                .status == "completed" and
                .conclusion == "success"
              )] | sort_by(.id) | last.id // empty
            ' <<<"$runs")"
            [[ "$run_id" =~ ^[0-9]+$ ]] || return 1
            jobs="$(api_get "$repo_api/actions/runs/$run_id/jobs?per_page=100")"
            jq -e --arg name "$required_job" '
              [.jobs[] | select(.name == $name)]
              | length > 0 and (max_by(.id) | .status == "completed" and .conclusion == "success")
            ' <<<"$jobs" >/dev/null || return 1
            printf '%s' "$run_id"
          }

          ci_run_id=""
          security_run_id=""
          codex_comment_id=""
          for attempt in $(seq 1 90); do
            current="$(api_get "$repo_api/pulls/$pr_number")"
            test "$(jq -r '.head.sha' <<<"$current")" = "$head_sha"
            ci_run_id="$(find_success_run ci.yml test-build-scan || true)"
            security_run_id="$(find_success_run security-and-quality.yml repository-safety || true)"
            comments="$(api_get "$repo_api/issues/$pr_number/comments?per_page=100")"
            short_sha="${head_sha:0:10}"
            codex_comment_id="$(jq -r --arg short "$short_sha" '
              [.[] | select(
                .user.login == "chatgpt-codex-connector[bot]" and
                ((.body | ascii_downcase) | contains("didn't find any major issues") or contains("no major issues")) and
                (.body | contains($short))
              )] | sort_by(.id) | last.id // empty
            ' <<<"$comments")"
            if [[ "$ci_run_id" =~ ^[0-9]+$ ]] &&
               [[ "$security_run_id" =~ ^[0-9]+$ ]] &&
               [[ "$codex_comment_id" =~ ^[0-9]+$ ]]; then
              break
            fi
            sleep 20
          done
          [[ "$ci_run_id" =~ ^[0-9]+$ ]]
          [[ "$security_run_id" =~ ^[0-9]+$ ]]
          [[ "$codex_comment_id" =~ ^[0-9]+$ ]]

          graphql_payload="$(jq -nc --arg query 'query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' --arg owner "$owner" --arg repo "${GITHUB_REPOSITORY#*/}" --argjson number "$pr_number" '{query:$query,variables:{owner:$owner,repo:$repo,number:$number}}')"
          threads="$(api_write POST https://api.github.com/graphql "$graphql_payload")"
          jq -e '.data.repository.pullRequest.reviewThreads.nodes | all(.isResolved == true)' <<<"$threads" >/dev/null

          gate_body="$(cat <<EOF_GATE
          VETS_DAO_NARROW_GATE v1
          exact_head: $head_sha
          changed_files: server/routers.ts
          ci_run_id: $ci_run_id
          security_run_id: $security_run_id
          codex_comment_id: $codex_comment_id
          unresolved_review_threads: 0
          critical: 0
          high: 0
          medium: 0
          low: 0
          decision: expected-head-squash-merge-authorized
          EOF_GATE
          )"
          api_write POST "$repo_api/issues/$pr_number/comments" "$(jq -nc --arg body "$gate_body" '{body:$body}')" >/dev/null

          merge_response="$(api_write PUT "$repo_api/pulls/$pr_number/merge" "$(jq -nc --arg sha "$head_sha" '{merge_method:"squash",sha:$sha,commit_title:"fix(security): enforce DAO proposal and delegate ownership",commit_message:"Narrow production authorization correction extracted from PR #61."}')")"
          jq -e '.merged == true' <<<"$merge_response" >/dev/null
          merge_sha="$(jq -r '.sha' <<<"$merge_response")"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]

          receipt_body="$(cat <<EOF_RECEIPT
          ## VETS DAO ownership correction merged

          - PR: #$pr_number
          - Exact audited head: \`$head_sha\`
          - CI run: \`$ci_run_id\` — success
          - Security run: \`$security_run_id\` — success
          - Codex comment: \`$codex_comment_id\` — no major issues
          - Scope: \`server/routers.ts\` only
          - Merge SHA: \`$merge_sha\`
          - Result: **MERGED / PRODUCTION SECURITY GATE CLOSED**

          Single-sided staking and binding/snapshot DAO governance remain approved deferred items. No production-host mutation occurred in this lane.
          EOF_RECEIPT
          )"
          api_write POST "$repo_api/issues/$TRACKER_ISSUE/comments" "$(jq -nc --arg body "$receipt_body" '{body:$body}')" >/dev/null

          jq -n \
            --argjson pr_number "$pr_number" \
            --arg head_sha "$head_sha" \
            --arg ci_run_id "$ci_run_id" \
            --arg security_run_id "$security_run_id" \
            --arg codex_comment_id "$codex_comment_id" \
            --arg merge_sha "$merge_sha" \
            '{pr_number:$pr_number,head_sha:$head_sha,ci_run_id:$ci_run_id,security_run_id:$security_run_id,codex_comment_id:$codex_comment_id,merge_sha:$merge_sha,merged:true}' \
            > evidence/dao-gate-merge.json
          cat evidence/dao-gate-merge.json

      - name: Upload immutable DAO gate receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dao-gate-merge-${{ github.event.pull_request.head.sha }}
          path: evidence
          retention-days: 14
          if-no-files-found: error
