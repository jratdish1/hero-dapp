name: One-shot HeroBase deployment monitor

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  monitor:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.event.pull_request.head.ref == 'ops/herobase-deploy-monitor-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 26d60888fe3410951f422cb7a68cee10661c2eaf
      CORRELATION_ID: issue-43-comment-5079810536
      FAILED_PRODUCTION_JOB_ID: '89707706379'

    steps:
      - name: Capture raw deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p monitor

          api_get() {
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }

          api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/vets-production-command.yml" \
            > monitor/owner-workflow.json
          owner_workflow_id="$(jq -r '.id' monitor/owner-workflow.json)"
          [[ "$owner_workflow_id" =~ ^[0-9]+$ ]]
          api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$owner_workflow_id/runs?event=issue_comment&branch=main&per_page=100" \
            > monitor/owner-runs.json

          owner_run_id="$(jq -r --arg sha "$TARGET_SHA" '
            [.workflow_runs[] | select(
              .head_sha == $sha and .head_branch == "main" and .event == "issue_comment"
            )] | sort_by(.id) | last.id // empty
          ' monitor/owner-runs.json)"
          if [[ "$owner_run_id" =~ ^[0-9]+$ ]]; then
            api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$owner_run_id" \
              > monitor/owner-run.json
            api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$owner_run_id/jobs?per_page=100" \
              > monitor/owner-jobs.json
          else
            printf '{"status":"not-found"}\n' > monitor/owner-run.json
            printf '{"jobs":[]}\n' > monitor/owner-jobs.json
          fi

          api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/43/comments?per_page=100" \
            > monitor/issue-43-comments.json
          api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml" \
            > monitor/ci-workflow.json
          ci_workflow_id="$(jq -r '.id' monitor/ci-workflow.json)"
          api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$ci_workflow_id/runs?branch=main&event=push&head_sha=$TARGET_SHA&per_page=100" \
            > monitor/ci-runs.json
          api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/security-and-quality.yml" \
            > monitor/security-workflow.json
          security_workflow_id="$(jq -r '.id' monitor/security-workflow.json)"
          api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$security_workflow_id/runs?branch=main&event=push&head_sha=$TARGET_SHA&per_page=100" \
            > monitor/security-runs.json

          curl --fail-with-body --silent --show-error --location \
            --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$FAILED_PRODUCTION_JOB_ID/logs" \
            > monitor/failed-production-job.log

          grep -E '^.*Missing required production secret: [A-Z0-9_]+.*$' \
            monitor/failed-production-job.log \
            | sed -E 's/^.*Missing required production secret: /Missing required production secret: /' \
            | sed -E 's/[[:cntrl:]]\[[0-9;]*[A-Za-z]//g' \
            | sort -u > monitor/missing-production-secrets.txt || true

          jq -n \
            --arg target_sha "$TARGET_SHA" \
            --arg correlation_id "$CORRELATION_ID" \
            --arg owner_run_id "${owner_run_id:-not-found}" \
            --arg missing_secrets "$(paste -sd ',' monitor/missing-production-secrets.txt)" \
            --slurpfile owner_run monitor/owner-run.json \
            --slurpfile owner_jobs monitor/owner-jobs.json \
            --slurpfile comments monitor/issue-43-comments.json \
            --slurpfile ci monitor/ci-runs.json \
            --slurpfile security monitor/security-runs.json \
            '{
              target_sha:$target_sha,
              correlation_id:$correlation_id,
              owner_run_id:$owner_run_id,
              owner_run:$owner_run[0],
              owner_jobs:$owner_jobs[0],
              missing_secret_lines:($missing_secrets | split(",") | map(select(length>0))),
              matching_ledger:[
                $comments[0][] | select(
                  (.body | contains($correlation_id)) or (.body | contains($target_sha))
                ) | {id,user:.user.login,created_at,body}
              ],
              ci_runs:$ci[0].workflow_runs,
              security_runs:$security[0].workflow_runs,
              observed_at:(now|todateiso8601)
            }' > monitor/summary.json

          jq . monitor/summary.json

      - name: Upload monitor receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: herobase-deploy-monitor-${{ github.event.pull_request.head.sha }}
          path: monitor
          retention-days: 7
          if-no-files-found: error
