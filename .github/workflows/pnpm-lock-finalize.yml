name: One-shot pnpm lock finalization

on:
  push:
    branches:
      - fix/security-high-vulns-2026-07-16
    paths:
      - .github/workflows/pnpm-lock-finalize.yml

permissions:
  contents: write

concurrency:
  group: pnpm-lock-finalize-pr40
  cancel-in-progress: false

jobs:
  finalize-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout authorized branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/security-high-vulns-2026-07-16
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Activate repository-pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          test "$(pnpm --version)" = "10.34.4"

      - name: Regenerate canonical lockfile without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts
          test ! -e package-lock.json

      - name: Validate frozen install and application
        shell: bash
        env:
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          pnpm audit --prod --audit-level=high
          node scripts/check-token-registry.mjs
          git diff --check
          node -e "const v=require('./node_modules/axios/package.json').version;if(v!=='1.18.0'){throw new Error('axios resolved to '+v)}"

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "pnpm-lock.yaml"
          grep -q "wouter@3.7.1" pnpm-lock.yaml
          grep -q "axios@1.18.0" pnpm-lock.yaml

      - name: Commit deterministic lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vets-lock-bot"
          git config user.email "vets-lock-bot@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(deps): finalize canonical pnpm lockfile"
          git push origin HEAD:fix/security-high-vulns-2026-07-16
