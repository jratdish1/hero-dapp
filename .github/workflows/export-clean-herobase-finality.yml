name: Export clean HeroBase finality workflow

on:
  push:
    branches:
      - ops/herobase-prod-finality-executor-20260727

permissions:
  contents: write

concurrency:
  group: export-clean-herobase-finality-workflow
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.ref == 'refs/heads/ops/herobase-prod-finality-executor-20260727' &&
      github.event.head_commit.message == 'chore: export clean HeroBase finality workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_B64_SHA256: b40fb5124a2a00a414ba265014f256a2ddbf37e320aec477ef254be34d709e49
      EXPECTED_WORKFLOW_SHA256: bde314bbb4a5b0b8f1f83d7b4739453a997e99caedb1dab66bad8689fb080dcd

    steps:
      - name: Checkout exact exporter head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Reconstruct, validate, and create exact workflow blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export-result
          cat ops/herobase-finality-bootstrap/workflow.b64.part* > export-result/workflow.b64
          test "$(sha256sum export-result/workflow.b64 | awk '{print $1}')" = "$EXPECTED_B64_SHA256"
          base64 -d export-result/workflow.b64 > export-result/temporary-herobase-production-finality.yml
          test "$(sha256sum export-result/temporary-herobase-production-finality.yml | awk '{print $1}')" = "$EXPECTED_WORKFLOW_SHA256"
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0])' export-result/temporary-herobase-production-finality.yml
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('export-result/temporary-herobase-production-finality.yml').read_text()
          forbidden=set('\u061c\u200e\u200f\u202a\u202b\u202c\u202d\u202e\u2066\u2067\u2068\u2069')
          credential=re.compile(r'BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}')
          if any(c in forbidden for c in text): raise SystemExit('hidden/bidirectional Unicode')
          if credential.search(text): raise SystemExit('credential-like material')
          required=['Temporary HeroBase production finality executor','VETS_CHATGPT_AUDIT v1','Protected HeroBase production finality','HEROBASE_PRODUCTION_FINAL_EVIDENCE_']
          for marker in required:
              if marker not in text: raise SystemExit(f'missing marker: {marker}')
          PY
          blob_sha="$(python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          from urllib.request import Request,urlopen
          content=Path('export-result/temporary-herobase-production-finality.yml').read_bytes()
          req=Request(
            f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs',
            data=json.dumps({'content':base64.b64encode(content).decode(),'encoding':'base64'}).encode(),
            method='POST',
            headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'VETS-HeroBase-Finality-Exporter'},
          )
          with urlopen(req,timeout=60) as response: print(json.loads(response.read())['sha'])
          PY
          )"
          [[ "$blob_sha" =~ ^[0-9a-f]{40}$ ]]
          jq -n --arg source_head "$GITHUB_SHA" --arg blob_sha "$blob_sha" --arg workflow_sha256 "$EXPECTED_WORKFLOW_SHA256" '{source_head:$source_head,blob_sha:$blob_sha,workflow_sha256:$workflow_sha256,validation:"PASS"}' > export-result/evidence.json
          printf 'VETS_HEROBASE_FINALITY_WORKFLOW_BLOB=%s\n' "$blob_sha"

      - name: Upload exporter evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clean-herobase-finality-workflow-${{ github.sha }}
          path: export-result
          retention-days: 7
          if-no-files-found: error
