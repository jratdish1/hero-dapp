name: vets-one-shot-pr64-cleanup-evidence

on:
  push:
    branches:
      - fix/production-ci-advisory-final-20260726
    paths:
      - .github/workflows/vets-one-shot-pr64-cleanup-evidence.yml

permissions:
  contents: write

concurrency:
  group: vets-one-shot-pr64-cleanup-evidence
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor == 'jratdish1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/production-ci-advisory-final-20260726
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact bounded correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check-generic-error-focus.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''    if (cleanupErrors.length > 0) primary.cleanupErrors = cleanupErrors;
          '''
          new = '''    if (cleanupErrors.length > 0) {
              const existingCleanupErrors = Array.isArray(primary.cleanupErrors)
                ? primary.cleanupErrors.map(value => String(value))
                : [];
              primary.cleanupErrors = [...existingCleanupErrors, ...cleanupErrors];
            }
          '''
          if text.count(old) != 1:
              raise SystemExit('FAIL-CLOSED: expected cleanup assignment was not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Validate exact change
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/check-generic-error-focus.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/check-generic-error-focus.mjs')
          text = path.read_text(encoding='utf-8')
          if re.search(r'[\u202a-\u202e\u2066-\u2069]', text):
              raise SystemExit('FAIL-CLOSED: hidden bidirectional Unicode found')
          if 'primary.cleanupErrors = cleanupErrors' in text:
              raise SystemExit('FAIL-CLOSED: replacing cleanup assignment remains')
          required = 'primary.cleanupErrors = [...existingCleanupErrors, ...cleanupErrors];'
          if text.count(required) != 1:
              raise SystemExit('FAIL-CLOSED: merged cleanup assignment missing or duplicated')
          PY
          changed="$(git diff --name-only)"
          test "$changed" = "scripts/check-generic-error-focus.mjs"

      - name: Commit correction and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/vets-one-shot-pr64-cleanup-evidence.yml
          git config user.name 'VETS GitHub automation'
          git config user.email 'jratdish1@users.noreply.github.com'
          git add scripts/check-generic-error-focus.mjs .github/workflows/vets-one-shot-pr64-cleanup-evidence.yml
          git diff --cached --check
          git commit -m 'fix: preserve startup and final cleanup evidence'
          git push origin HEAD:fix/production-ci-advisory-final-20260726
