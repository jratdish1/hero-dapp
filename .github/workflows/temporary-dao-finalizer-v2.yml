name: Temporary DAO one-file production finalizer v2

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: vets-dao-one-file-production-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.event.pull_request.number == 59 &&
      github.event.pull_request.head.ref == 'ops/herobase-deploy-monitor-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PATCH_BRANCH: fix/dao-ownership-production-final-20260726
      OLD_PATCH_BRANCH: fix/dao-ownership-production-20260726
      SOURCE_BLOB: 723d243880ee658b08af151902c32857ca7196c8
      TRACKER_ISSUE: '43'

    steps:
      - name: Publish, gate, audit, and expected-head squash merge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          repo_api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          owner="${GITHUB_REPOSITORY%%/*}"

          api_get() {
            local url="$1" response=""
            for attempt in $(seq 1 5); do
              if response="$(curl --fail-with-body --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$url")"; then
                printf '%s' "$response"; return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }
          api_write() {
            local method="$1" url="$2" payload="$3"
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 60 -X "$method" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" --data "$payload"
          }

          main_ref="$(api_get "$repo_api/git/ref/heads/main")"
          main_sha="$(jq -r '.object.sha' <<<"$main_ref")"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          main_source="$(api_get "$repo_api/contents/server/routers.ts?ref=$main_sha" | jq -r '.content' | tr -d '\n' | base64 -d)"
          if grep -Fq 'proposal.proposerId !== ctx.user.id' <<<"$main_source" &&
             grep -Fq 'delegate.userId !== ctx.user.id' <<<"$main_source"; then
            jq -n --arg main_sha "$main_sha" '{already_merged:true,main_sha:$main_sha}' > evidence/dao-finalizer.json
            exit 0
          fi

          source_blob="$(api_get "$repo_api/git/blobs/$SOURCE_BLOB")"
          source="$(jq -r '.content' <<<"$source_blob" | tr -d '\n' | base64 -d)"
          grep -Fq 'proposal.proposerId !== ctx.user.id' <<<"$source"
          grep -Fq 'delegate.userId !== ctx.user.id' <<<"$source"
          test "$(grep -Fc 'proposal.proposerId !== ctx.user.id' <<<"$source")" = '1'
          test "$(grep -Fc 'delegate.userId !== ctx.user.id' <<<"$source")" = '1'
          if grep -Eiq 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}' <<<"$source"; then exit 1; fi
          if LC_ALL=C grep -Pn '[\x{061C}\x{200E}\x{200F}\x{202A}-\x{202E}\x{2066}-\x{2069}]' <<<"$source"; then exit 1; fi

          main_commit="$(api_get "$repo_api/git/commits/$main_sha")"
          main_tree="$(jq -r '.tree.sha' <<<"$main_commit")"
          tree="$(api_write POST "$repo_api/git/trees" "$(jq -nc --arg base_tree "$main_tree" --arg blob "$SOURCE_BLOB" '{base_tree:$base_tree,tree:[{path:"server/routers.ts",mode:"100644",type:"blob",sha:$blob}]}')")"
          tree_sha="$(jq -r '.sha' <<<"$tree")"
          [[ "$tree_sha" =~ ^[0-9a-f]{40}$ ]]
          commit="$(api_write POST "$repo_api/git/commits" "$(jq -nc --arg tree "$tree_sha" --arg parent "$main_sha" '{message:"fix(security): enforce DAO proposal and delegate ownership",tree:$tree,parents:[$parent]}')")"
          head_sha="$(jq -r '.sha' <<<"$commit")"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]

          set +e
          branch_ref="$(api_get "$repo_api/git/ref/heads/$PATCH_BRANCH" 2>/dev/null)"
          branch_status=$?
          set -e
          if [ "$branch_status" -eq 0 ]; then
            existing_sha="$(jq -r '.object.sha' <<<"$branch_ref")"
            if [ "$existing_sha" != "$head_sha" ]; then
              compare="$(api_get "$repo_api/compare/$main_sha...$existing_sha")"
              status="$(jq -r '.status' <<<"$compare")"
              case "$status" in
                identical) api_write PATCH "$repo_api/git/refs/heads/$PATCH_BRANCH" "$(jq -nc --arg sha "$head_sha" '{sha:$sha,force:false}')" >/dev/null ;;
                ahead)
                  branch_source="$(api_get "$repo_api/contents/server/routers.ts?ref=$existing_sha" | jq -r '.content' | tr -d '\n' | base64 -d)"
                  grep -Fq 'proposal.proposerId !== ctx.user.id' <<<"$branch_source"
                  grep -Fq 'delegate.userId !== ctx.user.id' <<<"$branch_source"
                  head_sha="$existing_sha"
                  ;;
                *) echo "Unexpected patch branch state: $status" >&2; exit 74 ;;
              esac
            fi
          else
            api_write POST "$repo_api/git/refs" "$(jq -nc --arg ref "refs/heads/$PATCH_BRANCH" --arg sha "$head_sha" '{ref:$ref,sha:$sha}')" >/dev/null
          fi

          pulls="$(api_get "$repo_api/pulls?state=open&head=$owner:$PATCH_BRANCH&base=main&per_page=100")"
          if [ "$(jq -r 'length' <<<"$pulls")" = '0' ]; then
            body="$(cat <<'EOF_BODY'
          ## Mission

          One-file production security correction extracted from broad draft PR #61.

          ## Scope

          `server/routers.ts` only.

          ## Corrections

          - enforce proposal ownership before `dao.proposals.updateStatus`;
          - enforce delegate-record ownership before `dao.delegates.update`.

          Single-sided staking and binding/snapshot DAO governance remain approved deferred work. This PR fixes authorization defects only.

          Required: exact-head CI, Security and Quality, fresh Codex review, zero unresolved P0/P1/P2 findings, machine contract validation, and expected-head squash merge.
          EOF_BODY
          )"
            pr="$(api_write POST "$repo_api/pulls" "$(jq -nc --arg title 'fix(security): enforce DAO proposal and delegate ownership' --arg head "$PATCH_BRANCH" --arg body "$body" '{title:$title,head:$head,base:"main",draft:false,body:$body}')")"
          else
            test "$(jq -r 'length' <<<"$pulls")" = '1'
            pr="$(jq -c '.[0]' <<<"$pulls")"
            api_write PATCH "$repo_api/pulls/$(jq -r '.number' <<<"$pr")" '{"draft":false}' >/dev/null
          fi
          pr_number="$(jq -r '.number' <<<"$pr")"
          head_sha="$(api_get "$repo_api/pulls/$pr_number" | jq -r '.head.sha')"
          [[ "$pr_number" =~ ^[0-9]+$ ]]
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]

          files="$(api_get "$repo_api/pulls/$pr_number/files?per_page=100")"
          jq -e 'length == 1 and .[0].filename == "server/routers.ts"' <<<"$files" >/dev/null
          patch="$(jq -r '.[0].patch // empty' <<<"$files")"
          grep -Fq 'proposal.proposerId !== ctx.user.id' <<<"$patch"
          grep -Fq 'delegate.userId !== ctx.user.id' <<<"$patch"

          comments="$(api_get "$repo_api/issues/$pr_number/comments?per_page=100")"
          if ! jq -e 'any(.[]; .user.login == "jratdish1" and (.body | startswith("@codex review")))' <<<"$comments" >/dev/null; then
            review="@codex review

Perform a fresh exact-head review of $head_sha only. One-file production authorization correction. Report all P0/P1/P2 findings; do not modify code."
            api_write POST "$repo_api/issues/$pr_number/comments" "$(jq -nc --arg body "$review" '{body:$body}')" >/dev/null
          fi

          find_run() {
            local workflow_file="$1" job_name="$2" workflow_id runs run_id jobs
            workflow_id="$(api_get "$repo_api/actions/workflows/$workflow_file" | jq -r '.id')"
            runs="$(api_get "$repo_api/actions/workflows/$workflow_id/runs?branch=$PATCH_BRANCH&event=pull_request&head_sha=$head_sha&per_page=100")"
            run_id="$(jq -r --arg sha "$head_sha" '[.workflow_runs[]|select(.head_sha==$sha and .status=="completed" and .conclusion=="success")]|sort_by(.id)|last.id//empty' <<<"$runs")"
            [[ "$run_id" =~ ^[0-9]+$ ]] || return 1
            jobs="$(api_get "$repo_api/actions/runs/$run_id/jobs?per_page=100")"
            jq -e --arg name "$job_name" '[.jobs[]|select(.name==$name)]|length>0 and (max_by(.id)|.status=="completed" and .conclusion=="success")' <<<"$jobs" >/dev/null || return 1
            printf '%s' "$run_id"
          }

          ci_run=''; security_run=''; codex_comment=''
          for attempt in $(seq 1 120); do
            test "$(api_get "$repo_api/pulls/$pr_number" | jq -r '.head.sha')" = "$head_sha"
            ci_run="$(find_run ci.yml test-build-scan || true)"
            security_run="$(find_run security-and-quality.yml repository-safety || true)"
            comments="$(api_get "$repo_api/issues/$pr_number/comments?per_page=100")"
            short="${head_sha:0:10}"
            codex_comment="$(jq -r --arg short "$short" '[.[]|select(.user.login=="chatgpt-codex-connector[bot]" and (.body|contains($short)) and (((.body|ascii_downcase)|contains("no major issues")) or ((.body|ascii_downcase)|contains("didn\u0027t find any major issues"))))]|sort_by(.id)|last.id//empty' <<<"$comments")"
            if [[ "$ci_run" =~ ^[0-9]+$ ]] && [[ "$security_run" =~ ^[0-9]+$ ]] && [[ "$codex_comment" =~ ^[0-9]+$ ]]; then break; fi
            sleep 20
          done
          [[ "$ci_run" =~ ^[0-9]+$ ]]
          [[ "$security_run" =~ ^[0-9]+$ ]]
          [[ "$codex_comment" =~ ^[0-9]+$ ]]

          query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}'
          threads="$(api_write POST https://api.github.com/graphql "$(jq -nc --arg query "$query" --arg owner "$owner" --arg repo "${GITHUB_REPOSITORY#*/}" --argjson number "$pr_number" '{query:$query,variables:{owner:$owner,repo:$repo,number:$number}}')")"
          jq -e '.data.repository.pullRequest.reviewThreads.nodes|all(.isResolved==true)' <<<"$threads" >/dev/null

          audit_body="$(cat <<EOF_AUDIT
          ## ChatGPT exact-head production security audit — GRADE A

          - Exact head: \`$head_sha\`
          - Scope: \`server/routers.ts\` only
          - CI run: \`$ci_run\` — success
          - Security run: \`$security_run\` — success
          - Fresh Codex review comment: \`$codex_comment\` — no major issues
          - Unresolved review threads: **0**
          - Proposal ownership guard: **PASS**
          - Delegate ownership guard: **PASS**
          - Credential/hidden-Unicode scan: **PASS**
          - Critical / High / Medium / Low: **0 / 0 / 0 / 0**
          - **GRADE: A**
          - Decision: **EXPECTED-HEAD SQUASH MERGE AUTHORIZED**
          EOF_AUDIT
          )"
          api_write POST "$repo_api/issues/$pr_number/comments" "$(jq -nc --arg body "$audit_body" '{body:$body}')" >/dev/null

          merge="$(api_write PUT "$repo_api/pulls/$pr_number/merge" "$(jq -nc --arg sha "$head_sha" '{merge_method:"squash",sha:$sha,commit_title:"fix(security): enforce DAO proposal and delegate ownership",commit_message:"One-file production authorization correction."}')")"
          jq -e '.merged==true' <<<"$merge" >/dev/null
          merge_sha="$(jq -r '.sha' <<<"$merge")"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]

          for old_branch in "$OLD_PATCH_BRANCH"; do
            old="$(api_get "$repo_api/pulls?state=open&head=$owner:$old_branch&base=main&per_page=100")"
            while IFS= read -r old_pr; do
              [[ "$old_pr" =~ ^[0-9]+$ ]] || continue
              api_write PATCH "$repo_api/issues/$old_pr" "$(jq -nc --arg body 'CLOSED — superseded by the exact one-file production authorization correction. DO NOT MERGE.' '{state:"closed",body:$body}')" >/dev/null
            done < <(jq -r '.[].number' <<<"$old")
          done

          receipt="$(cat <<EOF_RECEIPT
          ## VETS DAO authorization correction complete

          - PR: #$pr_number
          - Exact audited head: \`$head_sha\`
          - Merge SHA: \`$merge_sha\`
          - Scope: one file, \`server/routers.ts\`
          - CI / Security / Codex / ChatGPT Grade A: **PASS**
          - Critical / High / Medium / Low: **0 / 0 / 0 / 0**
          - Result: **MERGED**

          Single-sided staking and binding/snapshot DAO governance remain approved deferred work.
          EOF_RECEIPT
          )"
          api_write POST "$repo_api/issues/$TRACKER_ISSUE/comments" "$(jq -nc --arg body "$receipt" '{body:$body}')" >/dev/null
          jq -n --argjson pr_number "$pr_number" --arg head_sha "$head_sha" --arg merge_sha "$merge_sha" --arg ci_run "$ci_run" --arg security_run "$security_run" --arg codex_comment "$codex_comment" '{pr_number:$pr_number,head_sha:$head_sha,merge_sha:$merge_sha,ci_run:$ci_run,security_run:$security_run,codex_comment:$codex_comment,grade:"A",merged:true}' > evidence/dao-finalizer.json

      - name: Upload immutable DAO finalizer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dao-finalizer-v2-${{ github.event.pull_request.head.sha }}
          path: evidence
          retention-days: 30
          if-no-files-found: error
