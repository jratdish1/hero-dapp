name: VETS owner-only production command

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  checks: read
  contents: read
  issues: write

concurrency:
  group: vets-production-command
  cancel-in-progress: false

jobs:
  dispatch-and-monitor:
    name: Validate, dispatch, and verify production release
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.event.issue.number == 43 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'VETS DEPLOY ')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      COMMAND: ${{ github.event.comment.body }}
      DEPLOY_WORKFLOW: deploy.yml
      TRACKER_ISSUE: '43'

    steps:
      - name: Validate owner command
        id: command
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "jratdish1/hero-dapp"
          if [[ ! "$COMMAND" =~ ^VETS[[:space:]]DEPLOY[[:space:]]([0-9a-f]{40})$ ]]; then
            echo "Command must be exactly: VETS DEPLOY <lowercase-40-character-SHA>" >&2
            exit 64
          fi
          target_sha="${BASH_REMATCH[1]}"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "Validated owner production command for $target_sha"

      - name: Require target to be current main
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | jq -r '.object.sha')"
          test "$main_sha" = "$TARGET_SHA"
          echo "Current main matches authorized SHA $TARGET_SHA"

      - name: Wait for exact-main release checks
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/check-runs?per_page=100")"

            failed=false
            pending=false
            for required_check in test-build-scan repository-safety; do
              state="$(jq -r --arg name "$required_check" --arg sha "$TARGET_SHA" '
                [.check_runs[] | select(
                  .name == $name and
                  .head_sha == $sha and
                  .app.slug == "github-actions"
                )]
                | if length == 0 then "missing"
                  else (max_by(.id) | if .status != "completed" then "pending" else (.conclusion // "unknown") end)
                  end
              ' <<<"$response")"

              case "$state" in
                success) ;;
                missing|pending) pending=true ;;
                *)
                  echo "Required check failed for $TARGET_SHA: $required_check = $state" >&2
                  failed=true
                  ;;
              esac
            done

            if [ "$failed" = true ]; then
              exit 65
            fi
            if [ "$pending" = false ]; then
              echo "Exact-main release checks are green for $TARGET_SHA"
              exit 0
            fi

            echo "Release checks pending (attempt $attempt/120)"
            sleep 15
          done

          echo "Timed out waiting for exact-main checks" >&2
          exit 70

      - name: Dispatch protected VPS1 deployment
        id: dispatch
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          dispatch_epoch="$(date -u +%s)"
          payload="$(jq -nc --arg sha "$TARGET_SHA" '{ref:"main",inputs:{commit_sha:$sha,confirmation:"DEPLOY"}}')"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$DEPLOY_WORKFLOW/dispatches" \
            --data "$payload"

          echo "dispatch_epoch=$dispatch_epoch" >> "$GITHUB_OUTPUT"
          echo "Protected deployment dispatched for $TARGET_SHA"

      - name: Locate protected deployment run
        id: locate
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
          DISPATCH_EPOCH: ${{ steps.dispatch.outputs.dispatch_epoch }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$DEPLOY_WORKFLOW/runs?event=workflow_dispatch&branch=main&per_page=30")"

            run_id="$(jq -r --arg sha "$TARGET_SHA" --argjson epoch "$DISPATCH_EPOCH" '
              [.workflow_runs[] | select(
                .head_sha == $sha and
                ((.created_at | fromdateiso8601) >= ($epoch - 5))
              )] | sort_by(.id) | last | .id // empty
            ' <<<"$response")"

            if [ -n "$run_id" ]; then
              run_url="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .html_url' <<<"$response")"
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
              echo "Located deployment run: $run_url"
              exit 0
            fi
            sleep 10
          done

          echo "Unable to locate dispatched deployment run" >&2
          exit 71

      - name: Post deployment-start receipt
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
          RUN_URL: ${{ steps.locate.outputs.run_url }}
        shell: bash
        run: |
          set -euo pipefail
          body="## VETS production deployment started

- Target SHA: \`$TARGET_SHA\`
- Protected workflow run: $RUN_URL
- Run ID: \`$RUN_ID\`
- State: **DISPATCHED / MONITORING**

The existing protected VPS1 workflow remains responsible for production-environment approval, exact-SHA checks, strict SSH, non-root deployment, rollback, Cloudflare purge, and live verification."
          payload="$(jq -nc --arg body "$body" '{body:$body}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE/comments" \
            --data "$payload" >/dev/null

      - name: Monitor protected deployment
        id: monitor
        env:
          RUN_ID: ${{ steps.locate.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 400); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
            status="$(jq -r '.status' <<<"$response")"
            conclusion="$(jq -r '.conclusion // "pending"' <<<"$response")"
            echo "Deployment status=$status conclusion=$conclusion attempt=$attempt/400"
            if [ "$status" = "completed" ]; then
              echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "Timed out monitoring deployment run $RUN_ID" >&2
          exit 72

      - name: Collect deployment receipt
        id: receipt
        if: always() && steps.locate.outputs.run_id != ''
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
          RUN_URL: ${{ steps.locate.outputs.run_url }}
          RUN_CONCLUSION: ${{ steps.monitor.outputs.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            > deployment-jobs.json

          deploy_ok="$(jq -r '[.jobs[].steps[]? | select(.name == "Deploy exact merged commit with frozen pnpm dependencies" and .conclusion == "success")] | length > 0' deployment-jobs.json)"
          purge_ok="$(jq -r '[.jobs[].steps[]? | select(.name == "Purge Cloudflare cache" and .conclusion == "success")] | length > 0' deployment-jobs.json)"
          verify_ok="$(jq -r '[.jobs[].steps[]? | select(.name == "Verify public deployment after purge" and .conclusion == "success")] | length > 0' deployment-jobs.json)"
          rollback_ran="$(jq -r '[.jobs[].steps[]? | select(.name == "Roll back application after post-deploy failure" and .conclusion == "success")] | length > 0' deployment-jobs.json)"

          verified=false
          if [ "$RUN_CONCLUSION" = "success" ] && [ "$deploy_ok" = true ] && [ "$purge_ok" = true ] && [ "$verify_ok" = true ] && [ "$rollback_ran" = false ]; then
            verified=true
          fi
          echo "verified=$verified" >> "$GITHUB_OUTPUT"

          {
            echo "## VETS production deployment receipt"
            echo
            echo "- Target SHA: \`$TARGET_SHA\`"
            echo "- Protected workflow run: $RUN_URL"
            echo "- Run ID: \`$RUN_ID\`"
            echo "- Run conclusion: **${RUN_CONCLUSION:-unknown}**"
            echo "- Exact-SHA application deploy: **$deploy_ok**"
            echo "- Cloudflare purge: **$purge_ok**"
            echo "- Public post-purge verification: **$verify_ok**"
            echo "- Rollback executed: **$rollback_ran**"
            echo "- Deployment verified: **$verified**"
            echo
            echo "### Job and step conclusions"
            jq -r '.jobs[] | "- Job: **\(.name)** — \(.status) / \(.conclusion)\n" + ((.steps // []) | map("  - \(.name): \(.status) / \(.conclusion)") | join("\n"))' deployment-jobs.json
          } > deployment-receipt.md
          cat deployment-receipt.md

      - name: Upload deployment receipt
        if: always() && steps.locate.outputs.run_id != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-deployment-receipt-${{ steps.command.outputs.target_sha }}
          path: |
            deployment-receipt.md
            deployment-jobs.json
          retention-days: 30
          if-no-files-found: error

      - name: Post final deployment receipt
        if: always()
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
          RUN_URL: ${{ steps.locate.outputs.run_url }}
          RUN_CONCLUSION: ${{ steps.monitor.outputs.conclusion }}
          VERIFIED: ${{ steps.receipt.outputs.verified }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f deployment-receipt.md ]; then
            body="$(cat deployment-receipt.md)"
          else
            body="## VETS production deployment receipt

- Target SHA: \`${TARGET_SHA:-unknown}\`
- Protected workflow run: ${RUN_URL:-not located}
- Run ID: \`${RUN_ID:-not located}\`
- Run conclusion: **${RUN_CONCLUSION:-unknown}**
- Deployment verified: **${VERIFIED:-false}**

The command lane did not obtain a complete deployment receipt."
          fi
          payload="$(jq -nc --arg body "$body" '{body:$body}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE/comments" \
            --data "$payload" >/dev/null

      - name: Enforce verified deployment
        if: always()
        env:
          VERIFIED: ${{ steps.receipt.outputs.verified }}
        shell: bash
        run: |
          test "$VERIFIED" = "true"
