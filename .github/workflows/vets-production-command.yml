name: VETS owner-only production command

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  checks: read
  contents: read
  issues: write

jobs:
  authorize:
    name: Validate immutable owner command
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.event.issue.number == 43 &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.triggering_actor == github.repository_owner &&
      github.run_attempt == 1 &&
      startsWith(github.event.comment.body, 'VETS DEPLOY ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-command-${{ github.event.comment.id }}
      cancel-in-progress: false
    outputs:
      target_sha: ${{ steps.command.outputs.target_sha }}
      correlation_id: ${{ steps.command.outputs.correlation_id }}
      command_comment_id: ${{ steps.command.outputs.command_comment_id }}
      command_run_id: ${{ steps.command.outputs.command_run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      COMMAND: ${{ github.event.comment.body }}
      COMMAND_COMMENT_ID: ${{ github.event.comment.id }}
      TRACKER_ISSUE: '43'
      DEPLOY_WORKFLOW: deploy.yml

    steps:
      - name: Parse exact owner command
        id: command
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "jratdish1/hero-dapp"
          test "$GITHUB_TRIGGERING_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          [[ "$COMMAND_COMMENT_ID" =~ ^[0-9]+$ ]]
          if [[ ! "$COMMAND" =~ ^VETS[[:space:]]DEPLOY[[:space:]]([0-9a-f]{40})$ ]]; then
            echo "Command must be exactly: VETS DEPLOY <lowercase-40-character-current-main-SHA>" >&2
            exit 64
          fi
          target_sha="${BASH_REMATCH[1]}"
          correlation_id="issue-43-comment-$COMMAND_COMMENT_ID"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "correlation_id=$correlation_id" >> "$GITHUB_OUTPUT"
          echo "command_comment_id=$COMMAND_COMMENT_ID" >> "$GITHUB_OUTPUT"
          echo "command_run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Verify immutable comment and workflow provenance
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
          CORRELATION_ID: ${{ steps.command.outputs.correlation_id }}
        shell: bash
        run: |
          set -euo pipefail
          api_get() {
            local url="$1" response=""
            for attempt in $(seq 1 5); do
              if response="$(curl --fail-with-body --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$url")"; then
                printf '%s' "$response"
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          issue="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE")"
          test "$(jq -r '.state' <<<"$issue")" = "open"

          comment="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/comments/$COMMAND_COMMENT_ID")"
          test "$(jq -r '.issue_url' <<<"$comment")" = \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE"
          test "$(jq -r '.user.login' <<<"$comment")" = "$GITHUB_REPOSITORY_OWNER"
          test "$(jq -r '.author_association' <<<"$comment")" = "OWNER"
          test "$(jq -r '.body' <<<"$comment")" = "VETS DEPLOY $TARGET_SHA"

          run="$(api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          test "$(jq -r '.event' <<<"$run")" = "issue_comment"
          test "$(jq -r '.run_attempt' <<<"$run")" = "1"
          test "$(jq -r '.actor.login' <<<"$run")" = "$GITHUB_REPOSITORY_OWNER"
          test "$(jq -r '.triggering_actor.login' <<<"$run")" = "$GITHUB_REPOSITORY_OWNER"
          test "$(jq -r '.head_branch' <<<"$run")" = "main"
          test "$(jq -r '.head_sha' <<<"$run")" = "$TARGET_SHA"

          main_sha="$(api_get \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | jq -r '.object.sha')"
          test "$main_sha" = "$TARGET_SHA"

          comments="$(api_get \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE/comments?per_page=100")"
          consumed="$(jq -r --arg correlation "$CORRELATION_ID" '
            [.[] | select(
              .user.login == "github-actions[bot]" and
              (.body | startswith("VETS_DEPLOY_CONSUMED v1\n")) and
              (.body | contains("correlation_id: " + $correlation + "\n"))
            )] | length
          ' <<<"$comments")"
          test "$consumed" = "0"

      - name: Require successful exact-main release workflows
        env:
          TARGET_SHA: ${{ steps.command.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          api_get() {
            local url="$1" response=""
            for attempt in $(seq 1 5); do
              if response="$(curl --fail-with-body --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$url")"; then
                printf '%s' "$response"
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          require_workflow_run() {
            local workflow_file="$1" required_job="$2"
            local workflow_id runs trusted_run run_id jobs
            workflow_id="$(api_get \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file" \
              | jq -r '.id')"
            [[ "$workflow_id" =~ ^[0-9]+$ ]]
            runs="$(api_get \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?branch=main&event=push&head_sha=$TARGET_SHA&per_page=100")"
            trusted_run="$(jq -c --arg sha "$TARGET_SHA" '
              [.workflow_runs[] | select(
                .head_sha == $sha and .head_branch == "main" and .event == "push"
              )] | sort_by(.id) | last // empty
            ' <<<"$runs")"
            test -n "$trusted_run"
            jq -e '.status == "completed" and .conclusion == "success"' \
              <<<"$trusted_run" >/dev/null
            run_id="$(jq -r '.id' <<<"$trusted_run")"
            jobs="$(api_get \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
            jq -e --arg name "$required_job" '
              [.jobs[] | select(.name == $name)]
              | if length == 0 then false
                else (max_by(.id) | .status == "completed" and .conclusion == "success")
                end
            ' <<<"$jobs" >/dev/null
          }

          require_workflow_run ci.yml test-build-scan
          require_workflow_run security-and-quality.yml repository-safety

  deploy:
    name: Execute protected production workflow
    needs: authorize
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
    uses: ./.github/workflows/deploy.yml
    with:
      commit_sha: ${{ needs.authorize.outputs.target_sha }}
      correlation_id: ${{ needs.authorize.outputs.correlation_id }}
      operation: deploy
      confirmation: DEPLOY
      command_comment_id: ${{ needs.authorize.outputs.command_comment_id }}
      command_run_id: ${{ needs.authorize.outputs.command_run_id }}
    secrets: inherit
