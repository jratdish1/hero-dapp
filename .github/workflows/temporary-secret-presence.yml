name: Temporary non-value credential route inventory

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  inventory:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.event.pull_request.number == 59 &&
      github.event.pull_request.head.ref == 'ops/herobase-deploy-monitor-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
      VDS_HOST: ${{ secrets.VDS_HOST }}
      VDS_USER: ${{ secrets.VDS_USER }}
      VPS1_SSH_KEY: ${{ secrets.VPS1_SSH_KEY }}
      VPS1_HOST: ${{ secrets.VPS1_HOST }}
      VPS1_USER: ${{ secrets.VPS1_USER }}
      VPS1_KNOWN_HOSTS: ${{ secrets.VPS1_KNOWN_HOSTS }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      ADMIN_PAT: ${{ secrets.ADMIN_PAT }}
    steps:
      - name: Report only available secret names
        shell: bash
        run: |
          set -euo pipefail
          names=(
            VDS_SSH_KEY VDS_HOST VDS_USER
            VPS1_SSH_KEY VPS1_HOST VPS1_USER VPS1_KNOWN_HOSTS
            CF_API_TOKEN CF_ZONE_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_ID
            GH_PAT ADMIN_PAT
          )
          present=()
          missing=()
          for name in "${names[@]}"; do
            if [ -n "${!name:-}" ]; then
              present+=("$name")
            else
              missing+=("$name")
            fi
          done
          printf 'PRESENT_NAMES=%s\n' "${present[*]:-none}"
          printf 'MISSING_NAMES=%s\n' "${missing[*]:-none}"
          printf 'No secret values were printed.\n'
