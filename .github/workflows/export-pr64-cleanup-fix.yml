name: Export PR64 cleanup-failure correction

on:
  push:
    branches:
      - fix/production-ci-advisory-final-20260726

permissions:
  contents: write
  issues: write

concurrency:
  group: export-pr64-cleanup-fix
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.ref == 'refs/heads/fix/production-ci-advisory-final-20260726' &&
      github.event.head_commit.message == 'chore: export PR64 cleanup fix receipt'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/production-ci-advisory-final-20260726
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Build, validate, and export exact correction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pr64-cleanup-fix
          python3 <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          from urllib.request import Request, urlopen

          source_path = Path('scripts/check-generic-error-focus.mjs')
          source = source_path.read_text()
          old = '''      if (!(error instanceof ChromeStartupError)) throw error;
                lastError = error;
          '''
          new = '''      if (!(error instanceof ChromeStartupError)) throw error;
                if (Array.isArray(error.cleanupErrors) && error.cleanupErrors.length > 0) {
                  throw error;
                }
                lastError = error;
          '''
          if source.count(old) != 1:
              raise RuntimeError(f'expected one retry block, found {source.count(old)}')
          corrected = source.replace(old, new, 1)
          output = Path('pr64-cleanup-fix/check-generic-error-focus.mjs')
          output.write_text(corrected)

          subprocess.run(['node', '--check', str(output)], check=True)

          forbidden = set('\u061c\u200e\u200f\u202a\u202b\u202c\u202d\u202e\u2066\u2067\u2068\u2069')
          credential = re.compile(r'BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}')
          if any(char in forbidden for char in corrected):
              raise RuntimeError('hidden or bidirectional Unicode found')
          if credential.search(corrected):
              raise RuntimeError('credential pattern found')
          required = 'Array.isArray(error.cleanupErrors) && error.cleanupErrors.length > 0'
          if corrected.count(required) != 1:
              raise RuntimeError('fatal startup cleanup gate missing')

          payload = json.dumps({
              'content': base64.b64encode(corrected.encode()).decode(),
              'encoding': 'base64',
          }).encode()
          request = Request(
              f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs',
              data=payload,
              method='POST',
              headers={
                  'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'VETS-PR64-Cleanup-Exporter',
              },
          )
          with urlopen(request, timeout=60) as response:
              blob_sha = json.loads(response.read())['sha']
          if not re.fullmatch(r'[0-9a-f]{40}', blob_sha):
              raise RuntimeError('invalid blob SHA')

          evidence = {
              'source_head': os.environ['GITHUB_SHA'],
              'blob_sha': blob_sha,
              'validation': 'PASS',
              'behavior': 'Chrome startup cleanup failures are fatal and cannot be retried away',
          }
          Path('pr64-cleanup-fix/evidence.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(f'VETS_PR64_GENERIC_FOCUS_BLOB={blob_sha}')
          PY

      - name: Upload exact validated correction
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr64-cleanup-fix-${{ github.sha }}
          path: pr64-cleanup-fix
          retention-days: 7
          if-no-files-found: error

      - name: Post exact blob receipt
        shell: bash
        run: |
          set -euo pipefail
          blob_sha="$(jq -r '.blob_sha' pr64-cleanup-fix/evidence.json)"
          [[ "$blob_sha" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' \
            'VETS_PR64_CLEANUP_FIX v1' \
            "source_head: $GITHUB_SHA" \
            "blob_sha: $blob_sha" \
            'validation: PASS' \
            'behavior: startup cleanup failure is fatal and cannot be retried away' \
            > pr64-cleanup-fix/receipt.txt
          gh issue comment 64 --repo "$GITHUB_REPOSITORY" --body-file pr64-cleanup-fix/receipt.txt
