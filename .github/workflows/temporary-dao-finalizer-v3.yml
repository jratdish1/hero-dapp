name: Temporary DAO one-file production finalizer v3

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: vets-dao-one-file-production-finalizer-v3
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.event.pull_request.number == 59 &&
      github.event.pull_request.head.ref == 'ops/herobase-deploy-monitor-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PATCH_BRANCH: fix/dao-ownership-production-final-v3-20260726
      SOURCE_BLOB: 723d243880ee658b08af151902c32857ca7196c8
      TRACKER_ISSUE: '43'
      CHATGPT_AUTH_BODY: |-
        VETS_CHATGPT_AUDIT_AUTHORIZATION_CURRENT_HEAD v1
        branch: fix/dao-ownership-production-final-v3-20260726
        grade: A
        decision: expected-head-squash-merge

    steps:
      - name: Publish exact one-file PR and require machine gates
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          repo_api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          owner="${GITHUB_REPOSITORY%%/*}"
          api_get(){ local u="$1" r=""; for a in $(seq 1 5); do if r="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$u")"; then printf '%s' "$r"; return 0; fi; sleep $((a*2)); done; return 1; }
          api_write(){ local m="$1" u="$2" p="$3"; curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 60 -X "$m" -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -H 'X-GitHub-Api-Version: 2022-11-28' "$u" --data "$p"; }

          main_sha="$(api_get "$repo_api/git/ref/heads/main" | jq -r '.object.sha')"; [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          main_source="$(api_get "$repo_api/contents/server/routers.ts?ref=$main_sha" | jq -r '.content' | tr -d '\n' | base64 -d)"
          if grep -Fq 'proposal.proposerId !== ctx.user.id' <<<"$main_source" && grep -Fq 'delegate.userId !== ctx.user.id' <<<"$main_source"; then
            echo "already_merged=true" >> "$GITHUB_OUTPUT"; echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"; jq -n --arg main_sha "$main_sha" '{already_merged:true,main_sha:$main_sha}' > evidence/dao-machine-gate-v3.json; exit 0
          fi

          blob="$(api_get "$repo_api/git/blobs/$SOURCE_BLOB")"; source="$(jq -r '.content' <<<"$blob" | tr -d '\n' | base64 -d)"
          test "$(grep -Fc 'proposal.proposerId !== ctx.user.id' <<<"$source")" = 1; test "$(grep -Fc 'delegate.userId !== ctx.user.id' <<<"$source")" = 1
          ! grep -Eiq 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}' <<<"$source"
          ! LC_ALL=C grep -Pn '[\x{061C}\x{200E}\x{200F}\x{202A}-\x{202E}\x{2066}-\x{2069}]' <<<"$source"
          main_tree="$(api_get "$repo_api/git/commits/$main_sha" | jq -r '.tree.sha')"
          tree_sha="$(api_write POST "$repo_api/git/trees" "$(jq -nc --arg b "$main_tree" --arg s "$SOURCE_BLOB" '{base_tree:$b,tree:[{path:"server/routers.ts",mode:"100644",type:"blob",sha:$s}]}')" | jq -r '.sha')"; [[ "$tree_sha" =~ ^[0-9a-f]{40}$ ]]
          head_sha="$(api_write POST "$repo_api/git/commits" "$(jq -nc --arg t "$tree_sha" --arg p "$main_sha" '{message:"fix(security): enforce DAO proposal and delegate ownership",tree:$t,parents:[$p]}')" | jq -r '.sha')"; [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          set +e; ref="$(api_get "$repo_api/git/ref/heads/$PATCH_BRANCH" 2>/dev/null)"; rs=$?; set -e
          if [ "$rs" -eq 0 ]; then
            current="$(jq -r '.object.sha' <<<"$ref")"; branch_source="$(api_get "$repo_api/contents/server/routers.ts?ref=$current" | jq -r '.content' | tr -d '\n' | base64 -d)"
            if grep -Fq 'proposal.proposerId !== ctx.user.id' <<<"$branch_source" && grep -Fq 'delegate.userId !== ctx.user.id' <<<"$branch_source"; then head_sha="$current"; else test "$current" = "$main_sha"; api_write PATCH "$repo_api/git/refs/heads/$PATCH_BRANCH" "$(jq -nc --arg sha "$head_sha" '{sha:$sha,force:false}')" >/dev/null; fi
          else api_write POST "$repo_api/git/refs" "$(jq -nc --arg r "refs/heads/$PATCH_BRANCH" --arg s "$head_sha" '{ref:$r,sha:$s}')" >/dev/null; fi

          pulls="$(api_get "$repo_api/pulls?state=open&head=$owner:$PATCH_BRANCH&base=main&per_page=100")"
          if [ "$(jq -r length <<<"$pulls")" = 0 ]; then
            body='## Mission

One-file production security correction extracted from broad draft PR #61.

## Scope

`server/routers.ts` only.

## Corrections

- enforce proposal ownership before `dao.proposals.updateStatus`;
- enforce delegate-record ownership before `dao.delegates.update`.

Single-sided staking and binding/snapshot DAO governance remain approved deferred work. No deployment occurs in this PR.'
            pr="$(api_write POST "$repo_api/pulls" "$(jq -nc --arg h "$PATCH_BRANCH" --arg b "$body" '{title:"fix(security): enforce DAO proposal and delegate ownership",head:$h,base:"main",draft:false,body:$b}')")"
          else test "$(jq -r length <<<"$pulls")" = 1; pr="$(jq -c '.[0]' <<<"$pulls")"; api_write PATCH "$repo_api/pulls/$(jq -r .number <<<"$pr")" '{"draft":false}' >/dev/null; fi
          pr_number="$(jq -r .number <<<"$pr")"; head_sha="$(api_get "$repo_api/pulls/$pr_number" | jq -r '.head.sha')"; [[ "$pr_number" =~ ^[0-9]+$ ]]; [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          files="$(api_get "$repo_api/pulls/$pr_number/files?per_page=100")"; jq -e 'length==1 and .[0].filename=="server/routers.ts"' <<<"$files" >/dev/null; patch="$(jq -r '.[0].patch//empty' <<<"$files")"; grep -Fq 'proposal.proposerId !== ctx.user.id' <<<"$patch"; grep -Fq 'delegate.userId !== ctx.user.id' <<<"$patch"
          comments="$(api_get "$repo_api/issues/$pr_number/comments?per_page=100")"; if ! jq -e 'any(.[];.user.login=="jratdish1" and (.body|startswith("@codex review")))' <<<"$comments" >/dev/null; then api_write POST "$repo_api/issues/$pr_number/comments" "$(jq -nc --arg body "@codex review

Review exact head $head_sha only. One-file authorization correction. Report every P0/P1/P2 finding; do not modify code." '{body:$body}')" >/dev/null; fi
          find_run(){ local wf="$1" job="$2" wid runs rid jobs; wid="$(api_get "$repo_api/actions/workflows/$wf"|jq -r .id)"; runs="$(api_get "$repo_api/actions/workflows/$wid/runs?branch=$PATCH_BRANCH&event=pull_request&head_sha=$head_sha&per_page=100")"; rid="$(jq -r --arg s "$head_sha" '[.workflow_runs[]|select(.head_sha==$s and .status=="completed" and .conclusion=="success")]|sort_by(.id)|last.id//empty' <<<"$runs")"; [[ "$rid" =~ ^[0-9]+$ ]]||return 1; jobs="$(api_get "$repo_api/actions/runs/$rid/jobs?per_page=100")"; jq -e --arg n "$job" '[.jobs[]|select(.name==$n)]|length>0 and (max_by(.id)|.status=="completed" and .conclusion=="success")' <<<"$jobs" >/dev/null||return 1; printf %s "$rid"; }
          ci=''; sec=''; codex=''
          for a in $(seq 1 150); do test "$(api_get "$repo_api/pulls/$pr_number"|jq -r '.head.sha')" = "$head_sha"; ci="$(find_run ci.yml test-build-scan||true)"; sec="$(find_run security-and-quality.yml repository-safety||true)"; comments="$(api_get "$repo_api/issues/$pr_number/comments?per_page=100")"; short="${head_sha:0:10}"; codex="$(jq -r --arg s "$short" '[.[]|select(.user.login=="chatgpt-codex-connector[bot]" and (.body|contains($s)) and ((.body|ascii_downcase)|contains("major issues")))]|sort_by(.id)|last.id//empty' <<<"$comments")"; if [[ "$ci" =~ ^[0-9]+$ ]]&&[[ "$sec" =~ ^[0-9]+$ ]]&&[[ "$codex" =~ ^[0-9]+$ ]]; then break; fi; sleep 20; done
          [[ "$ci" =~ ^[0-9]+$ ]]; [[ "$sec" =~ ^[0-9]+$ ]]; [[ "$codex" =~ ^[0-9]+$ ]]
          query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}'
          threads="$(api_write POST https://api.github.com/graphql "$(jq -nc --arg q "$query" --arg o "$owner" --arg r "${GITHUB_REPOSITORY#*/}" --argjson n "$pr_number" '{query:$q,variables:{owner:$o,repo:$r,number:$n}}')")"; jq -e '.data.repository.pullRequest.reviewThreads.nodes|all(.isResolved==true)' <<<"$threads" >/dev/null
          machine="$(printf 'VETS_DAO_MACHINE_GATE v1\nbranch: %s\npr_number: %s\nexact_head: %s\nci_run_id: %s\nsecurity_run_id: %s\ncodex_comment_id: %s\nunresolved_threads: 0\nstate: awaiting-chatgpt-authorization\n' "$PATCH_BRANCH" "$pr_number" "$head_sha" "$ci" "$sec" "$codex")"
          pr_gate="$(api_write POST "$repo_api/issues/$pr_number/comments" "$(jq -nc --arg body "$machine" '{body:$body}')")"; tracker_gate="$(api_write POST "$repo_api/issues/$TRACKER_ISSUE/comments" "$(jq -nc --arg body "$machine" '{body:$body}')")"; gate_id="$(jq -r .id <<<"$tracker_gate")"; [[ "$gate_id" =~ ^[0-9]+$ ]]
          echo "already_merged=false" >> "$GITHUB_OUTPUT"; echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"; echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"; echo "ci_run_id=$ci" >> "$GITHUB_OUTPUT"; echo "security_run_id=$sec" >> "$GITHUB_OUTPUT"; echo "codex_comment_id=$codex" >> "$GITHUB_OUTPUT"; echo "machine_gate_comment_id=$gate_id" >> "$GITHUB_OUTPUT"
          jq -n --argjson pr "$pr_number" --arg head "$head_sha" --arg ci "$ci" --arg security "$sec" --arg codex "$codex" --argjson gate "$gate_id" '{pr_number:$pr,head_sha:$head,ci_run_id:$ci,security_run_id:$security,codex_comment_id:$codex,machine_gate_comment_id:$gate,machine_gate:"PASS"}' > evidence/dao-machine-gate-v3.json

      - name: Require external ChatGPT authorization and merge exact head
        if: steps.gate.outputs.already_merged != 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          MACHINE_GATE_ID: ${{ steps.gate.outputs.machine_gate_comment_id }}
        run: |
          set -euo pipefail
          repo_api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          api_get(){ curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$1"; }
          api_write(){ curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 60 -X "$1" -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -H 'X-GitHub-Api-Version: 2022-11-28' "$2" --data "$3"; }
          auth_id=''
          for a in $(seq 1 180); do
            comments="$(api_get "$repo_api/issues/$TRACKER_ISSUE/comments?per_page=100&page=1")"
            # The ledger is still small; fail closed if it reaches one page.
            test "$(jq -r length <<<"$comments")" -lt 100
            auth_id="$(jq -r --arg body "$CHATGPT_AUTH_BODY" --argjson min "$MACHINE_GATE_ID" '[.[]|select(.id>$min and .user.login=="jratdish1" and .author_association=="OWNER" and .body==$body)]|sort_by(.id)|last.id//empty' <<<"$comments")"
            [[ "$auth_id" =~ ^[0-9]+$ ]] && break
            sleep 20
          done
          [[ "$auth_id" =~ ^[0-9]+$ ]]
          test "$(api_get "$repo_api/pulls/$PR_NUMBER"|jq -r '.head.sha')" = "$HEAD_SHA"
          receipt="$(printf 'VETS_CHATGPT_GRADE_A_BOUND v1\nexact_head: %s\nauthorization_comment_id: %s\ngrade: A\ndecision: expected-head-squash-merge\n' "$HEAD_SHA" "$auth_id")"
          api_write POST "$repo_api/issues/$PR_NUMBER/comments" "$(jq -nc --arg body "$receipt" '{body:$body}')" >/dev/null
          merge="$(api_write PUT "$repo_api/pulls/$PR_NUMBER/merge" "$(jq -nc --arg sha "$HEAD_SHA" '{merge_method:"squash",sha:$sha,commit_title:"fix(security): enforce DAO proposal and delegate ownership",commit_message:"One-file production authorization correction."}')")"; jq -e '.merged==true' <<<"$merge" >/dev/null; merge_sha="$(jq -r .sha <<<"$merge")"; [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]
          result="$(cat <<EOF
## VETS DAO authorization correction complete

- PR: #$PR_NUMBER
- Exact audited head: \`$HEAD_SHA\`
- ChatGPT authorization comment: \`$auth_id\`
- Merge SHA: \`$merge_sha\`
- Scope: \`server/routers.ts\` only
- Machine gates and external ChatGPT Grade A: **PASS**
- Result: **MERGED**

Single-sided staking and binding/snapshot DAO governance remain approved deferred work.
EOF
)"
          api_write POST "$repo_api/issues/$TRACKER_ISSUE/comments" "$(jq -nc --arg body "$result" '{body:$body}')" >/dev/null
          jq -n --arg head "$HEAD_SHA" --arg merge "$merge_sha" --arg auth "$auth_id" '{head_sha:$head,merge_sha:$merge,chatgpt_authorization_comment_id:$auth,grade:"A",merged:true}' > evidence/dao-merge-v3.json

      - name: Upload immutable DAO v3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dao-finalizer-v3-${{ github.event.pull_request.head.sha }}
          path: evidence
          retention-days: 30
          if-no-files-found: error
