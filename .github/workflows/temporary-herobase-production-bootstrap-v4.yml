name: Temporary idempotent HeroBase production bootstrap v4

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: temporary-herobase-production-bootstrap-v4
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.event.pull_request.number == 59 &&
      github.event.pull_request.head.ref == 'ops/herobase-deploy-monitor-20260725' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      execute: ${{ steps.gate.outputs.execute }}
      script_sha256: ${{ steps.gate.outputs.script_sha256 }}
      base_script_sha256: ${{ steps.gate.outputs.base_script_sha256 }}
    steps:
      - name: Checkout exact monitor head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ops/herobase-deploy-monitor-20260725
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Validate exact owner execution gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          expected='VETS EXECUTE HEROBASE BOOTSTRAP V4 26d60888fe3410951f422cb7a68cee10661c2eaf'
          trigger=''
          [ -f ops/herobase-bootstrap-v4.trigger ] && trigger="$(cat ops/herobase-bootstrap-v4.trigger)"
          commit_message="$(git log -1 --pretty=%s)"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$GITHUB_TRIGGERING_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          bash -n ops/herobase-production-bootstrap-v4.sh
          bash -n ops/herobase-production-bootstrap.sh
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0])' .github/workflows/temporary-herobase-production-bootstrap-v4.yml
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('ops/herobase-production-bootstrap-v4.sh'),
              Path('ops/herobase-production-bootstrap.sh'),
              Path('.github/workflows/temporary-herobase-production-bootstrap-v4.yml'),
          ]
          forbidden = set('\u061c\u200e\u200f\u202a\u202b\u202c\u202d\u202e\u2066\u2067\u2068\u2069')
          credential = re.compile(r'BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}')
          for path in paths:
              text = path.read_text()
              if any(ch in forbidden for ch in text):
                  raise SystemExit(f'{path}: hidden/bidirectional Unicode')
              if credential.search(text):
                  raise SystemExit(f'{path}: credential-like material')
          PY
          script_sha256="$(sha256sum ops/herobase-production-bootstrap-v4.sh | awk '{print $1}')"
          base_script_sha256="$(sha256sum ops/herobase-production-bootstrap.sh | awk '{print $1}')"
          [[ "$script_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$base_script_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "script_sha256=$script_sha256" >> "$GITHUB_OUTPUT"
          echo "base_script_sha256=$base_script_sha256" >> "$GITHUB_OUTPUT"
          if [ "$trigger" = "$expected" ] && [ "$commit_message" = "$expected" ]; then
            echo 'execute=true' >> "$GITHUB_OUTPUT"
          else
            echo 'execute=false' >> "$GITHUB_OUTPUT"
          fi

  bootstrap:
    name: Protected HeroBase bootstrap v4 mutation
    needs: authorize
    if: needs.authorize.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment: production
    env:
      VDS_HOST: ${{ secrets.VDS_HOST }}
      VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
      VPS1_HOST: ${{ secrets.VPS1_HOST }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      TARGET_SHA: 26d60888fe3410951f422cb7a68cee10661c2eaf
      EXPECTED_VDS_ED25519_FINGERPRINT: SHA256:EdmFXzo/0Tw9jlbH+tNfBGcRGDf1TQu8m0LWiobRXFY
      REPOSITORY_NAME: jratdish1/hero-dapp

    steps:
      - name: Checkout exact armed head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ops/herobase-deploy-monitor-20260725
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Revalidate immutable bootstrap scripts
        shell: bash
        env:
          AUTHORIZED_SCRIPT_SHA256: ${{ needs.authorize.outputs.script_sha256 }}
          AUTHORIZED_BASE_SCRIPT_SHA256: ${{ needs.authorize.outputs.base_script_sha256 }}
        run: |
          set -euo pipefail
          actual="$(sha256sum ops/herobase-production-bootstrap-v4.sh | awk '{print $1}')"
          base_actual="$(sha256sum ops/herobase-production-bootstrap.sh | awk '{print $1}')"
          test "$actual" = "$AUTHORIZED_SCRIPT_SHA256"
          test "$base_actual" = "$AUTHORIZED_BASE_SCRIPT_SHA256"
          bash -n ops/herobase-production-bootstrap-v4.sh
          bash -n ops/herobase-production-bootstrap.sh
          test "$GITHUB_RUN_ATTEMPT" = '1'

      - name: Execute idempotent bounded bootstrap v4
        id: bootstrap
        shell: bash
        run: bash ops/herobase-production-bootstrap-v4.sh

      - name: Write immutable bootstrap result
        if: always()
        env:
          EXIT_CODE: ${{ steps.bootstrap.outputs.bootstrap_exit_code }}
          CF_TOKEN_VERIFIED: ${{ steps.bootstrap.outputs.cf_token_verified }}
          SECRET_NAMES_READY: ${{ steps.bootstrap.outputs.secret_names_ready }}
          HOST_VERIFIED: ${{ steps.bootstrap.outputs.host_verified }}
          DEPLOY_USER_VERIFIED: ${{ steps.bootstrap.outputs.deploy_user_verified }}
          ROLLBACK_ATTEMPTED: ${{ steps.bootstrap.outputs.rollback_attempted }}
          ROLLBACK_SUCCEEDED: ${{ steps.bootstrap.outputs.rollback_succeeded }}
          AUTHORIZED_SCRIPT_SHA256: ${{ needs.authorize.outputs.script_sha256 }}
          AUTHORIZED_BASE_SCRIPT_SHA256: ${{ needs.authorize.outputs.base_script_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg target_sha "$TARGET_SHA" \
            --arg script_sha256 "$AUTHORIZED_SCRIPT_SHA256" \
            --arg base_script_sha256 "$AUTHORIZED_BASE_SCRIPT_SHA256" \
            --arg exit_code "${EXIT_CODE:-unknown}" \
            --argjson cf_token_verified "${CF_TOKEN_VERIFIED:-false}" \
            --argjson secret_names_ready "${SECRET_NAMES_READY:-false}" \
            --argjson host_verified "${HOST_VERIFIED:-false}" \
            --argjson deploy_user_verified "${DEPLOY_USER_VERIFIED:-false}" \
            --argjson rollback_attempted "${ROLLBACK_ATTEMPTED:-false}" \
            --argjson rollback_succeeded "${ROLLBACK_SUCCEEDED:-false}" \
            --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{target_sha:$target_sha,script_sha256:$script_sha256,base_script_sha256:$base_script_sha256,exit_code:$exit_code,cf_token_verified:$cf_token_verified,secret_names_ready:$secret_names_ready,host_verified:$host_verified,deploy_user_verified:$deploy_user_verified,rollback_attempted:$rollback_attempted,rollback_succeeded:$rollback_succeeded,completed_at:$completed_at}' \
            > herobase-bootstrap-v4-result.json

      - name: Upload immutable bootstrap result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: herobase-bootstrap-v4-${{ github.sha }}
          path: herobase-bootstrap-v4-result.json
          retention-days: 30
          if-no-files-found: error

      - name: Remove ephemeral runner SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/vds_key" "$HOME/.ssh/known_hosts" "$RUNNER_TEMP/vds-keyscan-v4"

      - name: Enforce verified bootstrap
        if: always()
        env:
          EXIT_CODE: ${{ steps.bootstrap.outputs.bootstrap_exit_code }}
          CF_TOKEN_VERIFIED: ${{ steps.bootstrap.outputs.cf_token_verified }}
          SECRET_NAMES_READY: ${{ steps.bootstrap.outputs.secret_names_ready }}
          HOST_VERIFIED: ${{ steps.bootstrap.outputs.host_verified }}
          DEPLOY_USER_VERIFIED: ${{ steps.bootstrap.outputs.deploy_user_verified }}
          ROLLBACK_ATTEMPTED: ${{ steps.bootstrap.outputs.rollback_attempted }}
        shell: bash
        run: |
          test "$EXIT_CODE" = '0'
          test "$CF_TOKEN_VERIFIED" = 'true'
          test "$SECRET_NAMES_READY" = 'true'
          test "$HOST_VERIFIED" = 'true'
          test "$DEPLOY_USER_VERIFIED" = 'true'
          test "${ROLLBACK_ATTEMPTED:-false}" = 'false'
