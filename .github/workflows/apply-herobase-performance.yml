name: Apply authorized HeroBase performance remediation

on:
  push:
    branches:
      - perf/herobase-public-bootstrap-20260724

permissions:
  contents: write

concurrency:
  group: apply-herobase-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: stage performance remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact performance branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: perf/herobase-public-bootstrap-20260724
          fetch-depth: 0
          show-progress: false

      - name: Verify and apply bounded performance patches
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "perf/herobase-public-bootstrap-20260724"
          test "$(git rev-parse HEAD^)" = "b89b238e57da4e2783395ee5f22072eb21fd6bab"
          test "$(git log -1 --pretty=%s)" = "chore: stage performance remediation"
          test -z "$(git status --porcelain)"

          mapfile -t patches < <(find ops/performance/patches -maxdepth 1 -type f -name '*.patch' -print | sort)
          test "${#patches[@]}" -eq 6

          for patch in "${patches[@]}"; do
            sha256sum "$patch"
            git apply --check "$patch"
          done

          for patch in "${patches[@]}"; do
            git apply "$patch"
          done

          rm -rf ops/performance
          git diff --check
          test -z "$(git diff --name-only | grep '^.github/workflows/' || true)"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Activate repository-pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          test "$(pnpm --version)" = "10.34.4"
          test ! -e package-lock.json

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Test
        env:
          VITE_WALLETCONNECT_PROJECT_ID: ci-audit-placeholder
        run: pnpm test

      - name: Production build
        env:
          VITE_WALLETCONNECT_PROJECT_ID: ci-audit-placeholder
        run: pnpm build

      - name: Verify public landing critical path
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-landing-bundle.mjs | tee "$RUNNER_TEMP/landing-bundle-report.txt"

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: herobase-public-bootstrap-${{ github.sha }}
          path: |
            ${{ runner.temp }}/landing-bundle-report.txt
            dist/public/.vite/manifest.json
          retention-days: 14
          if-no-files-found: warn

      - name: Commit and push validated application tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VETS Performance Remediation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "perf: split public bootstrap from DApp runtime"
          git push origin HEAD:perf/herobase-public-bootstrap-20260724
          final_sha="$(git rev-parse HEAD)"
          [[ "$final_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'Validated performance SHA: %s\n' "$final_sha"
