name: Temporary install verified Cloudflare production secret

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  install:
    if: >-
      github.repository == 'jratdish1/hero-dapp' &&
      github.actor == github.repository_owner &&
      github.event.pull_request.number == 59 &&
      github.event.pull_request.head.ref == 'ops/herobase-deploy-monitor-20260725' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.head_commit.message == 'chore: install verified Cloudflare production secret'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VDS_HOST: ${{ secrets.VDS_HOST }}
      VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}

    steps:
      - name: Establish pinned VDS-M route
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VDS_HOST"
          test -n "$VDS_SSH_KEY"
          [[ "$CF_ZONE_ID" =~ ^[0-9a-fA-F]{32}$ ]]
          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VDS_SSH_KEY" > "$HOME/.ssh/vds_key"
          ssh-keygen -y -f "$HOME/.ssh/vds_key" >/dev/null
          ssh-keyscan -T 10 -t ed25519 -H "$VDS_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          actual="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" | awk '{print $2}')"
          test "$actual" = 'SHA256:EdmFXzo/0Tw9jlbH+tNfBGcRGDf1TQu8m0LWiobRXFY'
          chmod 600 "$HOME/.ssh/vds_key" "$HOME/.ssh/known_hosts"

      - name: Verify and install protected environment secret
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/vds_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "root@$VDS_HOST" \
            bash -s -- "$CF_ZONE_ID" <<'VDS'
          set -euo pipefail
          ZONE_ID="$1"
          test -s /root/.env_architecture
          set -a
          . /root/.env_architecture
          set +a
          token="${CLOUDFLARE_API_TOKEN:-}"
          test -n "$token"

          verify="$(curl -4 --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          jq -e '.success == true and .result.status == "active" and ((.errors // []) | length == 0)' \
            <<<"$verify" >/dev/null

          zone="$(curl -4 --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID")"
          jq -e '.success == true and .result.name == "herobase.io" and .result.status == "active" and ((.errors // []) | length == 0)' \
            <<<"$zone" >/dev/null

          gh auth status >/dev/null
          gh repo view jratdish1/hero-dapp >/dev/null
          printf '%s' "$token" | gh secret set CF_API_TOKEN \
            --env production \
            --repo jratdish1/hero-dapp

          names="$(gh secret list --env production --repo jratdish1/hero-dapp \
            --json name --jq 'map(.name) | sort | join(" ")')"
          case " $names " in
            *' CF_API_TOKEN '*) ;;
            *) echo 'CF_API_TOKEN was not present after installation' >&2; exit 1 ;;
          esac
          printf 'CF_API_TOKEN_SECRET=SET_AND_VERIFIED\n'
          printf 'PRODUCTION_SECRET_NAMES=%s\n' "$names"
          unset token verify zone
          VDS

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/vds_key" "$HOME/.ssh/known_hosts"
