name: Apply authorized VETS remediation

on:
  push:
    branches:
      - fix/security-high-vulns-2026-07-16
  pull_request:
    branches:
      - main

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-vets-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/security-high-vulns-2026-07-16' || github.head_ref == 'fix/security-high-vulns-2026-07-16'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/security-high-vulns-2026-07-16
          fetch-depth: 0
          show-progress: false

      - name: Diagnose bounded patch set
        id: patch_gate
        shell: bash
        run: |
          set -uo pipefail
          diagnostics="$RUNNER_TEMP/patch-diagnostics.txt"
          : > "$diagnostics"
          ok=true

          {
            printf 'HEAD=%s\n' "$(git rev-parse HEAD)"
            printf 'PARENT=%s\n' "$(git rev-parse HEAD^)"
            printf 'MESSAGE=%s\n' "$(git log -1 --pretty=%s)"
            printf 'BRANCH=%s\n' "$(git branch --show-current)"
            printf 'STATUS=%s\n' "$(git status --porcelain | wc -l)"
          } >> "$diagnostics"

          if [ "$(git branch --show-current)" != "fix/security-high-vulns-2026-07-16" ]; then ok=false; fi
          if [ "$(git rev-parse HEAD^)" != "049a2b5bf05f49fe7d00366a2f1b0cddc9cdbe82" ]; then ok=false; fi
          if [ "$(git log -1 --pretty=%s)" != "chore: stage authorized VETS remediation" ]; then ok=false; fi
          if [ -n "$(git status --porcelain)" ]; then ok=false; fi

          mapfile -t patches < <(find ops/audit-remediation -maxdepth 1 -type f -name '*.patch' -print | sort)
          printf 'PATCH_COUNT=%s\n' "${#patches[@]}" >> "$diagnostics"
          if [ "${#patches[@]}" -ne 6 ]; then ok=false; fi

          for patch in "${patches[@]}"; do
            printf '\n=== %s ===\n' "$patch" >> "$diagnostics"
            sha256sum "$patch" >> "$diagnostics" 2>&1 || ok=false
            if git apply --3way --check "$patch" >> "$diagnostics" 2>&1; then
              printf 'CHECK=PASS\n' >> "$diagnostics"
            else
              printf 'CHECK=FAIL\n' >> "$diagnostics"
              ok=false
            fi
          done

          cat "$diagnostics"
          printf 'ok=%s\n' "$ok" >> "$GITHUB_OUTPUT"

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: patch-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/patch-diagnostics.txt
          retention-days: 7
          if-no-files-found: error

      - name: Enforce patch gate
        if: steps.patch_gate.outputs.ok != 'true'
        shell: bash
        run: exit 1

      - name: Apply bounded patches
        if: steps.patch_gate.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for patch in \
            ops/audit-remediation/client_src_pages_HeroStake.tsx.patch \
            ops/audit-remediation/client_src_pages_SpinWheel.tsx.patch \
            ops/audit-remediation/server__core_security.ts.patch \
            ops/audit-remediation/server_db.ts.patch \
            ops/audit-remediation/server_routers.ts.patch \
            ops/audit-remediation/ci.patch; do
            git apply --3way "$patch"
          done
          rm -rf ops/audit-remediation
          rm -f .github/workflows/apply-vets-remediation.yml

      - name: Setup Node
        if: steps.patch_gate.outputs.ok == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate exact remediated tree
        id: validation_gate
        if: steps.patch_gate.outputs.ok == 'true'
        env:
          VITE_WALLETCONNECT_PROJECT_ID: ci-audit-placeholder
        shell: bash
        run: |
          set -uo pipefail
          diagnostics="$RUNNER_TEMP/validation-diagnostics"
          mkdir -p "$diagnostics"
          summary="$diagnostics/summary.txt"
          : > "$summary"
          ok=true

          run_gate() {
            local name="$1"
            shift
            local log="$diagnostics/$name.log"
            printf '\n=== %s ===\n' "$name" | tee -a "$summary"
            if "$@" >"$log" 2>&1; then
              printf 'STATUS=PASS\n' | tee -a "$summary"
            else
              status=$?
              printf 'STATUS=FAIL EXIT=%s\n' "$status" | tee -a "$summary"
              ok=false
            fi
            cat "$log"
          }

          run_gate corepack bash -lc 'corepack enable && corepack prepare pnpm@10.34.4 --activate && test "$(pnpm --version)" = "10.34.4"'
          run_gate install pnpm install --frozen-lockfile
          run_gate typecheck pnpm check
          run_gate tests pnpm test
          run_gate build pnpm build
          run_gate prod-audit pnpm audit --prod --audit-level=high

          printf '\nOVERALL=%s\n' "$ok" | tee -a "$summary"
          printf 'ok=%s\n' "$ok" >> "$GITHUB_OUTPUT"

      - name: Upload validation diagnostics
        if: always() && steps.patch_gate.outputs.ok == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/validation-diagnostics
          retention-days: 7
          if-no-files-found: error

      - name: Enforce validation gate
        if: steps.patch_gate.outputs.ok == 'true' && steps.validation_gate.outputs.ok != 'true'
        shell: bash
        run: exit 1

      - name: Commit and push exact validated tree
        if: steps.patch_gate.outputs.ok == 'true' && steps.validation_gate.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VETS Fleet Remediation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix: complete production audit remediation"
          git push origin HEAD:fix/security-high-vulns-2026-07-16
          final_sha="$(git rev-parse HEAD)"
          [[ "$final_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'Final remediated SHA: %s\n' "$final_sha"

      - name: Dispatch exact-head CI and security gates
        if: steps.patch_gate.outputs.ok == 'true' && steps.validation_gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg ref 'fix/security-high-vulns-2026-07-16' '{ref:$ref}')"
          for workflow in ci.yml security-and-quality.yml; do
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" \
              --data "$payload"
          done
