name: Apply authorized VETS remediation

on:
  push:
    branches:
      - fix/security-high-vulns-2026-07-16
  pull_request:
    branches:
      - main

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-vets-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/security-high-vulns-2026-07-16' || github.head_ref == 'fix/security-high-vulns-2026-07-16'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/security-high-vulns-2026-07-16
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify and apply bounded patches
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/security-high-vulns-2026-07-16"
          test "$(git rev-parse HEAD^)" = "b587472bc6788c16c27b49f7b2a0de862acda47d"
          test "$(git log -1 --pretty=%s)" = "chore: stage authorized VETS remediation"
          test -z "$(git status --porcelain)"

          mapfile -t patches < <(find ops/audit-remediation -maxdepth 1 -type f -name '*.patch' -print | sort)
          test "${#patches[@]}" -eq 6

          failed=0
          for patch in "${patches[@]}"; do
            sha256sum "$patch"
            if ! git apply --3way --check "$patch"; then
              printf 'PATCH_CHECK_FAILED=%s\n' "$patch" >&2
              failed=1
            fi
          done
          test "$failed" -eq 0

          for patch in \
            ops/audit-remediation/client_src_pages_HeroStake.tsx.patch \
            ops/audit-remediation/client_src_pages_SpinWheel.tsx.patch \
            ops/audit-remediation/server__core_security.ts.patch \
            ops/audit-remediation/server_db.ts.patch \
            ops/audit-remediation/server_routers.ts.patch \
            ops/audit-remediation/ci.patch; do
            git apply --3way "$patch"
          done

          rm -rf ops/audit-remediation
          rm -f .github/workflows/apply-vets-remediation.yml

      - name: Validate exact remediated tree
        env:
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          test "$(pnpm --version)" = "10.34.4"
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          pnpm build
          pnpm audit --prod --audit-level=high

      - name: Commit and push exact validated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VETS Fleet Remediation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix: complete production audit remediation"
          git push origin HEAD:fix/security-high-vulns-2026-07-16
          final_sha="$(git rev-parse HEAD)"
          [[ "$final_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'Final remediated SHA: %s\n' "$final_sha"

      - name: Dispatch exact-head CI and security gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg ref 'fix/security-high-vulns-2026-07-16' '{ref:$ref}')"
          for workflow in ci.yml security-and-quality.yml; do
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" \
              --data "$payload"
          done
