# Dependabot configuration - limits noise from transitive dependency conflicts
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # Only create PRs for direct dependencies, not transitive
    allow:
      - dependency-type: "direct"
    # Auto-dismiss if version conflict exists
    open-pull-requests-limit: 3
    # Group all updates into one PR
    groups:
      all-deps:
        patterns:
          - "*"
    # Ignore packages with known breaking changes
    ignore:
      - dependency-name: "wouter"
        versions: [">=4.0.0"]
      - dependency-name: "ip-address"
        versions: [">=10.0.0"]
      - dependency-name: "ws"
        versions: [">=9.0.0"]
