# OPTIONAL — for sites whose HTML we don't edit (static vicfoundation.com, wallet.herobase.io).
# Include inside `location / { ... }` (static files only). Requires ngx_http_sub_module (stock Ubuntu nginx has it).
# Toggle off = remove the include + reload. Page CSP must allow script-src 'self'.
sub_filter_once on;
sub_filter_types text/html;
sub_filter '</body>' '<script src="/grok-chat/grok-chat.js" defer data-endpoint="/api/grok-chat" data-title="Hero Wallet Info" data-greeting="Hi! Ask me about the Hero Wallet extension." data-fallback-url="https://github.com/jratdish1/hero-wallet/tree/main/docs" data-fallback-label="Wallet docs" data-notice="AI answers can be wrong. Never share your seed phrase."></script></body>';
