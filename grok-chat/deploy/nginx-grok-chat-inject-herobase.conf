# OPTIONAL — for sites whose HTML we don't edit (static vicfoundation.com, wallet.herobase.io).
# Include inside `location / { ... }` (static files only). Requires ngx_http_sub_module (stock Ubuntu nginx has it).
# Toggle off = remove the include + reload. Page CSP must allow script-src 'self'.
sub_filter_once on;
sub_filter_types text/html;
sub_filter '</body>' '<script src="/grok-chat/grok-chat.js" defer data-endpoint="/api/grok-chat" data-title="HERO Dapp Help" data-greeting="Hi! Ask me where to find swaps, staking, DCA, the DAO, and more." data-fallback-url="https://t.me/VetsInCrypto" data-fallback-label="Telegram support" data-notice="AI answers can be wrong. Not financial advice. Never share your seed phrase."></script></body>';
