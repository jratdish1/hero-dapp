# /etc/nginx/conf.d/grok-chat-zone.conf  (http{} context, install once per host)
# Key on the real visitor IP behind Cloudflare; fall back to the socket address.
map $http_cf_connecting_ip $grokchat_client { "" $binary_remote_addr; default $http_cf_connecting_ip; }
limit_req_zone $grokchat_client zone=grokchat:10m rate=12r/m;
limit_req_status 429;
map $http_cf_connecting_ip $grokchat_client_ip { "" $remote_addr; default $http_cf_connecting_ip; }
