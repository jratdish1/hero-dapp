# Include inside the site's server { listen 443 ... } block:
#   include /etc/nginx/snippets/grok-chat-herobase.conf;
# Exact-match location wins over the SPA/app proxy, so the app's CSRF/CSP middleware is untouched.
location = /api/grok-chat {
    limit_req zone=grokchat burst=4 nodelay;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:3312;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $grokchat_client_ip;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 30s;
}
location = /api/grok-chat/health { proxy_pass http://127.0.0.1:3312; allow 127.0.0.1; deny all; }
location ^~ /grok-chat/ {
    alias /opt/grok-chat/herobase/public/;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options nosniff;
}
